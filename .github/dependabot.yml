# INFRA-003: Dependency vulnerability scanning with Dependabot
# Automatically creates PRs to update dependencies with security vulnerabilities
# Also keeps dependencies up-to-date on a weekly schedule

version: 2
registries:
  # GitHub Container Registry for Docker images
  ghcr:
    type: docker-registry
    url: https://ghcr.io
    username: ${{ github.actor }}
    password: ${{ secrets.GITHUB_TOKEN }}

updates:
  # Go modules (main codebase)
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      # Group Cosmos SDK and related updates
      cosmos-sdk:
        patterns:
          - "github.com/cosmos/*"
          - "github.com/cometbft/*"
          - "cosmossdk.io/*"
        update-types:
          - "minor"
          - "patch"
      # Group crypto/security libraries
      crypto:
        patterns:
          - "golang.org/x/crypto"
          - "github.com/btcsuite/*"
          - "github.com/tyler-smith/*"
      # Group testing libraries
      testing:
        patterns:
          - "github.com/stretchr/testify"
          - "github.com/golang/mock"
          - "go.uber.org/mock"
          - "github.com/jarcoal/httpmock"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "virtengine/core-maintainers"

  # Go modules (SDK subdirectory)
  - package-ecosystem: "gomod"
    directory: "/sdk"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
      - "sdk"
    commit-message:
      prefix: "chore(deps)"

  # Python dependencies (ML pipelines)
  - package-ecosystem: "pip"
    directory: "/ml"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      ml-frameworks:
        patterns:
          - "tensorflow*"
          - "torch*"
          - "numpy"
          - "scipy"
          - "scikit-learn"
      security:
        patterns:
          - "cryptography"
          - "pynacl"
          - "certifi"
    labels:
      - "dependencies"
      - "python"
      - "ml"
    commit-message:
      prefix: "chore(deps)"

  # Python test dependencies
  - package-ecosystem: "pip"
    directory: "/tests/python"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
      - "tests"
    commit-message:
      prefix: "chore(deps)"

  # Bosun is a git SUBMODULE (.gitmodules: path = scripts/bosun).
  #
  # Dependabot does not descend into submodules, so an npm key here cannot
  # resolve a manifest and never produces a run at all - it reads as coverage
  # while scanning nothing. Bosun's own dependency scanning is configured and
  # runs in the virtengine/bosun repository (that is where its dependabot PRs
  # #624-#636 are raised). Removed here so the key list states only what is
  # actually scanned.
  #
  # NOTE: /lib/portal below is the one remaining in-repo npm key that is also
  # unscannable-by-config - it is a pnpm workspace member with no tracked
  # package-lock.json. It is kept because it does receive version-update runs;
  # see .github/tests/test_dependabot_manifest_coverage_policy.py for what is
  # enforced.

  # npm dependencies (Portal library)
  - package-ecosystem: "npm"
    directory: "/lib/portal"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      react:
        patterns:
          - "react*"
          - "@react/*"
      testing:
        patterns:
          - "jest"
          - "@testing-library/*"
          - "vitest"
    labels:
      - "dependencies"
      - "npm"
      - "portal"
    commit-message:
      prefix: "chore(deps)"

  # npm dependencies (SDK TypeScript)
  #
  # sdk/ts is installed by npm (`package-lock.json` is tracked and CI runs
  # `npm ci`), so Dependabot must be pointed at the directory itself. Without
  # this key, security advisories in sdk/ts (58 open alerts) can never raise a
  # fix PR: the only npm keys that existed covered /scripts/bosun (a submodule,
  # which Dependabot cannot scan at all) and /lib/portal.
  - package-ecosystem: "npm"
    directory: "/sdk/ts"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "sdk"
    commit-message:
      prefix: "build(deps)"

  # npm dependencies (SDK portal workspace)
  #
  # sdk/portal ships its own tracked pnpm-lock.yaml (83 open alerts).
  - package-ecosystem: "npm"
    directory: "/sdk/portal"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "sdk"
    commit-message:
      prefix: "build(deps)"

  # npm dependencies (mobile capture app)
  #
  # This directory is its own lockfile island, outside the root pnpm workspace:
  # it carries a package-lock.json AND a pnpm-lock.yaml (48 open alerts across
  # both). Dependabot reads the npm ecosystem, so it needs the key.
  - package-ecosystem: "npm"
    directory: "/mobile/veid-capture-app"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "mobile"
    commit-message:
      prefix: "build(deps)"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/_build"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      # Group all GitHub Actions updates
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
