name: PR Security Check

on:
  pull_request:
    branches:
      - main
      - mainnet/main
      - develop
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  # The key MUST include the commit sha. On the `push:` trigger
  # `github.event.pull_request.number` is EMPTY, so every push run landed in the
  # same group (`pr-security-Security-`) and cancelled the in-flight one - which
  # is why a `Go Security Scan` leg is cancelled at 0s on essentially every
  # develop push, and why this job has never reached a verdict either. Keying on
  # the sha makes each commit's run independent; superseded runs of the same
  # commit still cancel, which is the protection cancel-in-progress is for.
  group: pr-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.8"
  GOVULNCHECK_VERSION: "v1.1.4"
  GOSEC_VERSION: "v2.25.0"
  GITLEAKS_VERSION: "v8.30.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  PYTHON_VERSION: "3.11"
  GOWORK: "off"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  policy-validation:
    name: Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Validate security policy files
        run: |
          python .github/scripts/validate_security_policies.py --files \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml \
            .github/workflows \
            .gitleaks.toml \
            .vulnerability-allowlist.yaml \
            SUPPLY_CHAIN_SECURITY.md

      - name: Validate inference deployment policy
        run: python .github/scripts/validate_inference_deployment_policy.py

      - name: Run policy validator tests
        run: python -m unittest discover -s .github/tests -p "test_*policy*.py"

      # This test does not match the `test_*policy*.py` glob above, so without an
      # explicit step it would never run in CI - a guard that is not wired is not a
      # guard. It pins the gosec target resolution used by the 'Go Security Scan'
      # leg below, so a revert to passing file paths to gosec fails here first.
      - name: Run PR gosec scan-target tests
        run: python .github/tests/test_pr_gosec_scan_targets.py

      # Same reasoning for the gate-matrix install-scope guard. Its only other
      # home is .github/workflows/security.yaml, which triggers on push to
      # main/mainnet/develop and on a nightly schedule - never on a pull request.
      # Tier-1 merges are autonomous, so a push-only check fires AFTER the defect
      # is on develop, where it is then indistinguishable from pre-existing
      # breakage. This step makes it fail on the PR that introduces it.
      #
      # Static shape check: reads the matrix, pnpm-workspace.yaml and per-dir
      # manifests/lockfiles. No network, no install, no toolchain setup needed -
      # it runs on the runner's default node exactly as it does in security.yaml.
      - name: Verify every gated dependency install reaches its own tree
        run: node scripts/validate-required-gate-install-scope.test.cjs

      # Proves the test above can actually go RED. It mutates a COPY of
      # gosec_pr_targets.py (the note back on stdout - the #1115 regression) and
      # REQUIRES the test to fail. A guard that has only ever been seen green is
      # decoration, and this step has already produced two false-red + false-
      # negative defects that a green suite did not catch. Mutates no live file.
      - name: Falsify the PR gosec stdout contract
        run: bash .github/tests/falsify_pr_gosec_stdout_contract.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint targeted workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml

  analyze-changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      go_changed: ${{ steps.changes.outputs.go }}
      deps_changed: ${{ steps.changes.outputs.deps }}
      security_relevant: ${{ steps.changes.outputs.security }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Analyze changed files
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            deps:
              - 'go.mod'
              - 'go.sum'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'portal/package.json'
              - 'lib/portal/package.json'
              - 'lib/admin/package.json'
              - 'lib/capture/package.json'
              - 'sdk/portal/package.json'
              - 'sdk/portal/pnpm-lock.yaml'
              - 'sdk/ts/package.json'
              - 'sdk/ts/package-lock.json'
              - 'ml/**/requirements*.txt'
            security:
              - 'x/veid/**'
              - 'x/mfa/**'
              - 'x/encryption/**'
              - 'pkg/inference/**'
              - 'cmd/inference-sidecar/**'
              - '**/crypto/**'
              - '**/auth/**'

  go-security:
    name: Go Security Scan (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Explicit budget. Without one the job inherited GitHub's 360-minute default
    # and still died to a runner shutdown at ~8 minutes with no legible failure;
    # a tight bound turns an overrun into a visible timeout instead.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Same MEASURED partition of `go list ./...` (318 packages) used by the
        # scheduled gate in security.yaml: several top-level dirs are separate Go
        # modules or hold no packages from the root module's view, so a
        # `./<dir>/...` pattern for them matches nothing, and `.` carries the root
        # package github.com/virtengine/virtengine. Sharding keeps the DEFAULT
        # -scan=symbol in every leg, so the union of the shards' findings is
        # findings-equivalent to one unsharded scan while peak RAM per runner
        # stays bounded - the unsharded scan OOMs a free 7 GB runner at ~8 min.
        # .github/tests/test_govulncheck_shard_partition.sh asserts this partition
        # stays disjoint and keeps unioning to exactly `go list ./...`.
        include:
          - shard: core
            patterns: ". ./x/... ./app/... ./client/... ./pubsub/..."
          - shard: platform
            patterns: "./pkg/..."
          - shard: tooling
            patterns: "./cmd/... ./scripts/... ./tools/... ./docgen/..."
          - shard: tests-and-sim
            patterns: "./tests/... ./testutil/... ./sim/... ./upgrades/... ./sdk/... ./util/..."
    needs:
      - policy-validation
      - analyze-changes
    if: needs.analyze-changes.outputs.go_changed == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install security scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Fetch base branch
        # Fetch the full base branch INTO the remote-tracking ref. The old
        # `git fetch origin "<base>" --depth=1` only updated FETCH_HEAD, left a
        # shallow boundary, and never moved origin/<base> — so every consumer
        # of origin/<base> below read a stale or disjoint ref.
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Run govulncheck
        id: govulncheck
        run: |
          # ONE scan, not two, and only THIS shard's package set. `govulncheck
          # ./...` over this monorepo builds a whole-program call graph and is the
          # memory-heavy step: run twice, or over all 3442 files at once, it OOMs a
          # free 7 GB runner and the job dies to a runner shutdown at ~8 minutes
          # with nothing reported (measured: 8m14s, 8m12s, 8m39s, 8m25s, 11m52s
          # across five runs). The JSON report already carries one `finding`
          # object per REACHABLE vulnerability - the same signal text mode signals
          # with exit 3 - so passing "-" for the text status derives the verdict
          # from the JSON report alone. Same shape as the scheduled gate.
          set +e
          govulncheck -format json ${{ matrix.patterns }} > govulncheck-report.json
          json_status=$?
          set -e
          # Same classification as the scheduled gate: a config-only report means
          # package loading failed and must not be reported as a finding, and a
          # scanner failure must not be reported as a clean scan.
          # Regression cases: .github/tests/test_govulncheck_verdict.sh
          out="$(bash .github/scripts/govulncheck_verdict.sh \
            govulncheck-report.json "$json_status" - 2>&1)"
          echo "$out"
          verdict="$(printf '%s\n' "$out" | sed -n 's/^verdict=//p')"
          # A scanner failure must never be reported as a clean scan.
          if [ "$verdict" = "error" ]; then
            echo "::error::govulncheck could not complete - this is a scanner error, not a vulnerability finding"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Filter findings against the SAME reviewed allowlist the scheduled gate
          # uses, so this leg adjudicates instead of failing closed on reviewed
          # risk. Without this the leg reds on advisories that have no fixed
          # release and no reachable alternative - already reviewed, dated and
          # compensating-controlled in .vulnerability-allowlist.yaml - reddening
          # every Go-touching PR and the standing develop->main integration PR on
          # a finding that is not new work (measured: run 36522313022, all four
          # shards red on the single advisory the scheduled gate allowlists).
          # This does NOT weaken the gate: the allowlist's age, tracking issue
          # and controls are enforced by the policy-validation job, and anything
          # the filter still reports is real work.
          # Exit 3 = un-allowlisted findings remain, 0 = clean.
          set +e
          python .github/scripts/filter_allowlist.py \
            govulncheck-report.json .vulnerability-allowlist.yaml
          filter_status=$?
          set -e
          # Keep the exit_code interface intact for the downstream
          # "Fail on Go security findings" step.
          if [ "$filter_status" -eq 3 ]; then
            echo "verdict_after_allowlist=vulns" >> "$GITHUB_OUTPUT"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            echo "::error::govulncheck reported reachable vulnerabilities not covered by allowlist on shard ${{ matrix.shard }}"
            exit 1
          elif [ "$filter_status" -eq 0 ]; then
            echo "verdict_after_allowlist=clean" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "::error::allowlist filter failed with exit code $filter_status"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run gosec on changed Go source files
        id: gosec
        # gosec is scoped to the CHANGED files, not to the shard, so running it in
        # every matrix leg would repeat the identical scan four times. One leg runs
        # it; the others report the no-op result so the downstream "Fail on Go
        # security findings" step and the summary read the same outputs everywhere.
        if: matrix.shard == 'core'
        run: |
          # gosec is given PACKAGE DIRECTORIES, never file paths. Handed a .go
          # file, gosec v2.25.0 resolves it as a package pattern and reports
          #   "Golang errors": {"pkg/foo/bar.go": [... "cannot find package \".\""]}
          #   "Issues": [], "Stats": {"files": 0, ...}
          # i.e. it imports ZERO files and still exits 1 - a false negative (the
          # only PR-side Go SAST control scanned nothing) AND a false red (the
          # non-zero exit was reported to the reviewer as a security finding).
          # Measured: run 36524756911, job 'Go Security Scan (core)', artifact
          # pr-go-security-report-core -> Stats.files=0 with 2 Golang errors.
          # gosec_pr_targets.py maps the changed files to the packages that own
          # them (dropping tests/.pb.go/vendor the way the old awk did) and fails
          # closed if any changed file is not in a loadable package.
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.go' > changed-go-files.txt
          if [ ! -s changed-go-files.txt ]; then
            echo "no Go files changed in this PR - nothing for gosec to scan"
            python3 .github/scripts/gosec_pr_targets.py --changed-files changed-go-files.txt --write-empty-report
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! python3 .github/scripts/gosec_pr_targets.py --changed-files changed-go-files.txt > gosec-targets.txt; then
            echo "::error::could not resolve the changed Go files to loadable packages - refusing to run gosec, because a target it cannot load reports 0 files analysed AND exits 1"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          mapfile -t gosec_targets < gosec-targets.txt
          if [ "${#gosec_targets[@]}" -eq 0 ]; then
            echo "no scannable Go packages among the changed files (tests/generated only)"
            python3 .github/scripts/gosec_pr_targets.py --changed-files changed-go-files.txt --write-empty-report
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "scanning ${#gosec_targets[@]} package(s): ${gosec_targets[*]}"

          set +e
          gosec -fmt json -out gosec-results.json -exclude-generated "${gosec_targets[@]}"
          json_status=$?
          gosec -fmt sarif -out gosec.sarif -exclude-generated "${gosec_targets[@]}"
          sarif_status=$?
          set -e

          if [ ! -s gosec-results.json ] || [ ! -s gosec.sarif ]; then
            echo "::error::gosec did not produce expected outputs"
            exit 1
          fi

          # A scan that could not load a package is not a clean scan. gosec reports
          # this as a non-zero exit WITH an empty Issues list, so a caller that only
          # looks at findings would record it as a pass. Fail closed on either
          # signal: a non-zero exit, or a report that analysed nothing at all.
          analysis_files=$(python3 -c "import json;print(json.load(open('gosec-results.json')).get('Stats',{}).get('files',0))")
          if [ "$json_status" -ne 0 ] || [ "$sarif_status" -ne 0 ] || [ "$analysis_files" -eq 0 ]; then
            echo "::error::gosec exited $json_status (json) / $sarif_status (sarif) after analysing $analysis_files file(s); Stats.files=0 with a non-zero exit means the scan could not load its targets, not that the code is clean"
            # Name the unloadable targets. This is a diagnostic, not the verdict,
            # so it is allowed to fail without changing the step's outcome - which
            # is why it is wrapped in set +e. A masked-failure idiom is not used
            # here: this repo's policy validator forbids it, and it would hide the
            # very error being diagnosed.
            set +e
            python3 -c "import json;d=json.load(open('gosec-results.json'));e=list((d.get('Golang errors') or {}).keys());print('::error::gosec could not load: '+', '.join(e) if e else '::error::no Golang errors reported')"
            set -e
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v4
        # Only the leg that RAN gosec has a SARIF file to upload: `Run gosec` is
        # gated on `matrix.shard == 'core'`. A bare `always()` therefore made the
        # other three legs fail on a file that was never written (measured: run
        # 36524197867, platform -> 'Upload gosec SARIF' FAILURE, while that leg's
        # govulncheck had already passed). Mirror the gosec step's own condition.
        if: always() && matrix.shard == 'core'
        with:
          sarif_file: gosec.sarif
          # Per-shard category: a fixed category makes the four matrix legs
          # overwrite each other's SARIF upload rather than merging.
          category: gosec-pr-${{ matrix.shard }}

      - name: Upload Go security reports (${{ matrix.shard }})
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr-go-security-report-${{ matrix.shard }}
          path: |
            govulncheck-report.json
            gosec-results.json
          retention-days: 7

      - name: Fail on Go security findings
        # `steps.gosec.outputs.exit_code` is EMPTY on the shards where gosec is
        # skipped, so a bare `!= '0'` would fail those legs on a false premise.
        # Only assert when the step actually ran.
        if: always() && (steps.govulncheck.outputs.exit_code != '0' || (steps.gosec.outcome == 'success' && steps.gosec.outputs.exit_code != '0'))
        run: |
          echo "::error::PR Go security checks failed (shard ${{ matrix.shard }})"
          exit 1

  gitleaks-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          TOOL_DIR="$(mktemp -d)"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz -C "$TOOL_DIR"
          sudo install -m 0755 "$TOOL_DIR/gitleaks" /usr/local/bin/gitleaks

      - name: Fetch base branch
        # Fetch the full base branch INTO the remote-tracking ref. The old
        # `git fetch origin "<base>" --depth=1` only updated FETCH_HEAD, left a
        # shallow boundary, and never moved origin/<base> — so every consumer
        # of origin/<base> below read a stale or disjoint ref.
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Run gitleaks on the pull-request diff
        id: gitleaks
        run: |
          # Resolve the scan range against the base branch fetched above. A
          # shallow or disjoint base makes merge-base exit 1 with empty stdout;
          # under the runner's `set -e` that used to kill this step here with
          # no scan at all (then "Path does not exist: gitleaks.sarif"). Never
          # let an empty base_sha through: fail loudly or fall back to the
          # pull-request base SHA from the event payload.
          base_sha=""
          if base_sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>merge-base.err); then
            echo "merge-base origin/${{ github.base_ref }} HEAD: ${base_sha}"
          else
            echo "::warning::git merge-base against origin/${{ github.base_ref }} failed; falling back to the pull-request base SHA"
            if [ -s merge-base.err ]; then cat merge-base.err; fi
            base_sha="${{ github.event.pull_request.base.sha }}"
          fi
          rm -f merge-base.err
          [ -n "${base_sha}" ] || { echo "::error::could not determine base SHA for secret scan"; exit 1; }
          git rev-parse --verify --quiet "${base_sha}^{commit}" >/dev/null || { echo "::error::base SHA ${base_sha} is not present locally"; exit 1; }
          set +e
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "${base_sha}..HEAD" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif
          status=$?
          set -e
          if [ ! -s gitleaks.sarif ]; then
            echo "::error::gitleaks did not produce a SARIF report"
            exit 1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-pr

      - name: Fail on secret findings
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::PR secret-scanning failed"
          exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
    if: needs.analyze-changes.outputs.deps_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # MIT-CMU: Pillow >=12.3.0's SPDX identifier (permissive MIT variant).
          # CC-BY-4.0: covers data-only packages (e.g. caniuse-lite).
          # LGPL and LicenseRef-scancode riders stay blocked per
          # SUPPLY_CHAIN_SECURITY.md and need a human exception (see task t_a0c63b78).
          allow-licenses: MIT,MIT-CMU,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,Unlicense,CC0-1.0,CC-BY-4.0

  security-lint:
    name: Security Lint
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
    if: needs.analyze-changes.outputs.security_relevant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Fetch base branch
        # Fetch the full base branch INTO the remote-tracking ref. The old
        # `git fetch origin "<base>" --depth=1` only updated FETCH_HEAD, left a
        # shallow boundary, and never moved origin/<base> — so every consumer
        # of origin/<base> below read a stale or disjoint ref.
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Run security-focused golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: >
            --timeout=10m
            --new-from-rev=origin/${{ github.base_ref }}
            --enable=gosec
            --enable=errcheck
            --enable=govet
            ./x/veid/...
            ./x/mfa/...
            ./x/encryption/...
            ./pkg/inference/...
            ./cmd/inference-sidecar/...

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
      - go-security
      - dependency-review
      - security-lint
      - gitleaks-scan
    if: always()
    steps:
      - name: Summarize PR security gates
        run: |
          {
            echo "# PR Security Summary"
            echo ""
            echo "| Gate | Status | Required |"
            echo "|------|--------|----------|"
            echo "| Policy Validation | ${{ needs.policy-validation.result }} | Yes |"
            echo "| Secret Scanning | ${{ needs.gitleaks-scan.result }} | Yes |"

            if [ "${{ needs.analyze-changes.outputs.go_changed }}" = "true" ]; then
              echo "| Go Security Scan | ${{ needs.go-security.result }} | Yes |"
            else
              echo "| Go Security Scan | skipped | No |"
            fi

            if [ "${{ needs.analyze-changes.outputs.deps_changed }}" = "true" ]; then
              echo "| Dependency Review | ${{ needs.dependency-review.result }} | Yes |"
            else
              echo "| Dependency Review | skipped | No |"
            fi

            if [ "${{ needs.analyze-changes.outputs.security_relevant }}" = "true" ]; then
              echo "| Security Lint | ${{ needs.security-lint.result }} | Yes |"
            else
              echo "| Security Lint | skipped | No |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on required PR security failure
        run: |
          FAILED=0

          if [ "${{ needs.policy-validation.result }}" = "failure" ] || [ "${{ needs.policy-validation.result }}" = "cancelled" ]; then
            FAILED=1
          fi

          if [ "${{ needs.gitleaks-scan.result }}" = "failure" ] || [ "${{ needs.gitleaks-scan.result }}" = "cancelled" ]; then
            FAILED=1
          fi

          if [ "${{ needs.analyze-changes.outputs.go_changed }}" = "true" ] && \
             { [ "${{ needs.go-security.result }}" = "failure" ] || [ "${{ needs.go-security.result }}" = "cancelled" ]; }; then
            FAILED=1
          fi

          if [ "${{ needs.analyze-changes.outputs.deps_changed }}" = "true" ] && \
             { [ "${{ needs.dependency-review.result }}" = "failure" ] || [ "${{ needs.dependency-review.result }}" = "cancelled" ]; }; then
            FAILED=1
          fi

          if [ "${{ needs.analyze-changes.outputs.security_relevant }}" = "true" ] && \
             { [ "${{ needs.security-lint.result }}" = "failure" ] || [ "${{ needs.security-lint.result }}" = "cancelled" ]; }; then
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::PR security checks failed"
            exit 1
          fi
