name: PR Security Check

on:
  pull_request:
    branches:
      - main
      - mainnet/main
      - develop
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-security-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.25.5"
  GOVULNCHECK_VERSION: "v1.1.4"
  GOSEC_VERSION: "v2.25.0"
  GITLEAKS_VERSION: "v8.30.1"
  GOLANGCI_LINT_VERSION: "v2.4.0"
  PYTHON_VERSION: "3.11"
  GOWORK: "off"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  policy-validation:
    name: Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Validate security policy files
        run: |
          python .github/scripts/validate_security_policies.py --files \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml \
            .gitleaks.toml \
            .vulnerability-allowlist.yaml \
            SUPPLY_CHAIN_SECURITY.md

      - name: Run policy validator tests
        run: python -m unittest discover -s .github/tests -p "test_security_policy*.py"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint targeted workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml

  analyze-changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      go_changed: ${{ steps.changes.outputs.go }}
      deps_changed: ${{ steps.changes.outputs.deps }}
      security_relevant: ${{ steps.changes.outputs.security }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            deps:
              - 'go.mod'
              - 'go.sum'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'portal/package.json'
              - 'lib/portal/package.json'
              - 'lib/admin/package.json'
              - 'lib/capture/package.json'
              - 'sdk/portal/package.json'
              - 'sdk/portal/pnpm-lock.yaml'
              - 'sdk/ts/package.json'
              - 'sdk/ts/package-lock.json'
              - 'ml/**/requirements*.txt'
            security:
              - 'x/veid/**'
              - 'x/mfa/**'
              - 'x/encryption/**'
              - 'pkg/inference/**'
              - 'cmd/inference-sidecar/**'
              - '**/crypto/**'
              - '**/auth/**'

  go-security:
    name: Go Security Scan
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
    if: needs.analyze-changes.outputs.go_changed == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install security scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Run govulncheck
        id: govulncheck
        run: |
          set +e
          govulncheck -format json ./... > govulncheck-report.json
          json_status=$?
          govulncheck ./...
          text_status=$?
          set -e
          if [ ! -s govulncheck-report.json ]; then
            echo "::error::govulncheck did not produce a report"
            exit 1
          fi
          if [ "$json_status" -ne 0 ] || [ "$text_status" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gosec on changed Go source files
        id: gosec
        run: |
          mapfile -t changed_files < <(
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.go' \
              | awk '!/_test\.go$/ && !/^vendor\// && !/\.pb\.go$/'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            cat > gosec-results.json <<'EOF'
          {"Issues":[]}
          EOF
            cat > gosec.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "gosec",
                    "informationUri": "https://github.com/securego/gosec",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          gosec -fmt json -out gosec-results.json -exclude-generated "${changed_files[@]}"
          json_status=$?
          gosec -fmt sarif -out gosec.sarif -exclude-generated "${changed_files[@]}"
          sarif_status=$?
          set -e

          if [ ! -s gosec-results.json ] || [ ! -s gosec.sarif ]; then
            echo "::error::gosec did not produce expected outputs"
            exit 1
          fi

          if [ "$json_status" -ne 0 ] || [ "$sarif_status" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec-pr

      - name: Upload Go security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-go-security-report
          path: |
            govulncheck-report.json
            gosec-results.json
          retention-days: 7

      - name: Fail on Go security findings
        if: steps.govulncheck.outputs.exit_code != '0' || steps.gosec.outputs.exit_code != '0'
        run: |
          echo "::error::PR Go security checks failed"
          exit 1

  gitleaks-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Run gitleaks on the pull-request diff
        id: gitleaks
        run: |
          base_sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          set +e
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "${base_sha}..HEAD" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif
          status=$?
          set -e
          if [ ! -s gitleaks.sarif ]; then
            echo "::error::gitleaks did not produce a SARIF report"
            exit 1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-pr

      - name: Fail on secret findings
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::PR secret-scanning failed"
          exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
    if: needs.analyze-changes.outputs.deps_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,Unlicense,CC0-1.0

  security-lint:
    name: Security Lint
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
    if: needs.analyze-changes.outputs.security_relevant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Run security-focused golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: >
            --timeout=10m
            --new-from-rev=origin/${{ github.base_ref }}
            --enable=gosec
            --enable=errcheck
            --enable=govet
            ./x/veid/...
            ./x/mfa/...
            ./x/encryption/...
            ./pkg/inference/...
            ./cmd/inference-sidecar/...

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - analyze-changes
      - go-security
      - dependency-review
      - security-lint
      - gitleaks-scan
    if: always()
    steps:
      - name: Summarize PR security gates
        run: |
          echo "# PR Security Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status | Required |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Policy Validation | ${{ needs.policy-validation.result }} | Yes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret Scanning | ${{ needs.gitleaks-scan.result }} | Yes |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.analyze-changes.outputs.go_changed }}" = "true" ]; then
            echo "| Go Security Scan | ${{ needs.go-security.result }} | Yes |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Go Security Scan | skipped | No |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.analyze-changes.outputs.deps_changed }}" = "true" ]; then
            echo "| Dependency Review | ${{ needs.dependency-review.result }} | Yes |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Dependency Review | skipped | No |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.analyze-changes.outputs.security_relevant }}" = "true" ]; then
            echo "| Security Lint | ${{ needs.security-lint.result }} | Yes |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Security Lint | skipped | No |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on required PR security failure
        run: |
          FAILED=0

          if [ "${{ needs.policy-validation.result }}" = "failure" ] || [ "${{ needs.policy-validation.result }}" = "cancelled" ]; then
            FAILED=1
          fi

          if [ "${{ needs.gitleaks-scan.result }}" = "failure" ] || [ "${{ needs.gitleaks-scan.result }}" = "cancelled" ]; then
            FAILED=1
          fi

          if [ "${{ needs.analyze-changes.outputs.go_changed }}" = "true" ] && \
             { [ "${{ needs.go-security.result }}" = "failure" ] || [ "${{ needs.go-security.result }}" = "cancelled" ]; }; then
            FAILED=1
          fi

          if [ "${{ needs.analyze-changes.outputs.deps_changed }}" = "true" ] && \
             { [ "${{ needs.dependency-review.result }}" = "failure" ] || [ "${{ needs.dependency-review.result }}" = "cancelled" ]; }; then
            FAILED=1
          fi

          if [ "${{ needs.analyze-changes.outputs.security_relevant }}" = "true" ] && \
             { [ "${{ needs.security-lint.result }}" = "failure" ] || [ "${{ needs.security-lint.result }}" = "cancelled" ]; }; then
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::PR security checks failed"
            exit 1
          fi
