# ML Determinism Verification Workflow

name: ML Determinism Verification

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_extended:
        description: "Run extended conformance suite"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ml-determinism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25.5"
  GO_TEST_TIMEOUT_UNIT: "30m"
  TF_DETERMINISTIC_OPS: "1"
  TF_CUDNN_DETERMINISTIC: "1"
  TF_USE_CUDNN_AUTOTUNE: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  CUDA_VISIBLE_DEVICES: "-1"
  PYTHONHASHSEED: "42"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  go-inference-determinism:
    name: Go Inference Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run determinism unit tests
        run: |
          go test -v -count=1 -timeout "${GO_TEST_TIMEOUT_UNIT}" \
            ./pkg/inference/... -run "Determinism|Hash|Golden"
        timeout-minutes: 15

      - name: Run conformance suite
        shell: bash
        run: |
          mkdir -p ./conformance-evidence
          VEID_CONFORMANCE_EVIDENCE_DIR=./conformance-evidence go test -v -count=1 \
            -timeout "${GO_TEST_TIMEOUT_UNIT}" \
            ./pkg/inference/... -run "TestMultiMachineConformanceSuite"
        timeout-minutes: 20

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence-${{ matrix.os }}
          path: ./conformance-evidence/
          retention-days: 30
          if-no-files-found: error

  cross-platform-hashes:
    name: Cross-Platform Hash Verification
    runs-on: ubuntu-latest
    needs: go-inference-determinism
    if: always()
    steps:
      - name: Download all evidence
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-evidence-*
          path: ./all-evidence
          merge-multiple: false

      - name: Compare cross-platform hashes
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          expected_platforms = {
              "conformance-evidence-ubuntu-latest",
              "conformance-evidence-windows-latest",
              "conformance-evidence-macos-latest",
          }
          evidence_dirs = {p.name for p in Path("all-evidence").iterdir() if p.is_dir()}
          missing = sorted(expected_platforms - evidence_dirs)
          if missing:
              raise SystemExit(f"Missing conformance evidence directories: {missing}")

          canonical = None
          summary_lines = []
          for directory in sorted(Path("all-evidence").iterdir()):
              if not directory.is_dir():
                  continue
              json_files = sorted(directory.glob("*.json"))
              if not json_files:
                  raise SystemExit(f"No JSON evidence found in {directory}")

              payload = json.loads(json_files[0].read_text(encoding="utf-8"))
              if not payload.get("overall_passed", False):
                  raise SystemExit(f"Conformance evidence reports failure for {directory.name}")

              hash_map = {
                  result["test_name"]: result["hash"]
                  for result in payload.get("results", [])
                  if result.get("hash")
              }
              if not hash_map:
                  raise SystemExit(f"No deterministic hashes captured for {directory.name}")

              summary_lines.append(f"{directory.name}: {len(hash_map)} hashes")
              if canonical is None:
                  canonical = hash_map
              elif hash_map != canonical:
                  raise SystemExit(
                      f"Cross-platform hash mismatch for {directory.name}: {hash_map} != {canonical}"
                  )

          Path("cross-platform-report.md").write_text(
              "# Cross-Platform Determinism Report\n\n"
              + "\n".join(f"- {line}" for line in summary_lines)
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload cross-platform report
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-report
          path: cross-platform-report.md
          retention-days: 30

  python-ml-determinism:
    name: Python ML Determinism
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install deterministic dependencies
        run: |
          cd ml
          if [ -f requirements-deterministic.txt ]; then
            pip install -r requirements-deterministic.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify TensorFlow determinism settings
        run: |
          python3 - <<'PY'
          import os
          import sys

          required_vars = {
              "TF_DETERMINISTIC_OPS": "1",
              "TF_CUDNN_DETERMINISTIC": "1",
              "OMP_NUM_THREADS": "1",
          }

          for var, expected in required_vars.items():
              actual = os.environ.get(var, "")
              if actual != expected:
                  print(f"ERROR: {var} should be {expected}, got {actual}")
                  sys.exit(1)
              print(f"OK: {var}={actual}")
          PY

      - name: Run Python determinism tests
        run: |
          cd ml
          if [ -f test_determinism.py ]; then
            python3 test_determinism.py
          elif [ -d tests ]; then
            python3 -m pytest tests/ -k "determinism or determin" -v
          else
            echo "::error::No Python determinism test entrypoint found in ml/"
            exit 1
          fi

  model-hash-verification:
    name: Model Hash Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify model hash pinning
        run: |
          go test -v -count=1 ./pkg/inference/... -run "TestModelHash|TestPinnedModel" -timeout 10m

      - name: Check pinned registry
        run: |
          go test -v -count=1 -timeout "${GO_TEST_TIMEOUT_UNIT}" \
            ./pkg/inference/... -run "TestPinnedModelRegistry"

  config-validation:
    name: Production Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate production determinism config
        run: |
          go test -v -count=1 -timeout "${GO_TEST_TIMEOUT_UNIT}" \
            ./pkg/inference/... -run "TestProductionDeterminismConfig|TestProductionConfig"

      - name: Verify CPU-only enforcement
        run: |
          go test -v -count=1 -timeout "${GO_TEST_TIMEOUT_UNIT}" \
            ./pkg/inference/... -run "TestCPUOnly|TestForceCPU"

      - name: Check random seed is production value
        run: |
          if grep -R "ProductionRandomSeed.*=.*42" pkg/inference/; then
            echo "Production random seed is 42"
          else
            echo "::error::Production random seed may have changed"
            exit 1
          fi

  extended-conformance:
    name: Extended Conformance Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_extended == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run extended conformance
        run: |
          VEID_EXTENDED_CONFORMANCE=true go test -v -count=3 ./pkg/inference/... -run "Conformance" -timeout 60m

      - name: Run stress tests
        run: |
          go test -v -count=10 ./pkg/inference/... -run "Hash" -timeout 30m

  summary:
    name: Determinism Summary
    runs-on: ubuntu-latest
    needs:
      - go-inference-determinism
      - cross-platform-hashes
      - python-ml-determinism
      - model-hash-verification
      - config-validation
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          FAILED=0

          if [ "${{ needs.go-inference-determinism.result }}" != "success" ]; then
            echo "::error::go-inference-determinism failed"
            FAILED=1
          fi

          if [ "${{ needs.cross-platform-hashes.result }}" != "success" ]; then
            echo "::error::cross-platform-hashes failed"
            FAILED=1
          fi

          if [ "${{ needs.python-ml-determinism.result }}" != "success" ]; then
            echo "::error::python-ml-determinism failed"
            FAILED=1
          fi

          if [ "${{ needs.model-hash-verification.result }}" != "success" ]; then
            echo "::error::model-hash-verification failed"
            FAILED=1
          fi

          if [ "${{ needs.config-validation.result }}" != "success" ]; then
            echo "::error::config-validation failed"
            FAILED=1
          fi

          if [ "${FAILED}" -ne 0 ]; then
            echo "::error::Critical determinism checks failed"
            exit 1
          fi

      - name: Post summary
        if: always()
        run: |
          {
            echo "## ML Determinism Verification Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Go Inference Determinism | ${{ needs.go-inference-determinism.result }} |"
            echo "| Cross-Platform Hashes | ${{ needs.cross-platform-hashes.result }} |"
            echo "| Python ML Determinism | ${{ needs.python-ml-determinism.result }} |"
            echo "| Model Hash Verification | ${{ needs.model-hash-verification.result }} |"
            echo "| Config Validation | ${{ needs.config-validation.result }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
