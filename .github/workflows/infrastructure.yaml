# VirtEngine Infrastructure CI/CD

name: Infrastructure

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'infra/**'
      - 'deploy/**'
      - 'docs/documentation/INFRA-001-IMPLEMENTATION-SUMMARY.md'
      - '_docs/adr/ADR-009-canonical-kubernetes-rendering-and-identity.md'
      - '_docs/audits/task-85c-completion-report-2026-07-23.md'
      - '_docs/runbooks/kubernetes-identity-backup-restore-runbook.md'
      - 'scripts/task85c-validate-kubernetes.mjs'
      - '.github/workflows/infrastructure.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'deploy/**'
      - 'docs/documentation/INFRA-001-IMPLEMENTATION-SUMMARY.md'
      - '_docs/adr/ADR-009-canonical-kubernetes-rendering-and-identity.md'
      - '_docs/audits/task-85c-completion-report-2026-07-23.md'
      - '_docs/runbooks/kubernetes-identity-backup-restore-runbook.md'
      - 'scripts/task85c-validate-kubernetes.mjs'
      - '.github/workflows/infrastructure.yaml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to target'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Infra action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - drift

env:
  TF_VERSION: '1.6.6'
  TERRAGRUNT_VERSION: '0.54.8'
  NODE_VERSION: '20'
  KUBECTL_VERSION: '1.29.0'
  KUBECTL_SHA256: '0e03ab096163f61ab610b33f37f55709d3af8e16e4dcc1eb682882ef80f96fd5'
  AWS_REGION: 'us-east-1'
  GOWORK: 'off'

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check --strict
          chmod +x kubectl
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client=true --output=yaml

      - name: Validate Task 85C Kubernetes policy
        run: node scripts/task85c-validate-kubernetes.mjs

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify environment parity
        run: |
          chmod +x infra/scripts/check-environment-parity.sh
          infra/scripts/check-environment-parity.sh

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform Modules
        shell: bash
        run: |
          set -euo pipefail
          for module in infra/terraform/modules/*/; do
            echo "Validating $module"
            cd "$module"
            printf '%s\n' \
              'provider "aws" {' \
              '  region                      = "us-east-1"' \
              '  skip_credentials_validation = true' \
              '  skip_metadata_api_check     = true' \
              '  skip_requesting_account_id  = true' \
              '}' \
              '' \
              'provider "aws" {' \
              '  alias                       = "primary"' \
              '  region                      = "us-east-1"' \
              '  skip_credentials_validation = true' \
              '  skip_metadata_api_check     = true' \
              '  skip_requesting_account_id  = true' \
              '}' \
              '' \
              'provider "aws" {' \
              '  alias                       = "secondary"' \
              '  region                      = "us-west-2"' \
              '  skip_credentials_validation = true' \
              '  skip_metadata_api_check     = true' \
              '  skip_requesting_account_id  = true' \
              '}' \
              '' \
              'provider "aws" {' \
              '  alias                       = "tertiary"' \
              '  region                      = "us-west-1"' \
              '  skip_credentials_validation = true' \
              '  skip_metadata_api_check     = true' \
              '  skip_requesting_account_id  = true' \
              '}' \
              '' \
              'provider "kubernetes" {' \
              '  host     = "https://127.0.0.1"' \
              '  token    = "ci"' \
              '  insecure = true' \
              '}' \
              '' \
              'provider "helm" {' \
              '  kubernetes {' \
              '    host     = "https://127.0.0.1"' \
              '    token    = "ci"' \
              '    insecure = true' \
              '  }' \
              '}' > .ci-providers.tf
            terraform init -backend=false -input=false
            terraform validate
            rm -f .ci-providers.tf
            cd - >/dev/null
          done

      - name: Collect Kubernetes manifests
        id: k8s-manifests
        shell: bash
        run: |
          {
            echo "files<<EOF"
            if [ -d deploy/kubernetes/base ]; then
              find deploy/kubernetes/base -maxdepth 1 -name '*.yaml' -print
            fi
            if [ -d deploy/kubernetes/overlays ]; then
              find deploy/kubernetes/overlays -name '*.yaml' -print
            fi
            if [ -d deploy/argocd ]; then
              find deploy/argocd -name '*.yaml' -print
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install kubeval
        run: |
          KUBEVAL_VERSION=0.16.1
          curl -sSL -o kubeval.tar.gz https://github.com/instrumenta/kubeval/releases/download/v${KUBEVAL_VERSION}/kubeval-linux-amd64.tar.gz
          tar -xzf kubeval.tar.gz
          sudo mv kubeval /usr/local/bin/kubeval

      - name: Lint Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          files="${{ steps.k8s-manifests.outputs.files }}"
          if [ -z "$files" ]; then
            echo "No Kubernetes manifests found to lint."
            exit 0
          fi
          echo "$files" | xargs -r kubeval \
            --kubernetes-version 1.29.0 \
            --schema-location https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master \
            --ignore-missing-schemas

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false

      - name: Upload Checkov results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif

      - name: Run Trivy on Kubernetes manifests
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: deploy/kubernetes
          format: sarif
          output: trivy-k8s-results.sarif

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-k8s-results.sarif

  plan:
    name: Plan (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -Lo terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}
          role-session-name: infra-plan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Generate reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh plan "infra/terraform/environments/${{ github.event.inputs.environment }}" "$RUNNER_TEMP/infra-plan"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: infra-plan-${{ github.event.inputs.environment }}
          path: ${{ runner.temp }}/infra-plan
          retention-days: 7

  apply:
    name: Apply (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: infra-${{ github.event.inputs.environment }}
    concurrency:
      group: infra-apply-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -Lo terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}
          role-session-name: infra-apply-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: infra-plan-${{ github.event.inputs.environment }}
          path: ${{ runner.temp }}/infra-plan

      - name: Apply reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh apply "infra/terraform/environments/${{ github.event.inputs.environment }}" "$RUNNER_TEMP/infra-plan"

  drift-manual:
    name: Drift (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'drift' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -Lo terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}
          role-session-name: infra-drift-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Detect drift
        shell: bash
        run: |
          chmod +x infra/scripts/terraform-run.sh
          set +e
          infra/scripts/terraform-run.sh drift "infra/terraform/environments/${{ github.event.inputs.environment }}" "$RUNNER_TEMP/infra-drift"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::Terraform drift detected for ${{ github.event.inputs.environment }}."
            exit 1
          fi
          exit "$rc"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-drift-${{ github.event.inputs.environment }}
          path: ${{ runner.temp }}/infra-drift
          retention-days: 7

  drift-scheduled:
    name: Drift (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -Lo terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}
          role-session-name: infra-drift-${{ matrix.environment }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Detect drift
        shell: bash
        run: |
          chmod +x infra/scripts/terraform-run.sh
          set +e
          infra/scripts/terraform-run.sh drift "infra/terraform/environments/${{ matrix.environment }}" "$RUNNER_TEMP/infra-drift-${{ matrix.environment }}"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::Terraform drift detected for ${{ matrix.environment }}."
            exit 1
          fi
          exit "$rc"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-drift-${{ matrix.environment }}
          path: ${{ runner.temp }}/infra-drift-${{ matrix.environment }}
          retention-days: 7
