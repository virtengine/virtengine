name: Portal Deploy Production

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'lib/portal/**'
      - 'lib/capture/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'

jobs:
  build:
    name: Build Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portal
        run: pnpm -C portal build
        env:
          NEXT_PUBLIC_CHAIN_ID: virtengine-1
          NEXT_PUBLIC_CHAIN_RPC: https://rpc.virtengine.com
          NEXT_PUBLIC_CHAIN_REST: https://api.virtengine.com
          NEXT_PUBLIC_CHAIN_WS: wss://ws.virtengine.com
          NEXT_PUBLIC_DEV_MODE: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: portal-production-build
          # `.next` is a HIDDEN directory. upload-artifact >= v4.4 defaults
          # `include-hidden-files: false`, so this path matched ZERO files and
          # `if-no-files-found` defaulted to `warn` -- the step exited 0 while
          # uploading nothing, and `deploy-staging` then failed with
          # "Artifact not found for name: portal-production-build" (run
          # 37036353791). The build had succeeded; only the handoff was empty.
          # portal-ci.yaml already sets both keys for the same reason.
          path: |
            portal/.next
            !portal/.next/cache
          include-hidden-files: true
          # Never let an empty artifact look like a successful upload.
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: portal-production-build
          path: portal/.next

      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./portal
          alias-domains: staging.portal.virtengine.com

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: needs.deploy-staging.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # Workspace-pinned Playwright only; `npx playwright install` would fetch
        # the newest release from the registry and install a browser build the
        # locked @playwright/test does not launch.
        run: pnpm --filter virtengine-portal exec playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.VE_SMOKE_PORTAL_URL }}
        run: |
          chmod +x scripts/ci/run-portal-smoke.sh
          scripts/ci/run-portal-smoke.sh

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    needs: [smoke-test]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://portal.virtengine.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: portal-production-build
          path: portal/.next

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./portal
          alias-domains: portal.virtengine.com

      - name: Create deployment record
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id,
              state: 'success',
              environment_url: 'https://portal.virtengine.com',
              description: 'Production deployment successful',
            });

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always() && needs.deploy-staging.result != 'skipped'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v3
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "Portal Deployment: ${{ needs.deploy-staging.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Portal Deployment*\n• Status: ${{ needs.deploy-staging.result }}\n• Branch: ${{ github.ref_name }}\n• Commit: ${{ github.sha }}"
                  }
                }
              ]
            }
