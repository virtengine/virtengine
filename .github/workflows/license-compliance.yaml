name: License Compliance

on:
  push:
    branches:
      - main
      - mainnet/main
      - develop
    paths:
      - "go.mod"
      - "go.sum"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "portal/package.json"
      - "lib/portal/package.json"
      - "lib/admin/package.json"
      - "lib/capture/package.json"
      - "sdk/portal/package.json"
      - "sdk/portal/pnpm-lock.yaml"
      - "sdk/ts/package.json"
      - "sdk/ts/package-lock.json"
      - "ml/**/requirements*.txt"
      - ".github/workflows/license-compliance.yaml"
      - ".github/scripts/validate_security_policies.py"
      - ".github/tests/test_security_policy*.py"
      - "SUPPLY_CHAIN_SECURITY.md"
  pull_request:
    branches:
      - main
      - mainnet/main
      - develop
    paths:
      - "go.mod"
      - "go.sum"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "portal/package.json"
      - "lib/portal/package.json"
      - "lib/admin/package.json"
      - "lib/capture/package.json"
      - "sdk/portal/package.json"
      - "sdk/portal/pnpm-lock.yaml"
      - "sdk/ts/package.json"
      - "sdk/ts/package-lock.json"
      - "ml/**/requirements*.txt"
      - ".github/workflows/license-compliance.yaml"
      - ".github/scripts/validate_security_policies.py"
      - ".github/tests/test_security_policy*.py"
      - "SUPPLY_CHAIN_SECURITY.md"
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: license-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.25.5"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"
  PYTHON_VERSION: "3.11"
  GO_LICENSES_VERSION: "v1.6.0"
  LICENSE_CHECKER_VERSION: "4.4.2"
  PIP_LICENSES_VERSION: "5.5.5"
  SYFT_VERSION: "v1.42.4"
  GOWORK: "off"

permissions:
  contents: read

jobs:
  policy-validation:
    name: Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Validate security policy files
        run: |
          python .github/scripts/validate_security_policies.py --files \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml \
            .gitleaks.toml \
            .vulnerability-allowlist.yaml \
            SUPPLY_CHAIN_SECURITY.md

      - name: Run policy validator tests
        run: python -m unittest discover -s .github/tests -p "test_security_policy*.py"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint targeted workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml

  go-licenses:
    name: Go License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@${{ env.GO_LICENSES_VERSION }}

      - name: Generate Go license inventory
        run: |
          mkdir -p license-reports/go
          "$(go env GOPATH)/bin/go-licenses" report ./... --template='{{range .}}{{.Name}},{{.LicenseName}},{{.LicenseURL}}
          {{end}}' > license-reports/go/licenses.csv
          test -s license-reports/go/licenses.csv

      - name: Enforce Go license policy
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          disallowed = ("GPL", "AGPL", "LGPL", "SSPL", "BUSL")
          report = Path("license-reports/go/licenses.csv")
          violations = []
          with report.open(newline="", encoding="utf-8") as fh:
              for row in csv.reader(fh):
                  if not row:
                      continue
                  package = row[0]
                  license_name = row[1] if len(row) > 1 else "UNKNOWN"
                  if any(token in license_name.upper() for token in disallowed):
                      violations.append(f"{package}: {license_name}")
          if violations:
              raise SystemExit("Disallowed Go licenses detected:\n" + "\n".join(violations))
          PY

      - name: Upload Go license report
        uses: actions/upload-artifact@v4
        with:
          name: go-license-report
          path: license-reports/go
          retention-days: 90

  javascript-licenses:
    name: JavaScript License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sdk/portal/pnpm-lock.yaml

      - name: Install license-checker
        run: npm install --global license-checker-rseidelsohn@${{ env.LICENSE_CHECKER_VERSION }}

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install sdk/portal dependencies
        run: pnpm --dir sdk/portal install --frozen-lockfile --ignore-scripts

      - name: Install sdk/ts dependencies
        run: npm --prefix sdk/ts ci --ignore-scripts

      - name: Generate JavaScript license inventories
        run: |
          mkdir -p license-reports/javascript

          scan_dir() {
            local dir="$1"
            local name="$2"
            if [ -f "$dir/package.json" ]; then
              (
                cd "$dir"
                license-checker-rseidelsohn --json --production > "${GITHUB_WORKSPACE}/license-reports/javascript/${name}.json"
              )
            fi
          }

          scan_dir "portal" "portal"
          scan_dir "lib/portal" "lib-portal"
          scan_dir "lib/admin" "lib-admin"
          scan_dir "lib/capture" "lib-capture"
          scan_dir "sdk/portal" "sdk-portal"
          scan_dir "sdk/ts" "sdk-ts"

          find license-reports/javascript -type f -name '*.json' | grep -q .

      - name: Enforce JavaScript license policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          disallowed = ("GPL", "AGPL", "LGPL", "SSPL", "BUSL")
          violations = []
          for report_path in sorted(Path("license-reports/javascript").glob("*.json")):
              data = json.loads(report_path.read_text(encoding="utf-8"))
              for package_name, metadata in data.items():
                  licenses = metadata.get("licenses", "")
                  values = licenses if isinstance(licenses, list) else [str(licenses)]
                  normalized = " ".join(values).upper()
                  if any(token in normalized for token in disallowed):
                      violations.append(f"{report_path.name}: {package_name}: {normalized}")
          if violations:
              raise SystemExit("Disallowed JavaScript licenses detected:\n" + "\n".join(violations))
          PY

      - name: Upload JavaScript license report
        uses: actions/upload-artifact@v4
        with:
          name: javascript-license-report
          path: license-reports/javascript
          retention-days: 90

  python-licenses:
    name: Python License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-licenses
        run: python -m pip install --disable-pip-version-check pip-licenses==${{ env.PIP_LICENSES_VERSION }}

      - name: Generate Python license inventories
        run: |
          mkdir -p license-reports/python .cache/license-venvs
          mapfile -t requirement_files < <(find ml -type f \( -name "requirements.txt" -o -name "requirements-deterministic.txt" \) | sort)
          if [ "${#requirement_files[@]}" -eq 0 ]; then
            echo "::error::No Python requirement files found under ml/"
            exit 1
          fi

          for requirement_file in "${requirement_files[@]}"; do
            slug=$(echo "${requirement_file#./}" | tr '/\\' '__')
            venv_path=".cache/license-venvs/${slug}"
            python -m venv "$venv_path"
            source "${venv_path}/bin/activate"
            python -m pip install --disable-pip-version-check --quiet -r "$requirement_file"
            python -m piplicenses --format=json > "license-reports/python/${slug}.json"
            deactivate
          done

      - name: Enforce Python license policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          disallowed = ("GPL", "AGPL", "LGPL", "SSPL", "BUSL")
          violations = []
          for report_path in sorted(Path("license-reports/python").glob("*.json")):
              data = json.loads(report_path.read_text(encoding="utf-8"))
              for package in data:
                  license_name = str(package.get("License", "")).upper()
                  package_name = package.get("Name", "unknown")
                  if any(token in license_name for token in disallowed):
                      violations.append(f"{report_path.name}: {package_name}: {license_name}")
          if violations:
              raise SystemExit("Disallowed Python licenses detected:\n" + "\n".join(violations))
          PY

      - name: Upload Python license report
        uses: actions/upload-artifact@v4
        with:
          name: python-license-report
          path: license-reports/python
          retention-days: 90

  spdx-sbom:
    name: SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" | tar -xz
          sudo install -m 0755 syft /usr/local/bin/syft

      - name: Generate SPDX SBOM
        run: |
          chmod +x scripts/supply-chain/generate-sbom.sh
          scripts/supply-chain/generate-sbom.sh --format spdx --output license-reports/sbom
          test -f license-reports/sbom/sbom.spdx.json

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: spdx-sbom
          path: license-reports/sbom
          retention-days: 365

  license-summary:
    name: License Summary
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - go-licenses
      - javascript-licenses
      - python-licenses
      - spdx-sbom
    if: always()
    steps:
      - name: Summarize license gates
        run: |
          echo "# License Compliance Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Policy Validation | ${{ needs.policy-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Go Licenses | ${{ needs.go-licenses.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| JavaScript Licenses | ${{ needs.javascript-licenses.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python Licenses | ${{ needs.python-licenses.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SPDX SBOM | ${{ needs.spdx-sbom.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Allowed families: MIT, Apache-2.0, BSD, ISC, MPL-2.0, Unlicense, CC0-1.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Blocked families: GPL, AGPL, LGPL, SSPL, BUSL" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on license gate failure
        run: |
          FAILED=0
          for result in \
            "${{ needs.policy-validation.result }}" \
            "${{ needs.go-licenses.result }}" \
            "${{ needs.javascript-licenses.result }}" \
            "${{ needs.python-licenses.result }}" \
            "${{ needs.spdx-sbom.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more required license-compliance gates failed"
            exit 1
          fi
