# Fuzz Testing Workflow for VirtEngine
#
# Runs Go native fuzz tests on PRs and nightly builds
# Integrates with OSS-Fuzz for continuous fuzzing
#
# Task Reference: QUALITY-001 - Fuzz Testing Implementation

name: Fuzz Testing

on:
  push:
    branches:
      - main
      - mainnet/main
  pull_request:
    branches:
      - main
      - mainnet/main
  schedule:
    # Run nightly at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Fuzz budget per step, divided across that step's fuzz targets (e.g., 30s, 5m)"
        required: false
        default: "30s"

permissions:
  contents: read
  security-events: write

env:
  GOWORK: "off" # Disable workspace mode for vendor operations

jobs:
  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Install build dependencies for cgo packages
        # github.com/zondax/hid (via go.mod replace) carries `#cgo pkg-config: libudev`;
        # without libudev-dev the packages below die at pkg-config build time and
        # `go build`/`go test` never run. Not present on the ubuntu-latest image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Sync vendor directory
        run: |
          go mod tidy
          go mod vendor

      - name: Determine fuzz time
        id: fuzz-time
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "duration=5m" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.fuzz_time }}" != "" ]; then
            echo "duration=${{ github.event.inputs.fuzz_time }}" >> $GITHUB_OUTPUT
          else
            echo "duration=30s" >> $GITHUB_OUTPUT
          fi

      # Regression test for the runner below. Hermetic - it stubs `go` on PATH -
      # so it costs nothing and pins the argument contract that this workflow
      # broke (`-fuzz=.` matches 10-14 targets per package and aborts before
      # fuzzing anything). Not continue-on-error: a broken runner is a defect.
      - name: Test the fuzz-target runner
        run: |
          bash .github/tests/test_run_fuzz_targets.sh
          bash .github/tests/test_summarize_fuzz_outcomes.sh

      # Each step fuzzes every target in its packages one at a time. `-fuzz=.`
      # cannot be used: it requires the pattern to match exactly ONE fuzz target,
      # and these packages declare 7-14 each, so the old invocation aborted with
      # "will not fuzz, -fuzz matches more than one fuzz test" and fuzzed nothing
      # - on every run, for every one of these steps.
      - name: Run encryption crypto fuzz tests
        id: fuzz-encryption-crypto
        run: |
          bash .github/scripts/run_fuzz_targets.sh "${{ steps.fuzz-time.outputs.duration }}" ./x/encryption/crypto/...
        continue-on-error: true

      - name: Run encryption types fuzz tests
        id: fuzz-encryption-types
        run: |
          bash .github/scripts/run_fuzz_targets.sh "${{ steps.fuzz-time.outputs.duration }}" ./x/encryption/types/...
        continue-on-error: true

      - name: Run VEID types fuzz tests
        id: fuzz-veid-types
        run: |
          bash .github/scripts/run_fuzz_targets.sh "${{ steps.fuzz-time.outputs.duration }}" ./x/veid/types/...
        continue-on-error: true

      - name: Run marketplace types fuzz tests
        id: fuzz-market-types
        run: |
          bash .github/scripts/run_fuzz_targets.sh "${{ steps.fuzz-time.outputs.duration }}" ./x/market/types/marketplace/...
        continue-on-error: true

      - name: Run MFA types fuzz tests
        id: fuzz-mfa-types
        run: |
          bash .github/scripts/run_fuzz_targets.sh "${{ steps.fuzz-time.outputs.duration }}" ./x/mfa/types/...
        continue-on-error: true

      # The fuzz steps above stay non-gating (a crash in a pre-existing fuzz
      # target must not red the whole workflow overnight), but the masking was
      # invisible: the job reported success while every step exited 1. This makes
      # a failing fuzz step show up in the run summary and as a job annotation
      # instead of only in the raw log.
      - name: Summarize fuzz step outcomes
        if: always()
        env:
          OUTCOMES: |
            encryption-crypto=${{ steps.fuzz-encryption-crypto.outcome }}
            encryption-types=${{ steps.fuzz-encryption-types.outcome }}
            veid-types=${{ steps.fuzz-veid-types.outcome }}
            market-types=${{ steps.fuzz-market-types.outcome }}
            mfa-types=${{ steps.fuzz-mfa-types.outcome }}
        run: |
          printf '%s\n' "$OUTCOMES" | bash .github/scripts/summarize_fuzz_outcomes.sh "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # Provider daemon and enclave fuzz tests are currently disabled due to pre-existing
      # compilation issues in those packages. They will be re-enabled once those issues
      # are resolved.
      # - name: Run provider daemon fuzz tests
      #   run: |
      #     go test -fuzz=. -fuzztime=${{ steps.fuzz-time.outputs.duration }} ./pkg/provider_daemon/...
      #   continue-on-error: true

      - name: Upload fuzz corpus artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-corpus
          path: |
            **/testdata/fuzz/**
          retention-days: 30
          if-no-files-found: ignore

  oss-fuzz-build:
    name: OSS-Fuzz Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Sync vendor directory
        run: |
          go mod tidy
          go mod vendor

      - name: Verify fuzz targets compile
        run: |
          # Compile fuzz targets to verify they work
          # Note: pkg/provider_daemon and x/enclave/types have pre-existing issues
          for pkg in x/encryption/crypto x/encryption/types x/veid/types x/market/types/marketplace x/mfa/types; do
            echo "Checking fuzz targets in $pkg..."
            go test -c ./$pkg 2>&1 || echo "Warning: $pkg compilation issues"
          done

      - name: Check OSS-Fuzz configuration
        run: |
          # Verify OSS-Fuzz files exist
          test -f fuzz/project.yaml || { echo "Missing fuzz/project.yaml"; exit 1; }
          test -f fuzz/build.sh || { echo "Missing fuzz/build.sh"; exit 1; }
          test -f fuzz/Dockerfile || { echo "Missing fuzz/Dockerfile"; exit 1; }
          echo "OSS-Fuzz configuration verified"

  fuzz-security-audit:
    name: Fuzz Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: fuzz-tests
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Generate fuzz coverage summary
        run: |
          echo "# Fuzz Test Coverage Summary" > fuzz-summary.md
          echo "Generated: $(date -u)" >> fuzz-summary.md
          echo "" >> fuzz-summary.md

          # List fuzz test files
          echo "## Fuzz Test Files" >> fuzz-summary.md
          find . -name '*_fuzz_test.go' | while read f; do
            echo "- $f" >> fuzz-summary.md
          done
          echo "" >> fuzz-summary.md

          # Count fuzz tests
          echo "## Fuzz Test Counts" >> fuzz-summary.md
          for pkg in x/encryption/crypto x/encryption/types x/veid/types x/market/types/marketplace x/mfa/types pkg/provider_daemon; do
            count=$(grep -r "^func Fuzz" ./$pkg 2>/dev/null | wc -l || echo 0)
            echo "- $pkg: $count fuzz tests" >> fuzz-summary.md
          done

          cat fuzz-summary.md

      - name: Upload fuzz summary
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-summary
          path: fuzz-summary.md
          retention-days: 90
