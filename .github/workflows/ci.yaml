# VirtEngine CI Pipeline - Consolidated (INFRA-003)
#
# This is the SINGLE source of truth for CI. Previously split across:
# - ci.yaml (this file)
# - tests.yaml (removed - was duplicate)
#
# Jobs:
#   Core (run on every PR):
#     1. lint          - Go linting with golangci-lint
#     2. lint-shell    - Shell script linting
#     3. test-go       - Go unit tests; INFRA-003 coverage gate routes by event
#                        (PR: changed lines at 80%; push: non-regression ratchet
#                        against COVERAGE_BASELINE) -- see scripts/ci/coverage_gate.py
#     4. build         - Build binaries for multiple platforms
#     5. integration   - Integration tests against localnet
#     6. container-security - Container image scanning with Trivy
#
#   Extended (run on main/tags only):
#     7. build-macos   - Native macOS build verification
#     8. sims          - Cosmos SDK simulation tests
#     9. network-upgrade - Network upgrade tests
#     10. release      - Create GitHub release (tags only)

name: CI

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - main
      - mainnet/main
      - develop
      - "release/**"
    tags:
      - "v*"
  # Run full CI for PRs targeting protected branches (e.g. module branch → main merge PRs).
  # PRs to module/ve/* branches intentionally skip full CI — they rely on pre-push hooks.
  pull_request:
    branches:
      - main
      - mainnet/main
      - develop
    # Exclude PRs from ve/* branches (agent worktrees) — these use pre-push quality gates
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "_docs/**"
      - ".github/AGENTS.md"

# A push to develop must PUBLISH a verdict, and `cancel-in-progress` on a
# per-ref group cannot guarantee one.
#
# Measured on 2026-10-06: every ci.yaml develop *push* run for 32 hours ended
# `cancelled` -- 35 consecutive runs, none of which published a conclusion.
# Cause: `group: ${{ github.workflow }}-${{ github.ref }}` puts every push to
# `develop` in the SAME group, and `cancel-in-progress: true` means each new
# commit kills the in-flight run. A develop run takes ~1h39m (37360715885:
# created 19:04:19Z, updated 20:43:27Z); commits land on develop faster than
# that, so the run is always cancelled before it can finish. The result is
# self-sustaining -- the more the fleet merges, the longer develop goes with
# NO validated signal at all, and a cancelled run is not a green run.
#
# The fix keeps PR runs cancellable (that is what makes iteration fast) and
# makes only the push path per-commit, so each push gets its own group and
# cannot cancel its predecessor:
#
#   pull_request -> ${{ github.workflow }}-${{ github.ref }}
#   push         -> ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
#
# `github.sha` is the pushed commit, so push runs never share a group.
# This is the same trade the repo already made in infrastructure.yaml,
# dr-tools-image.yaml and dr-failover-test.yaml, which all set
# `cancel-in-progress: false`.
#
# Pinned by .github/tests/test_ci_concurrency_verdict.py, which reads this
# workflow's PARSED `concurrency` block -- a text assertion could not tell a
# live setting from a comment quoting the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.8"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.28.2"
  PYTHON_VERSION: "3.11"
  GOWORK: "off" # Disable workspace mode for vendor operations
  GO_TEST_TIMEOUT_UNIT: "30m"
  GO_TEST_TIMEOUT_INTEGRATION: "40m"
  GO_TEST_TIMEOUT_E2E: "45m"

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Lint Job - Static Analysis
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        # github.com/zondax/hid (via go.mod replace) carries `#cgo pkg-config: libudev`;
        # without libudev-dev the whole module cannot be type-checked and
        # golangci-lint fails with exit code 3 (linter never ran). Not on the
        # ubuntu-latest runner image, so install it explicitly.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Fetch base ref for lint diff
        run: |
          # For PRs, use base_ref; for pushes, use main
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
          else
            git fetch origin main --depth=1 || git fetch origin mainnet/main --depth=1 || true
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # The develop->main integration PR scopes this to the whole develop delta
          # (--new-from-rev=origin/main), which does not finish inside 10m: the linter
          # reports "0 issues." and is then killed by its own budget
          # (`level=error msg="Timeout exceeded"`, exit 4) after ~12-13m of job wall time.
          # That is a false red - the gate found nothing and failed to finish. 30m matches
          # GO_TEST_TIMEOUT_UNIT below and leaves headroom for the whole-tree push variant.
          #
          # `--output.json.path` emits a machine-readable report for the per-linter
          # budget gate below. `.golangci.yaml` now sets max-issues-per-linter=0 and
          # max-same-issues=0: without that, golangci-lint v2 applies its defaults of
          # 50 and 3, and the reported debt is an artifact of the display cap rather
          # than a property of the tree (capped: errcheck=50; uncapped: errcheck=662).
          #
          # `--issues-exit-code=0` applies to the PUSH (whole-tree) path ONLY.
          # Whole-tree, "1721 issues" is pre-existing recorded debt, and a bare
          # `golangci-lint run` exits 1 purely because findings exist. Left alone
          # that exit is not a signal, it is a constant: it fails identically at
          # 1 finding and at 1721, and worse, it ABORTS the job at that step.
          # Verified in run 37155259055, job 111297271101 (push, develop): the
          # linter step failed on "1721 issues", so the job's default
          # success() short-circuited every ungated step after it. The two steps
          # whose `##[group]` never appears in that job's log are the budget
          # gate's SELF-TEST (`Test the lint budget gate`) and `Check
          # formatting` below. The gate itself DID run and reported OK at
          # 662/662 errcheck, 926/926 goconst -- but under
          # `continue-on-error: true`, so its verdict changed no check result:
          # it could not have failed the job even if the debt had grown. That is
          # the real defect, and it is fixed below independently of this flag.
          #
          # So on push the linter reports and the ratchet DECIDES. This is not
          # lowering the linter set, disabling any linter, or suppressing
          # findings: every finding is still reported, and
          # `Lint debt budget (non-regression ratchet)` below is now the enforced
          # signal -- it fails the job when any linter grows past its named,
          # expiry-dated baseline (currently 662 errcheck / 926 goconst).
          # `--issues-exit-code` only remaps the "issues found" verdict; real
          # failures keep their codes (3 config/parse, 4 timeout, 5 no go files,
          # 7 internal), so a broken lint setup or a hung run is still red.
          #
          # The pull_request path is deliberately EXCLUDED from that flag: it runs
          # `--new-from-rev` against the base branch, so any finding it reports is
          # new to the PR, and it must keep its non-zero exit to keep blocking PRs
          # that introduce lint issues. Only whole-tree debt is pre-debt here.
          args: >-
            --timeout=30m
            --output.json.path=lint-report.json
            ${{ github.event_name == 'pull_request' && format('--new-from-rev=origin/{0}', github.base_ref) || '' }}
            ${{ github.event_name != 'pull_request' && '--issues-exit-code=0' || '' }}

      # Self-test for the budget gate, mirroring #1166's coverage gate: the gate
      # that scores this repository's lint debt must not ship untested.
      # `if: always()` so this cannot be masked by an earlier step failing -- the
      # gate that decides the whole-tree lint verdict must be proven on the same
      # run that applies it.
      - name: Test the lint budget gate
        if: always()
        run: python -m unittest discover -s .github/tests -p "test_lint_budget_gate.py" -v

      # Self-test for the wiring itself. test_lint_budget_gate.py scores a JSON
      # report and never opens ci.yaml, so nothing in it can catch this job's
      # wiring regressing -- an `if:` dropped, `continue-on-error` reintroduced,
      # or `--issues-exit-code=0` leaking onto the pull_request path. Discovered
      # here rather than left in .github/tests/ where nothing runs it: a test no
      # workflow executes is a comment. Both suites are pure-Python and
      # hermetic (yaml.safe_load of a checked-out file, no network, no origin/
      # ref), so they cost single-digit seconds in a job that already ran the
      # whole-tree linter for six minutes.
      - name: Test the lint job push path
        if: always()
        run: python -m unittest discover -s .github/tests -p "test_lint_job_push_path.py" -v

      # Self-test for this workflow's OWN concurrency block.
      #
      # `concurrency: group: ${{ workflow }}-${{ ref }}` with
      # `cancel-in-progress: true` put every push to `develop` in one group,
      # so each commit cancelled the run in flight. A develop run takes ~1h39m
      # and commits land faster than that, which produced 35 consecutive
      # `cancelled` runs over 32 hours (2026-10-06) and THREE commits on
      # `develop` that nothing had reported on. A cancelled run publishes no
      # verdict, so this was the absence of a signal rather than a red one --
      # and an agent reading "CI agrees" was reading that absence.
      #
      # It lives here, not in `.github/tests/` where nothing runs it, for the
      # reason the two steps above give: an unexecuted test is a comment. This
      # job is the one that already parses ci.yaml, it costs well under a
      # second (pure yaml.safe_load, no network, no `origin/` ref), and
      # `if: always()` keeps it from being masked by the linter failing above.
      #
      # NOTE ON A LIMIT THIS GUARD CANNOT LIFT: no test can force GitHub to
      # publish a verdict. It pins the workflow text so the routing cannot
      # silently regress. Proving the signal actually returns needs one real
      # completed develop push run -- see t_5b0c7ab2.
      - name: Test the CI concurrency verdict routing
        if: always()
        run: python -m unittest discover -s .github/tests -p "test_ci_concurrency_verdict.py" -v

      # Publish the machine-readable lint report BEFORE anything can skip it.
      #
      # Why this step exists at all: `--output.json.path=lint-report.json`
      # redirects every finding off stdout into a file. That makes the linter
      # step's log EMPTY on failure -- a red with no message, no `##[error]`,
      # and no annotation naming a single file. Observed in run 37374589055
      # (PR, develop @ 75105569b), Lint job 111981527543: the log ends at the
      # `Running [... golangci-lint run ...]` line and the next line is
      # "Cleaning up orphan processes". The three `if: always()` steps below --
      # both gate self-tests, the budget ratchet and `Check formatting` -- were
      # all `skipped`, so the job's own evidence about what failed never ran
      # either. The red was real and its cause was unreadable: `gh run view
      # --log-failed` returned nothing to read and the annotations API returned
      # only an unrelated runner-image notice.
      #
      # So this is not a diagnostic nicety, it is the difference between a red
      # that can be triaged and one that has to be guessed at or re-run blind.
      # It is ordered immediately after the linter for two reasons:
      # `if: always()` is required (the linter step is exactly what fails), and
      # `if-no-files-found: warn` because golangci-lint writes NO report file at
      # all when it exits 3/4/5 (config error, timeout, no Go files) -- which
      # upload-artifact treats as an error by default, turning the missing-file
      # case into a *second* misleading red that hides the first one.
      #
      # This publishes evidence. It changes no verdict: the Lint job still fails
      # on exactly the same conditions as before, and no threshold is lowered.
      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: warn
          retention-days: 7

      # Per-linter non-regression ratchet over the whole-tree lint report.
      # This is now ENFORCED (no `continue-on-error`): since the push path no
      # longer hard-fails on recorded debt above, this gate is the signal that
      # makes that trade sound. It fails when any linter exceeds its baseline or
      # its budget has expired, so the 1721 findings can be paid down but never
      # grown. The event routing (enforced on push, report-only on the
      # diff-scoped pull_request path, where the `Lint` job's own exit still blocks
      # new findings) lives in the gate, asserted by the test above.
      - name: Lint debt budget (non-regression ratchet)
        if: always()
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/lint_budget_gate.py lint-report.json

      # `if: always()` for the same reason as above: on the push path this is the
      # only gofmt gate that ever runs, and it must not be skipped because an
      # earlier step in this job failed.
      - name: Check formatting
        if: always()
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && -n "${{ github.base_ref }}" ]]; then
            changed_go_files="$(git diff --name-only "origin/${{ github.base_ref }}" -- '*.go' | grep -v '^vendor/' | grep -v '^tests/' | grep -v '^scripts/' || true)"
            if [[ -z "$changed_go_files" ]]; then
              echo "No Go files changed"
              exit 0
            fi
            unformatted="$(printf '%s\n' "$changed_go_files" | xargs gofmt -l)"
            if [[ -n "$unformatted" ]]; then
              printf '%s\n' "$unformatted"
              exit 1
            fi
            exit 0
          fi
          # Whole tree, first-party only. `vendor/` MUST be excluded here for the
          # same reason the pull_request branch above excludes it: `Sync
          # dependencies` runs `go mod vendor`, so by the time this step executes
          # the vendor tree exists on disk, and `gofmt -l .` would score it as
          # our debt. It is genuinely not gofmt-clean -- 254 vendored files fail
          # under Go 1.19+ comment reformatting (e.g.
          # vendor/github.com/DataDog/zstd/zstd_ctx.go) -- so an unfiltered whole
          # tree check fails on third-party code before it ever reaches a file of
          # ours. Reformatting vendored dependencies is not ours to do.
          # `[\\/]` matches either path separator; the Linux runner emits `/`.
          unformatted="$(gofmt -l . | grep -v '^vendor[\\/]' || true)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            echo "::error::gofmt reports first-party Go files that are not formatted"
            exit 1
          fi
          echo "No first-party Go files need gofmt"

  # ===========================================================================
  # Go Vet Job - Pre-push Parity
  # ===========================================================================
  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        # Same libudev requirement as the lint job: `go vet ./...` compiles the
        # whole module with CGO enabled (go test -race needs cgo too).
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Wrapped, not bare `go mod download`: a module-proxy TRANSPORT fault
      # (HTTP/2 RST_STREAM, a reset mid-zip, a TLS blip) is not a defect in the
      # code under test, and a bare download turns every proxy hiccup into a red
      # that says nothing about the commit. The wrapper retries ONLY signatures a
      # transport emits and fails fast on anything else, so it cannot manufacture
      # a pass - see scripts/ci/go-mod-download.sh.
      - name: Download dependencies
        run: bash scripts/ci/go-mod-download.sh

      - name: Run go vet
        env:
          GOFLAGS: "-mod=readonly"
        run: go vet ./...

  # ===========================================================================
  # Native Windows Build and Unit Tests
  # ===========================================================================
  windows-native:
    name: Windows Native Build and Unit Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Same reason as the test-go job: pkg/platformsecurity/contracts asserts
          # provenance against the real git object DB (PersistedSchemaPayloadHead
          # must exist and PersistedSchemaEpochBase must be its ancestor), and a
          # depth-1 checkout does not contain those objects.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      # Wrapped, not bare `go mod download`, for the same reason as the ubuntu
      # jobs. `shell: bash` (Git Bash) rather than `pwsh`: the wrapper IS a bash
      # script. That also makes this the job that exercises the Windows half of
      # the transport regex - the `wsarecv:` / "forcibly closed" reset spellings
      # exist in the script precisely because a reset surfaces differently here.
      - name: Download dependencies
        shell: bash
        run: bash scripts/ci/go-mod-download.sh

      - name: Build VirtEngine
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-mod=readonly"
        run: go build -o .\bin\virtengine.exe .\cmd\virtengine

      - name: Run short unit tests
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-mod=readonly"
        run: go test -short -count=1 ./...

  # ===========================================================================
  # Shell Lint Job
  # ===========================================================================
  lint-shell:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
          severity: warning
        continue-on-error: true # Don't fail CI on shell lint warnings

  node-runtime-audit:
    name: Action Node Runtime Audit
    runs-on: ubuntu-latest
    # Deliberately NOT path-filtered. A path filter here would be expressed as
    # `... || contains(changed_files, '.github/workflows')`, which is always
    # true on the event that matters and silently disables the gate on the one
    # event that could hide a regression. The job costs ~40 API reads and one
    # runner minute; a gate that can be skipped by construction is worth less
    # than the minute it saves.
    #
    # Skipped on schedule only: those events change no pins, so a red here would
    # be noise rather than signal.
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The audit reads upstream manifests at the pinned refs, so it needs
          # the workflow files, and nothing else. A depth-1 fetch is enough.
          fetch-depth: 1
          sparse-checkout: .github

      - name: Audit action runtimes for deprecated Node
        # Fails when any action reachable from .github/workflows -- including
        # one embedded inside a COMPOSITE action -- still declares `using:
        # node20`, and when a JS action is passed a `with:` input its manifest
        # does not declare (that step would die at run time with `input "x" is
        # not defined in action owner/repo@ref`). Exits 2, not 0, if a pin
        # cannot be read: a blind run must never read as a pass.
        #
        # GH_TOKEN is REQUIRED, not optional. Without it `gh` refuses every
        # call ("please run: gh auth login"), the audit sees API errors rather
        # than manifests, and correctly exits 2 -- which fails the build on a
        # clean tree. Passing the built-in token is what makes it able to reach
        # a verdict at all; the read is of PUBLIC manifests in other repos.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/audit_node_runtime.py

  agents-docs:
    name: AGENTS Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate AGENTS documentation
        run: node scripts/validate-agents-docs.mjs

  # ===========================================================================
  # DR Backup/Restore Smoke Test
  # ===========================================================================
  backup-restore-smoke:
    name: DR Backup/Restore Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run backup/restore smoke test
        run: |
          chmod +x scripts/ci/backup-restore-smoke-test.sh \
            scripts/dr/backup-chain-state.sh \
            scripts/dr/backup-provider-state.sh
          scripts/ci/backup-restore-smoke-test.sh

  # ===========================================================================
  # Go Test Job - Unit Tests
  # ===========================================================================
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    # Run in parallel with lint for faster feedback
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # pkg/platformsecurity/contracts asserts provenance against the real
          # git object DB (PersistedSchemaPayloadHead must exist and
          # PersistedSchemaEpochBase must be its ancestor); a depth-1 checkout
          # does not contain those objects, so this job needs full history.
          fetch-depth: 0

      - name: Install system dependencies
        # Same libudev requirement as vet: `go test -race` requires cgo, and
        # the hid/libusb binding needs libudev at build time.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Detect Go-relevant changes
        id: detect
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || -z "${{ github.base_ref }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A depth-1 fetch of the base ref removes the ancestry `git merge-base`
          # needs, so the three-dot diff below dies with `fatal: ... no merge base`
          # (exit 128) and the `|| true` converts that into an empty file list -
          # which this step then reports as "run=false", silently skipping the job.
          # Proven against this repo: only base=main trips it, because main
          # diverges from develop further than the fetched tip. Unshallow so the
          # base ref and HEAD share one history.
          git fetch --unshallow origin 2>/dev/null \
            || git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if ! git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null 2>&1; then
            echo "::error::no merge base between origin/${{ github.base_ref }} and HEAD after a full fetch."
            echo "::error::refusing to report run=false from a diff that could not be computed."
            exit 1
          fi
          changed_go_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.go' 'go.mod' 'go.sum' 'go.work' 'go.work.sum' | grep -v '^vendor/' || true)"

          if [[ -n "$changed_go_files" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Fetch base ref for PR coverage
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      # Wrapped, not bare `go mod download`, for the same reason as the ubuntu
      # jobs. The `if:` guard is unchanged - it gates whether this job runs a
      # Go build at all, which is a different concern from retrying transport
      # faults inside it.
      - name: Download dependencies
        if: steps.detect.outputs.run == 'true'
        run: bash scripts/ci/go-mod-download.sh

      - name: Sync dependencies
        if: steps.detect.outputs.run == 'true'
        run: |
          go mod tidy
          go mod vendor

      - name: Run unit tests
        if: steps.detect.outputs.run == 'true'
        run: |
          go test -v -race -timeout ${{ env.GO_TEST_TIMEOUT_UNIT }} \
            -coverprofile=coverage.out -covermode=atomic ./...

      # INFRA-003: Coverage enforcement gate.
      #
      # The event routing and both thresholds live in scripts/ci/coverage_gate.py,
      # asserted by .github/tests/test_coverage_gate.py. Do not re-inline the
      # routing here: the previous inline form applied a repo-wide 80% floor on
      # the branch path, which this repository has never met (46.5%), making
      # `Go Tests` unconditionally red on every push. Because the required
      # `CI Quality Gates` context inherits `test-go`, that red signal fed the
      # tier-2 develop->main gate's fix-attempt budget on every run. (No PR was
      # ever blocked *by GitHub*: `develop` has no branch protection and
      # `main`'s has no required_status_checks, and tier-1 merges evaluate no
      # checks at all. The accurate claim is "a permanently red signal", not
      # "blocked every PR".)
      #
      # This step is deliberately NOT gated on `steps.detect.outputs.run`.
      # That filter only matches *.go / go.mod / go.sum / go.work / go.work.sum,
      # so a PR that edits only the gate's own files (exactly like #1166, which
      # touched 0 .go files) computed run=false and SKIPPED this step: the gate
      # that decides PR coverage could ship with its own test never executed.
      # The suite is pure-Python and hermetic (it builds its own throwaway git
      # repos, so it needs no `origin/develop`), and costs single-digit
      # seconds against a job that already ran `go test -race ./...` with
      # libudev installed. Affordable on every run, and being unconditional is
      # what makes it a real guard.
      - name: Test coverage gate routing
        run: python -m unittest discover -s .github/tests -p "test_coverage_gate.py" -v

      - name: Check coverage threshold
        id: coverage
        if: steps.detect.outputs.run == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/ci/coverage_gate.py coverage.out

      - name: Upload coverage to Codecov
        if: steps.detect.outputs.run == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unittests
          name: go-coverage
          fail_ci_if_error: false # Keep unit-test signal green when Codecov upload flakes

      - name: Upload coverage artifact
        if: steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

      - name: Skip notice
        if: steps.detect.outputs.run != 'true'
        run: echo "No Go-related files changed, skipping Go test job"

  economics-sim:
    name: Economics Simulation Suite
    runs-on: ubuntu-latest
    needs: test-go
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect economics-relevant changes
        id: detect
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || -z "${{ github.base_ref }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Depth-1 fetch + three-dot diff + `|| true` = a silently empty
          # changed-file list, which makes this job report "nothing relevant
          # changed" and pass while having checked nothing. See the identical
          # site above for the full reasoning and the local reproduction.
          git fetch --unshallow origin 2>/dev/null \
            || git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if ! git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null 2>&1; then
            echo "::error::no merge base between origin/${{ github.base_ref }} and HEAD after a full fetch."
            echo "::error::refusing to report 'no relevant changes' from a diff that could not be computed."
            exit 1
          fi
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)"

          if printf '%s\n' "$changed_files" | grep -Eq '^(.*\.go|go\.mod|go\.sum|go\.work|go\.work\.sum|app/|cmd/|x/|scripts/economics/|tests/integration/|tests/simulation/|simulation/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Wrapped, not bare `go mod download`, for the same reason as the ubuntu
      # jobs. The `if:` guard is unchanged - it gates whether this job runs the
      # simulation suite at all, which is a different concern from retrying
      # transport faults inside it.
      - name: Download dependencies
        if: steps.detect.outputs.run == 'true'
        run: bash scripts/ci/go-mod-download.sh

      - name: Run economics simulation suite
        if: steps.detect.outputs.run == 'true'
        run: |
          chmod +x scripts/economics/run-sim-suite.sh
          RUNS=60 scripts/economics/run-sim-suite.sh ./sim-output

      - name: Skip notice
        if: steps.detect.outputs.run != 'true'
        run: echo "No economics-relevant files changed, skipping job steps"

  # ===========================================================================
  # Python Test Job - ML/Waldur Tests
  # ===========================================================================
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect Python tests
        id: detect
        run: |
          if [ -d tests/python ] && find tests/python -name "*.py" -print -quit | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "tests/python/requirements.txt"

      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f tests/python/requirements.txt ]; then
            pip install -r tests/python/requirements.txt
          else
            echo "No requirements.txt found, skipping"
          fi

      - name: Run Python tests
        if: steps.detect.outputs.run == 'true'
        run: |
          if [ -d tests/python ] && [ "$(ls -A tests/python/*.py 2>/dev/null)" ]; then
            python -m pytest tests/python --tb=short
          else
            echo "No Python tests found, skipping"
          fi

      - name: Skip notice
        if: steps.detect.outputs.run != 'true'
        run: echo "No Python tests found, skipping job steps"

  # ===========================================================================
  # Portal Test Job - TypeScript/React Tests
  # ===========================================================================
  test-portal:
    name: Portal Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect portal package
        id: detect
        run: |
          if [ -f lib/portal/package.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.detect.outputs.run == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: |
          if [ -d lib/portal ] && [ -f lib/portal/package.json ]; then
            pnpm install --frozen-lockfile
          else
            echo "Portal package not found, skipping"
          fi

      - name: Run portal tests
        if: steps.detect.outputs.run == 'true'
        run: |
          if [ -d lib/portal ] && [ -f lib/portal/package.json ]; then
            pnpm -C lib/portal test
            pnpm -C portal test --coverage
          else
            echo "Portal package not found, skipping"
          fi

      - name: Skip notice
        if: steps.detect.outputs.run != 'true'
        run: echo "Portal package not found, skipping job steps"

  # ===========================================================================
  # Build Job - Build Binaries
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    # Run in parallel with lint and test-go for faster feedback
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version info
        id: version
        run: |
          {
            echo "version=$(git describe --tags --always --dirty)"
            echo "commit=$(git rev-parse --short HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="virtengine"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="virtengine.exe"
          fi

          go build -o dist/${BINARY_NAME} \
            -ldflags "-s -w \
              -X github.com/cosmos/cosmos-sdk/version.Name=virtengine \
              -X github.com/cosmos/cosmos-sdk/version.AppName=virtengine \
              -X github.com/cosmos/cosmos-sdk/version.Version=${{ steps.version.outputs.version }} \
              -X github.com/cosmos/cosmos-sdk/version.Commit=${{ steps.version.outputs.commit }}" \
            ./cmd/virtengine

      - name: Create archive
        run: |
          cd dist
          SAFE_VERSION=$(echo "${{ steps.version.outputs.version }}" | tr '/' '-')
          ARCHIVE_NAME="virtengine-${SAFE_VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${ARCHIVE_NAME}.zip" virtengine.exe
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" virtengine
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: virtengine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/virtengine-*
          retention-days: 30

  # ===========================================================================
  # Integration Test Job
  # ===========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        # Same libudev requirement as vet/test-go: the integration packages
        # compile the whole module (cgo), all [build failed] without it.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: virtengine-linux-amd64
          path: dist

      - name: Extract binary
        run: |
          cd dist
          tar -xzvf virtengine-*-linux-amd64.tar.gz
          chmod +x virtengine
          sudo mv virtengine /usr/local/bin/

      - name: Start localnet
        run: |
          chmod +x scripts/localnet.sh scripts/init-chain.sh
          # Initialize and start chain in background
          DETACH=true ./scripts/localnet.sh start || true

          # Wait for chain to be ready
          echo "Waiting for chain to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:26657/status > /dev/null 2>&1; then
              echo "Chain is ready!"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done

      - name: Run integration tests
        id: integration-tests
        run: |
          # INFRA-003: Integration tests are required gates
          go test -v -tags="e2e.integration" -timeout "${{ env.GO_TEST_TIMEOUT_INTEGRATION }}" \
            ./tests/integration/... 2>&1 | tee integration-output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          # Parse test results
          PASSED="$(grep -c "^--- PASS" integration-output.txt || true)"
          FAILED="$(grep -c "^--- FAIL" integration-output.txt || true)"
          SKIPPED="$(grep -c "^--- SKIP" integration-output.txt || true)"

          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Integration Test Results"
            echo "- Passed: $PASSED"
            echo "- Failed: $FAILED"
            echo "- Skipped: $SKIPPED"
          } >> "${GITHUB_STEP_SUMMARY}"

          # INFRA-003: Fail if any integration tests fail
          if [ "$TEST_EXIT_CODE" -ne 0 ] && [ "$FAILED" -gt 0 ]; then
            echo "::error::Integration tests failed ($FAILED failures)"
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          docker-compose logs > docker-compose-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-logs
          path: docker-compose-logs.txt
          retention-days: 7

      - name: Stop localnet
        if: always()
        run: |
          ./scripts/localnet.sh stop || true

  # ===========================================================================
  # HPC Provider E2E Tests - VE-8C
  # ===========================================================================
  hpc-provider-e2e:
    name: HPC Provider E2E Tests
    runs-on: ubuntu-latest
    needs: [build, integration]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies for cgo packages
        # github.com/zondax/hid (via go.mod replace) carries `#cgo pkg-config: libudev`;
        # without libudev-dev the packages below die at pkg-config build time and
        # `go build`/`go test` never run. Not present on the ubuntu-latest image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: virtengine-linux-amd64
          path: dist

      - name: Extract binary
        run: |
          cd dist
          tar -xzvf virtengine-*-linux-amd64.tar.gz
          chmod +x virtengine
          sudo mv virtengine /usr/local/bin/

      - name: Start localnet for E2E
        run: |
          chmod +x scripts/localnet.sh scripts/init-chain.sh
          DETACH=true ./scripts/localnet.sh start || true
          echo "Waiting for chain to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:26657/status > /dev/null 2>&1; then
              echo "Chain is ready!"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done

      - name: Run HPC Provider E2E Tests
        id: hpc-e2e-tests
        run: |
          # VE-8C: HPC marketplace provider flow E2E tests
          go test -v -tags="e2e.integration" \
            -timeout "${{ env.GO_TEST_TIMEOUT_E2E }}" \
            ./tests/e2e/... \
            -run "TestHPCMarketplaceE2E" \
            2>&1 | tee hpc-e2e-output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          # Parse test results
          PASSED="$(grep -c "^--- PASS" hpc-e2e-output.txt || true)"
          FAILED="$(grep -c "^--- FAIL" hpc-e2e-output.txt || true)"
          SKIPPED="$(grep -c "^--- SKIP" hpc-e2e-output.txt || true)"

          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "skipped=$SKIPPED"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## HPC Provider E2E Test Results"
            echo ""
            echo "| Status | Count |"
            echo "|--------|-------|"
            echo "| Passed | $PASSED |"
            echo "| Failed | $FAILED |"
            echo "| Skipped | $SKIPPED |"
            echo ""
            echo "Tests cover: Provider registration -> Offering listing -> Job execution -> Usage reporting -> Settlement"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            echo "::error::HPC Provider E2E tests failed ($FAILED failures)"
            exit 1
          fi

      - name: Upload HPC E2E test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hpc-e2e-test-logs
          path: hpc-e2e-output.txt
          retention-days: 7

      - name: Stop localnet
        if: always()
        run: |
          ./scripts/localnet.sh stop || true

  # ===========================================================================
  # Container Security - Build, Scan, Sign
  # ===========================================================================
  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    needs: [lint, test-go]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect container-relevant changes
        id: detect
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || -z "${{ github.base_ref }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Depth-1 fetch + three-dot diff + `|| true` = a silently empty
          # changed-file list, which makes this job report "nothing relevant
          # changed" and pass while having checked nothing. See the identical
          # site above for the full reasoning and the local reproduction.
          git fetch --unshallow origin 2>/dev/null \
            || git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if ! git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null 2>&1; then
            echo "::error::no merge base between origin/${{ github.base_ref }} and HEAD after a full fetch."
            echo "::error::refusing to report 'no relevant changes' from a diff that could not be computed."
            exit 1
          fi
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)"

          if printf '%s\n' "$changed_files" | grep -Eq '^(.*\.go|go\.mod|go\.sum|go\.work|go\.work\.sum|_build/|Dockerfile|Dockerfile\.|cmd/|app/|x/|scripts/docker/|scripts/ci/|scripts/release/|deploy/|infra/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.detect.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build virtengine image (local)
        if: steps.detect.outputs.run == 'true'
        run: |
          docker buildx build --load -f _build/Dockerfile.virtengine -t virtengine:ci .

      - name: Scan virtengine image
        if: steps.detect.outputs.run == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: virtengine:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      # INFRA-003: Container image size enforcement.
      #
      # This was a fixed 100 MiB `MAX_BYTES` literal compared inline against
      # `docker image inspect`. The shipped image is 216,548,169 bytes
      # and the step has zero successful evaluations in the run history -- the
      # binary alone is 193,294,498 bytes (184.34 MiB, 1.84x the budget) with
      # every standard reduction already applied in _build/Dockerfile.virtengine
      # (CGO_ENABLED=0, -trimpath, -ldflags "-s -w"). That binary is the
      # *workspace-mode* build: the Dockerfile never sets GOWORK and go.work is
      # not in .dockerignore, so COPY . . compiles in workspace mode. See
      # scripts/ci/image_size_gate.py for the re-measure command. Reaching
      # 100 MiB requires cutting the statically linked cosmos-sdk/ibc/grpc
      # binary by 57.8%, which is structural work, not a build-flag change.
      #
      # The threshold and its expiry now live in scripts/ci/image_size_gate.py,
      # asserted by .github/tests/test_image_size_gate.py, so the gate is a
      # measured non-regression ratchet instead of an absolute target nobody has
      # met. The 100 MiB INFRA-003 target is still reported as a warning and
      # remains the convergence direction; reduction work is tracked in #1159.
      #
      # The test runs in this job, not only where a path filter happens to match
      # it, so the gate that blocks builds can never ship untested.
      - name: Test image size gate
        if: steps.detect.outputs.run == 'true'
        run: python -m unittest discover -s .github/tests -p "test_image_size_gate.py" -v

      - name: Enforce virtengine image size
        id: image_size
        if: steps.detect.outputs.run == 'true'
        env:
          IMAGE_SIZE_MAX: ${{ vars.IMAGE_SIZE_MAX }}
        run: |
          set -euo pipefail
          SIZE_BYTES=$(docker image inspect -f '{{.Size}}' virtengine:ci)
          echo "size_bytes=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo "virtengine image size: ${SIZE_BYTES} bytes"
          IMAGE_SIZE_BYTES="${SIZE_BYTES}" python3 scripts/ci/image_size_gate.py virtengine:ci

      - name: Build test-runner image (local)
        if: steps.detect.outputs.run == 'true'
        run: |
          docker buildx build --load -f _build/Dockerfile.test -t virtengine-test:ci .

      - name: Scan test-runner image
        if: steps.detect.outputs.run == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: virtengine-test:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Build veid-pipeline image (local)
        if: ${{ steps.detect.outputs.run == 'true' && hashFiles('ml/models/**') != '' }}
        run: |
          docker buildx build --load -f _build/Dockerfile.veid-pipeline -t veid-pipeline:ci .

      - name: Scan veid-pipeline image
        if: ${{ steps.detect.outputs.run == 'true' && hashFiles('ml/models/**') != '' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: veid-pipeline:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Log in to GHCR
        if: steps.detect.outputs.run == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push virtengine image
        if: steps.detect.outputs.run == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f _build/Dockerfile.virtengine \
            -t ghcr.io/${{ github.repository }}/virtengine:${{ github.sha }} \
            --push \
            .

      - name: Install cosign
        if: steps.detect.outputs.run == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@v3

      - name: Sign virtengine image
        if: steps.detect.outputs.run == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/virtengine:${{ github.sha }}

      - name: Verify virtengine image signature
        if: steps.detect.outputs.run == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@.*" \
            ghcr.io/${{ github.repository }}/virtengine:${{ github.sha }}

      - name: Skip notice
        if: steps.detect.outputs.run != 'true'
        run: echo "No container-relevant files changed, skipping job steps"

  # ===========================================================================
  # macOS Build - Native Build Verification (main/tags only)
  # ===========================================================================
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    # Only run on main branch or tags to save CI minutes
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-macos

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Build binaries
        run: make bins

      - name: Verify binaries
        run: |
          echo "=== Verifying macOS binaries ==="
          if [ -f ".cache/bin/virtengine" ]; then
            echo "virtengine binary exists"
            file .cache/bin/virtengine
            ./.cache/bin/virtengine version || echo "Version check skipped"
          else
            echo "Warning: virtengine binary not found in .cache/bin/"
            find . -name "virtengine" -type f 2>/dev/null | head -5
          fi

  # ===========================================================================
  # Simulation Tests - Cosmos SDK Sims (main/tags only)
  # ===========================================================================
  sims:
    name: Simulation Tests
    runs-on: ubuntu-latest
    # Only run on main branch or tags - sims are slow
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mainnet/main' || startsWith(github.ref, 'refs/tags/v')
    needs: test-go
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Run simulation tests
        run: |
          make test-sim-nondeterminism

      - name: Run import/export simulation
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          make test-sim-import-export

  # ===========================================================================
  # Network Upgrade Tests (tags only)
  # ===========================================================================
  network-upgrade:
    name: Network Upgrade Tests
    runs-on: ubuntu-latest
    # Only run on version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-go]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Validate upgrade directory structure
        run: |
          dir="./upgrades/software"
          if [ -d "${dir}" ]; then
            # Ensure only directories exist in upgrades dir
            if find "${dir}" -mindepth 1 -maxdepth 1 -type f | grep -q .; then
              echo "${dir} must contain only directories"
              exit 1
            fi

            # Ensure names of upgrade dirs are semver compliant
            while IFS= read -r upgrade; do
              [ -n "${upgrade}" ] || continue
              ./script/semver.sh validate "${upgrade}"
            done < <(find "${dir}" -mindepth 1 -maxdepth 1 -type d -exec basename '{}' ';' 2>/dev/null)
          else
            echo "No upgrades directory found, skipping validation"
          fi

      - name: Check if upgrade test required
        id: check
        run: |
          if [ -f "./script/upgrades.sh" ]; then
            test_required="$(./script/upgrades.sh test-required "${{ github.ref }}" 2>/dev/null || true)"
            echo "test_required=$test_required" >> "${GITHUB_OUTPUT}"
          else
            echo "test_required=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run upgrade test
        if: steps.check.outputs.test_required != ''
        run: |
          cd tests/upgrade
          make test

  compatibility-gate:
    name: Compatibility Gate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/compatibility.yaml

  post-deploy-smoke:
    name: Post-Deploy Smoke Gate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/smoke-test.yaml
    with:
      environment: staging
    secrets: inherit

  staging-e2e-gate:
    name: Staging E2E Gate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/staging-e2e.yaml
    with:
      environment: staging

  veid-e2e-gate:
    name: VEID E2E Gate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/veid-e2e.yaml

  ml-determinism-gate:
    name: ML Determinism Gate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ml-determinism.yaml

  veid-conformance-gate:
    name: VEID Conformance Gate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/veid-conformance.yaml

  # ===========================================================================
  # Release Job - Prepare Draft Release Candidate on Tag
  # ===========================================================================
  release:
    name: Release Candidate Bundle
    runs-on: ubuntu-latest
    needs:
      - ci-summary
      - test-python
      - test-portal
      - sims
      - network-upgrade
      - compatibility-gate
      - post-deploy-smoke
      - staging-e2e-gate
      - veid-e2e-gate
      - ml-determinism-gate
      - veid-conformance-gate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          mapfile -t archives < <(find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No release archives were downloaded"
            exit 1
          fi
          sha256sum -- "${archives[@]}" > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
          draft: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          # Release bodies have exactly one writer: release.yaml's publish job runs
          # GoReleaser with --release-notes=.cache/changelog.md and release.mode=replace,
          # and script/genchangelog.sh (make gen-changelog) is the single notes generator.
          # GitHub's own note generation is a competing writer, so it stays off here.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # CI Quality Gates Summary (INFRA-003)
  # ===========================================================================
  ci-summary:
    name: CI Quality Gates
    runs-on: ubuntu-latest
    needs:
      - lint
      - vet
      - lint-shell
      - test-go
      - economics-sim
      - build
      - integration
      - container-security
      - backup-restore-smoke
      - test-python
      - test-portal
      - sims
      - network-upgrade
      - compatibility-gate
      - post-deploy-smoke
      - staging-e2e-gate
      - veid-e2e-gate
      - ml-determinism-gate
      - veid-conformance-gate
    if: always()
    steps:
      - name: Generate CI Summary
        run: |
          {
            echo "# CI Pipeline Summary"
            echo ""
            echo "## Required Quality Gates"
            echo ""
            echo "| Gate | Status | Required |"
            echo "|------|--------|----------|"
            echo "| Go Linting | ${{ needs.lint.result }} | Yes |"
            echo "| Go Vet | ${{ needs.vet.result }} | Yes |"
            echo "| Shell Linting | ${{ needs.lint-shell.result }} | Warning only |"
            echo "| Go Tests | ${{ needs.test-go.result }} | Yes |"
            echo "| Economics Sim | ${{ needs.economics-sim.result }} | Yes |"
            echo "| Build | ${{ needs.build.result }} | Yes |"
            echo "| Integration Tests | ${{ needs.integration.result }} | Yes |"
            echo "| Container Security | ${{ needs.container-security.result }} | Yes |"
            echo "| DR Backup/Restore Smoke | ${{ needs.backup-restore-smoke.result }} | Yes |"
            echo "| Python Tests | ${{ needs.test-python.result }} | Yes |"
            echo "| Portal Tests | ${{ needs.test-portal.result }} | Yes |"
            echo ""
            if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
              echo "## Release-Grade Tag Gates"
              echo "| Gate | Status | Required |"
              echo "|------|--------|----------|"
              echo "| Simulation Tests | ${{ needs.sims.result }} | Yes |"
              echo "| Network Upgrade | ${{ needs.network-upgrade.result }} | Yes |"
              echo "| Compatibility | ${{ needs.compatibility-gate.result }} | Yes |"
              echo "| Post-Deploy Smoke | ${{ needs.post-deploy-smoke.result }} | Yes |"
              echo "| Staging E2E | ${{ needs.staging-e2e-gate.result }} | Yes |"
              echo "| VEID E2E | ${{ needs.veid-e2e-gate.result }} | Yes |"
              echo "| ML Determinism | ${{ needs.ml-determinism-gate.result }} | Yes |"
              echo "| VEID Conformance | ${{ needs.veid-conformance-gate.result }} | Yes |"
              echo ""
            fi
            echo "## Pre-push Parity"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| golangci-lint | ${{ needs.lint.result }} |"
            echo "| go vet | ${{ needs.vet.result }} |"
            echo "| go test (unit) | ${{ needs.test-go.result }} |"
            echo ""
            echo "## INFRA-003 Compliance"
            echo "- Static code analysis (golangci-lint with gosec)"
            echo "- Code coverage enforcement (80% minimum)"
            echo "- Container image scanning (Trivy)"
            echo "- Integration test gates"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check required gates
        run: |
          FAILED=0

          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "::error::Linting failed"
            FAILED=1
          fi

          if [ "${{ needs.vet.result }}" == "failure" ]; then
            echo "::error::Go vet failed"
            FAILED=1
          fi

          if [ "${{ needs.test-go.result }}" == "failure" ]; then
            echo "::error::Go tests failed"
            FAILED=1
          fi

          if [ "${{ needs.economics-sim.result }}" == "failure" ]; then
            echo "::error::Economics simulation suite failed"
            FAILED=1
          fi

          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "::error::Build failed"
            FAILED=1
          fi

          if [ "${{ needs.integration.result }}" == "failure" ]; then
            echo "::error::Integration tests failed"
            FAILED=1
          fi

          if [ "${{ needs.container-security.result }}" == "failure" ]; then
            echo "::error::Container security checks failed"
            FAILED=1
          fi

          if [ "${{ needs.backup-restore-smoke.result }}" == "failure" ]; then
            echo "::error::DR backup/restore smoke test failed"
            FAILED=1
          fi

          if [ "${{ needs.test-python.result }}" == "failure" ]; then
            echo "::error::Python tests failed"
            FAILED=1
          fi

          if [ "${{ needs.test-portal.result }}" == "failure" ]; then
            echo "::error::Portal tests failed"
            FAILED=1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            for release_gate in sims network-upgrade compatibility-gate post-deploy-smoke staging-e2e-gate veid-e2e-gate ml-determinism-gate veid-conformance-gate; do
              case "${release_gate}" in
                sims) result="${{ needs.sims.result }}" ;;
                network-upgrade) result="${{ needs.network-upgrade.result }}" ;;
                compatibility-gate) result="${{ needs.compatibility-gate.result }}" ;;
                post-deploy-smoke) result="${{ needs.post-deploy-smoke.result }}" ;;
                staging-e2e-gate) result="${{ needs.staging-e2e-gate.result }}" ;;
                veid-e2e-gate) result="${{ needs.veid-e2e-gate.result }}" ;;
                ml-determinism-gate) result="${{ needs.ml-determinism-gate.result }}" ;;
                veid-conformance-gate) result="${{ needs.veid-conformance-gate.result }}" ;;
              esac
              if [ "${result}" != "success" ]; then
                echo "::error::${release_gate} failed"
                FAILED=1
              fi
            done
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more required quality gates failed"
            exit 1
          fi

          echo "✅ All required quality gates passed"
