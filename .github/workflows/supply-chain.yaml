name: Supply Chain Security

on:
  push:
    branches:
      - main
      - mainnet/main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - mainnet/main
      - develop
    paths:
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "vendor/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "portal/package.json"
      - "lib/portal/package.json"
      - "lib/admin/package.json"
      - "lib/capture/package.json"
      - "sdk/portal/package.json"
      - "sdk/portal/pnpm-lock.yaml"
      - "sdk/ts/package.json"
      - "sdk/ts/package-lock.json"
      - "ml/**/requirements*.txt"
      - ".github/workflows/supply-chain.yaml"
      - ".github/scripts/validate_security_policies.py"
      - ".github/tests/test_security_policy*.py"
      - ".gitleaks.toml"
      - ".vulnerability-allowlist.yaml"
      - "SUPPLY_CHAIN_SECURITY.md"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      full_audit:
        description: Run the reproducibility check in addition to the standard supply-chain bar.
        required: false
        default: true
        type: boolean

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.25.5"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.2"
  COSIGN_VERSION: "v3.0.6"
  SYFT_VERSION: "v1.42.4"
  SLSA_VERIFIER_VERSION: "v2.7.1"
  GOWORK: "off"

permissions:
  contents: read

jobs:
  policy-validation:
    name: Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Validate security policy files
        run: |
          python .github/scripts/validate_security_policies.py --files \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml \
            .gitleaks.toml \
            .vulnerability-allowlist.yaml \
            SUPPLY_CHAIN_SECURITY.md

      - name: Run policy validator tests
        run: python -m unittest discover -s .github/tests -p "test_security_policy*.py"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint targeted workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml

  dependency-verification:
    name: Dependency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sdk/portal/pnpm-lock.yaml

      - name: Verify Go dependencies
        run: |
          go mod verify

          cp go.mod go.mod.snapshot
          cp go.sum go.sum.snapshot
          go mod tidy
          diff -u go.mod.snapshot go.mod
          diff -u go.sum.snapshot go.sum
          rm -f go.mod.snapshot go.sum.snapshot

          go mod vendor
          git diff --exit-code -- vendor

      - name: Verify root pnpm workspace
        run: |
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml

      - name: Verify sdk/portal lockfile
        run: |
          test -f sdk/portal/pnpm-lock.yaml
          pnpm --dir sdk/portal install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- sdk/portal/pnpm-lock.yaml

      - name: Verify sdk/ts lockfile
        run: |
          test -f sdk/ts/package-lock.json
          npm --prefix sdk/ts ci --ignore-scripts
          git diff --exit-code -- sdk/ts/package-lock.json

  lockfile-integrity:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required lockfiles exist
        run: |
          test -f go.sum
          test -f pnpm-lock.yaml
          test -f sdk/portal/pnpm-lock.yaml
          test -f sdk/ts/package-lock.json

      - name: Check dependency diff discipline for pull requests
        if: github.event_name == 'pull_request'
        run: |
          base_ref="${{ github.base_ref }}"
          git fetch origin "$base_ref" --depth=1
          changed_files=$(git diff --name-only "origin/${base_ref}...HEAD")

          require_pair() {
            local lockfile="$1"
            local manifest="$2"
            if echo "$changed_files" | grep -qx "$lockfile"; then
              if ! echo "$changed_files" | grep -qx "$manifest"; then
                echo "::error::${lockfile} changed without ${manifest}"
                exit 1
              fi
            fi
          }

          require_pair "go.sum" "go.mod"
          require_pair "sdk/ts/package-lock.json" "sdk/ts/package.json"
          require_pair "sdk/portal/pnpm-lock.yaml" "sdk/portal/package.json"

          if echo "$changed_files" | grep -qx "pnpm-lock.yaml"; then
            if ! echo "$changed_files" | grep -Eq '^(portal|lib/portal|lib/admin|lib/capture)/package\.json$|^pnpm-workspace\.yaml$'; then
              echo "::error::pnpm-lock.yaml changed without a workspace manifest change"
              exit 1
            fi
          fi

  attack-detection:
    name: Supply Chain Attack Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run attack-detection script
        run: |
          mkdir -p .cache/supply-chain
          chmod +x scripts/supply-chain/detect-supply-chain-attacks.sh
          scripts/supply-chain/detect-supply-chain-attacks.sh --all --json > .cache/supply-chain/attack-detection.json

      - name: Upload attack-detection report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attack-detection-report
          path: .cache/supply-chain/attack-detection.json
          retention-days: 30

  risk-assessment:
    name: Dependency Risk Assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run dependency risk assessment
        run: |
          mkdir -p .cache/supply-chain
          set +e
          go run ./scripts/supply-chain/assess-dependencies.go --report --json > .cache/supply-chain/risk-assessment.json
          status=$?
          set -e
          if [ ! -s .cache/supply-chain/risk-assessment.json ]; then
            echo "::error::Dependency risk assessment did not produce JSON output"
            exit 1
          fi

          high_risk=$(jq -r '.high_risk_count' .cache/supply-chain/risk-assessment.json)
          failing_packages=$(jq -r '.failing_packages' .cache/supply-chain/risk-assessment.json)
          average_score=$(jq -r '.summary.average_score' .cache/supply-chain/risk-assessment.json)

          echo "Average dependency score: ${average_score}"
          echo "High risk packages: ${high_risk}"
          echo "Failing packages: ${failing_packages}"

          if [ "$status" -ne 0 ] || [ "$high_risk" -ne 0 ] || [ "$failing_packages" -ne 0 ]; then
            echo "::error::Dependency risk assessment rejected the current dependency set"
            exit 1
          fi

      - name: Upload risk-assessment report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-assessment-report
          path: .cache/supply-chain/risk-assessment.json
          retention-days: 30

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" | tar -xz
          sudo install -m 0755 syft /usr/local/bin/syft

      - name: Generate SBOM bundle
        run: |
          chmod +x scripts/supply-chain/generate-sbom.sh
          scripts/supply-chain/generate-sbom.sh --format all --output .cache/supply-chain/sbom
          sha256sum .cache/supply-chain/sbom/*.json > .cache/supply-chain/sbom/SHA256SUMS

      - name: Upload SBOM bundle
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-sbom
          path: .cache/supply-chain/sbom
          retention-days: 90

  build-release-subjects:
    name: Build Release Subjects
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - policy-validation
      - dependency-verification
      - lockfile-integrity
      - attack-detection
      - risk-assessment
      - sbom-generation
    outputs:
      base64-subjects: ${{ steps.subjects.outputs.base64-subjects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download SBOM bundle
        uses: actions/download-artifact@v4
        with:
          name: supply-chain-sbom
          path: release-subjects/sbom

      - name: Build deterministic release binary
        run: |
          mkdir -p release-subjects rebuild
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"

          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o release-subjects/virtengine ./cmd/virtengine
          sha256sum release-subjects/virtengine > release-subjects/virtengine.sha256

          go clean -cache
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o rebuild/virtengine ./cmd/virtengine
          sha256sum rebuild/virtengine > rebuild/virtengine.sha256

          diff -u release-subjects/virtengine.sha256 rebuild/virtengine.sha256

      - name: Create provenance subjects
        id: subjects
        run: |
          {
            sha256sum release-subjects/virtengine
            sha256sum release-subjects/virtengine.sha256
            find release-subjects/sbom -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum
          } > release-subjects/provenance-subjects.txt

          echo "base64-subjects=$(base64 -w0 release-subjects/provenance-subjects.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload release subjects
        uses: actions/upload-artifact@v4
        with:
          name: release-subjects
          path: release-subjects
          retention-days: 90

  sign-release-artifacts:
    name: Sign Release Artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-release-subjects
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release subjects
        uses: actions/download-artifact@v4
        with:
          name: release-subjects
          path: release-subjects

      - name: Install cosign
        run: |
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o cosign
          sudo install -m 0755 cosign /usr/local/bin/cosign

      - name: Sign binary, checksum, and SBOM artifacts
        run: |
          shopt -s nullglob
          artifacts=(
            release-subjects/virtengine
            release-subjects/virtengine.sha256
            release-subjects/sbom/*.json
          )
          for artifact in "${artifacts[@]}"; do
            cosign sign-blob \
              --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.sig.cert" \
              "$artifact"
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-signatures
          path: |
            release-subjects/**/*.sig
            release-subjects/**/*.sig.cert
          retention-days: 90

  verify-release-signatures:
    name: Verify Release Signatures
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - sign-release-artifacts
    steps:
      - name: Download release subjects
        uses: actions/download-artifact@v4
        with:
          name: release-subjects
          path: release-subjects

      - name: Download release signatures
        uses: actions/download-artifact@v4
        with:
          name: release-signatures
          path: release-subjects

      - name: Install cosign
        run: |
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o cosign
          sudo install -m 0755 cosign /usr/local/bin/cosign

      - name: Verify signatures
        run: |
          shopt -s nullglob
          expected_identity="https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yaml@${{ github.ref }}"
          artifacts=(
            release-subjects/virtengine
            release-subjects/virtengine.sha256
            release-subjects/sbom/*.json
          )
          for artifact in "${artifacts[@]}"; do
            cosign verify-blob \
              --signature "${artifact}.sig" \
              --certificate "${artifact}.sig.cert" \
              --certificate-identity "$expected_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$artifact"
          done

  provenance:
    name: Generate SLSA Provenance
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-release-subjects
    permissions:
      actions: read
      id-token: write
      contents: write
      attestations: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build-release-subjects.outputs.base64-subjects }}

  verify-provenance:
    name: Verify Provenance
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - provenance
      - build-release-subjects
    steps:
      - name: Download release subjects
        uses: actions/download-artifact@v4
        with:
          name: release-subjects
          path: release-subjects

      - name: Download provenance artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install slsa-verifier
        run: go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@${{ env.SLSA_VERIFIER_VERSION }}

      - name: Verify provenance subjects
        run: |
          provenance_path=$(find provenance -type f -name '*.intoto.jsonl' -print -quit)
          if [ -z "$provenance_path" ]; then
            echo "::error::Missing provenance artifact"
            exit 1
          fi

          shopt -s nullglob
          artifacts=(
            release-subjects/virtengine
            release-subjects/virtengine.sha256
            release-subjects/sbom/*.json
          )
          for artifact in "${artifacts[@]}"; do
            "$(go env GOPATH)/bin/slsa-verifier" verify-artifact \
              --provenance-path "$provenance_path" \
              --source-uri "github.com/${{ github.repository }}" \
              "$artifact"
          done

  reproducible-build:
    name: Reproducible Build Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify reproducible build output
        run: |
          mkdir -p /tmp/virtengine-build-a /tmp/virtengine-build-b
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"

          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o /tmp/virtengine-build-a/virtengine ./cmd/virtengine
          sha256sum /tmp/virtengine-build-a/virtengine > /tmp/virtengine-build-a/virtengine.sha256

          go clean -cache
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o /tmp/virtengine-build-b/virtengine ./cmd/virtengine
          sha256sum /tmp/virtengine-build-b/virtengine > /tmp/virtengine-build-b/virtengine.sha256

          diff -u /tmp/virtengine-build-a/virtengine.sha256 /tmp/virtengine-build-b/virtengine.sha256

  summary:
    name: Supply Chain Summary
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - dependency-verification
      - lockfile-integrity
      - attack-detection
      - risk-assessment
      - sbom-generation
      - build-release-subjects
      - sign-release-artifacts
      - verify-release-signatures
      - provenance
      - verify-provenance
      - reproducible-build
    if: always()
    steps:
      - name: Summarize supply-chain gates
        run: |
          echo "# Supply Chain Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Policy Validation | ${{ needs.policy-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency Verification | ${{ needs.dependency-verification.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lockfile Integrity | ${{ needs.lockfile-integrity.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Attack Detection | ${{ needs.attack-detection.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Risk Assessment | ${{ needs.risk-assessment.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM Generation | ${{ needs.sbom-generation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Reproducible Build Audit | ${{ needs.reproducible-build.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            echo "| Build Release Subjects | ${{ needs.build-release-subjects.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Sign Release Artifacts | ${{ needs.sign-release-artifacts.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Verify Release Signatures | ${{ needs.verify-release-signatures.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Generate SLSA Provenance | ${{ needs.provenance.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Verify Provenance | ${{ needs.verify-provenance.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on supply-chain gate failure
        run: |
          FAILED=0
          core_results=(
            "${{ needs.policy-validation.result }}"
            "${{ needs.dependency-verification.result }}"
            "${{ needs.lockfile-integrity.result }}"
            "${{ needs.attack-detection.result }}"
            "${{ needs.risk-assessment.result }}"
            "${{ needs.sbom-generation.result }}"
          )

          for result in "${core_results[@]}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED=1
            fi
          done

          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            release_results=(
              "${{ needs.build-release-subjects.result }}"
              "${{ needs.sign-release-artifacts.result }}"
              "${{ needs.verify-release-signatures.result }}"
              "${{ needs.provenance.result }}"
              "${{ needs.verify-provenance.result }}"
            )
            for result in "${release_results[@]}"; do
              if [ "$result" = "failure" ] || [ "$result" = "cancelled" ] || [ "$result" = "skipped" ]; then
                FAILED=1
              fi
            done
          fi

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [ "${{ needs.reproducible-build.result }}" = "failure" ] || [ "${{ needs.reproducible-build.result }}" = "cancelled" ]; then
              FAILED=1
            fi
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more required supply-chain gates failed"
            exit 1
          fi
