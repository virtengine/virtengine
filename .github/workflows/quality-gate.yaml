# VirtEngine Quality Gate
#
# Branch-safe checks for PRs and protected branches. Release-grade VEID and ML
# workflows are orchestrated here when relevant and are re-used again by tag CI
# and manual release publishing.

name: Quality Gate

on:
  pull_request:
    branches:
      - main
      - mainnet/main
      - develop
  push:
    branches:
      - main
      - mainnet/main
      - develop
      - "release/**"

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.8"
  GOSEC_VERSION: "v2.25.0"
  GOWORK: "off"
  GO_TEST_TIMEOUT_UNIT: "30m"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.28.2"

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      go_changed: ${{ steps.changes.outputs.go }}
      ml_changed: ${{ steps.changes.outputs.ml }}
      veid_changed: ${{ steps.changes.outputs.veid }}
      portal_changed: ${{ steps.changes.outputs.portal }}
      economics_changed: ${{ steps.changes.outputs.economics }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Analyze file changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            ml:
              - 'pkg/inference/**'
              - 'ml/**'
              - '.github/workflows/ml-determinism.yaml'
            veid:
              - 'x/veid/**'
              - 'pkg/inference/**'
              - 'tests/e2e/veid_*.go'
              - 'tests/e2e/veid_*.go'
              - '.github/workflows/veid-e2e.yaml'
              - '.github/workflows/veid-conformance.yaml'
            portal:
              - 'portal/**'
              - 'lib/portal/**'
              - 'lib/capture/**'
            economics:
              - 'sim/**'
              - 'cmd/ve-sim/**'
              - 'app/gaspricing/**'
              - 'app/ante_gaspricing.go'
              - 'app/ante.go'

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: analyze-changes
    # Bound the job itself so a genuinely hung linter fails visibly and fast
    # instead of sitting on GitHub's 360-minute default. This is a backstop,
    # not the working budget: the linter's own --timeout below is what governs
    # a normal run.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fetch base ref for lint diff
        run: git fetch origin "${{ github.base_ref || 'main' }}" --depth=1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: bash scripts/ci/go-mod-download.sh

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Enforce consensus determinism policy
        run: go run ./scripts/consensusdeterminism -root .

      - name: Run golangci-lint (PR diff)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=30m --new-from-rev=origin/${{ github.base_ref || 'main' }}

  vet:
    name: vet
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: bash scripts/ci/go-mod-download.sh

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Run go vet
        env:
          GOFLAGS: "-mod=readonly"
        run: go vet ./...

  # The retry wrapper is exactly the shape of thing that can rot into a vacuous
  # pass, so its own self-test runs on every gate run - and deliberately in its
  # OWN job rather than inside `vet`.
  #
  # If it lived in `vet`, a broken wrapper would fail that job at "Download
  # dependencies" and the self-tests would never execute, so the one job whose
  # purpose is to diagnose the wrapper could not run whenever the wrapper was
  # actually broken. A wrapper that is only self-tested after it has already
  # worked is not a self-test. This job has no `needs:` and needs no Go
  # toolchain at all (the tests plant a `go` stub on PATH), so it stays cheap and
  # always reports.
  go-mod-download-selftest:
    name: go-mod-download selftest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: go-mod-download self-tests
        run: |
          rc=0
          node --test scripts/ci/go-mod-download.test.mjs > go-mod-download-tests.log 2>&1 || rc=$?
          # Always print the log, pass or fail: `set -e` would otherwise abort
          # here and throw away the only evidence of why a self-test failed.
          cat go-mod-download-tests.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::go-mod-download self-tests failed (exit $rc)"
            exit "$rc"
          fi
          # A test run that discovers no tests also exits 0, so assert a positive
          # count rather than trusting the exit status alone.
          count=$(grep -oE 'tests[[:space:]]+[0-9]+' go-mod-download-tests.log | head -1 | grep -oE '[0-9]+')
          if [ -z "${count:-}" ] || [ "$count" -eq 0 ]; then
            echo "::error::go-mod-download self-tests did not run"
            exit 1
          fi
          echo "go-mod-download self-tests: ${count} test(s) passed"

      # The wrapper this job protects is executed with `bash` on every runner, so
      # its line endings must survive the checkout intact. A CRLF blob parses as
      # a syntax error on ubuntu (`case ... in $'\r'`) and turns this whole gate
      # red; fail loudly here instead of as a mystery failure in five other jobs.
      - name: The wrapper must be LF-only
        run: |
          if grep -qU $'\r' scripts/ci/go-mod-download.sh; then
            echo "::error::scripts/ci/go-mod-download.sh contains CRLF; on ubuntu bash this is a syntax error"
            exit 1
          fi
          echo "go-mod-download.sh is LF-only"

  # The macOS build job it protects only runs on main and tags:
  #   ci.yaml build-macos: if: github.ref == 'refs/heads/main' || startsWith(ref, 'refs/tags/v')
  # so a composite action that breaks the darwin build lands on main already
  # merged, and every develop PR is green while main is red. That is how
  # `.github/actions/setup-macos` shipped a forced `GO_LINKMODE=internal` and the
  # `Build (macOS)` job went red 3/3 without anyone being able to reproduce it
  # before merge. This job is the PR-time substitute for that one.
  #
  # It has no `needs:` and needs no Go toolchain — it asks `make` two questions,
  # nothing more — so it stays cheap and always reports.
  build-linkmode-selftest:
    name: build-linkmode selftest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: build-linkmode self-tests
        run: |
          rc=0
          node --test scripts/ci/check-build-linkmode.test.mjs > build-linkmode-tests.log 2>&1 || rc=$?
          # Always print the log, pass or fail: `set -e` would otherwise abort
          # here and throw away the only evidence of why a self-test failed.
          cat build-linkmode-tests.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::build-linkmode self-tests failed (exit $rc)"
            exit "$rc"
          fi
          # A test run that discovers no tests also exits 0, so assert a positive
          # count rather than trusting the exit status alone.
          count=$(grep -oE 'tests[[:space:]]+[0-9]+' build-linkmode-tests.log | head -1 | grep -oE '[0-9]+')
          if [ -z "${count:-}" ] || [ "$count" -eq 0 ]; then
            echo "::error::build-linkmode self-tests did not run"
            exit 1
          fi
          echo "build-linkmode self-tests: ${count} test(s) passed"

      # The guard runs on ubuntu, where `Makefile` does NOT apply its
      # Windows_NT override, so the two make targets can be cross-checked here.
      # If this ever runs on a Windows runner the drift check silently skips and
      # the only thing still testing the copy is case 0; fail loudly rather than
      # let the gate weaken silently.
      - name: The runner view must be the one that differs from the local view
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "::error::this gate must run on a POSIX runner; on Windows the Makefile's Windows_NT override makes every linkmode comparison vacuous"
            exit 1
          fi
          echo "runner view is checkable on $RUNNER_OS"

      - name: No composite action may force a linkmode the Makefile disagrees with
        run: |
          rc=0
          node scripts/ci/check-build-linkmode.mjs > check-build-linkmode.log 2>&1 || rc=$?
          cat check-build-linkmode.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::a composite action forces a GO_LINKMODE the Makefile disagrees with (exit $rc)"
            exit "$rc"
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, vet]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: bash scripts/ci/go-mod-download.sh

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Build binaries
        run: go build -mod=readonly -v ./cmd/...

  test-go:
    name: test-go
    runs-on: ubuntu-latest
    needs: [lint, vet]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: bash scripts/ci/go-mod-download.sh

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Run core tests
        run: |
          go test -mod=readonly -v -short -race -timeout "${GO_TEST_TIMEOUT_UNIT}" \
            ./pkg/benchmark/... \
            ./pkg/cache/... \
            ./pkg/compatibility/... \
            ./pkg/enclave_runtime/... \
            ./pkg/errors/... \
            ./pkg/inference/... \
            ./pkg/pruning/... \
            ./pkg/ratelimit/... \
            ./pkg/waldur/... \
            ./pkg/workflow/... \
            ./x/enclave/... \
            ./x/encryption/...

  infra-contracts:
    name: infra-contracts
    runs-on: ubuntu-latest
    needs: analyze-changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: infra/tests/go.sum

      - name: Run offline infra + workflow contract tests
        # infra/tests is a separate Go module, so the root module's test-go job
        # (an explicit ./pkg/... + ./x/... allowlist) cannot reach it. Without
        # this job the workflow/terraform contract tests pass in CI no matter
        # what they assert. The script fails closed: every contract test it
        # names must report PASS.
        run: ./scripts/test-infra-contracts.sh

  agents-docs:
    name: agents-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate AGENTS documentation
        run: node scripts/validate-agents-docs.mjs

  deploy-env-policies:
    name: deploy-env-policies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The census reads the real remote branch list, so it needs a real
          # remote-tracking view rather than a depth-1 clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Falsify the deploy-environment policy guard
        # Runs the offline fixture suite first: if the guard's own assertions
        # are broken the gate must say so rather than reporting a verdict from a
        # classifier that no longer works.
        run: node scripts/ci/check-deploy-env-policies.mjs --selftest

      - name: Falsification suite for the deploy-environment policy guard
        run: node scripts/ci/check-deploy-env-policies.test.mjs

      - name: Check deployment environment branch policies
        # Fails when a workflow's `environment:` cannot be reached by the refs
        # that trigger it -- a job rejected before a runner is scheduled, which
        # GitHub reports as `failure` with zero steps. Exit 2 (unreadable API)
        # is deliberately NOT a pass, so a token/scope problem cannot read as a
        # clean estate.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-deploy-env-policies.mjs

  economics-sim:
    name: economics-sim
    runs-on: ubuntu-latest
    needs: [lint, vet, analyze-changes]
    if: needs.analyze-changes.outputs.economics_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: bash scripts/ci/go-mod-download.sh

      - name: Run economics simulation suite
        run: |
          chmod +x scripts/economics/run-sim-suite.sh
          RUNS=40 scripts/economics/run-sim-suite.sh ./sim-output

  gosec-scan:
    name: gosec-scan
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.go_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Run gosec
        run: |
          base_ref="${{ github.base_ref || 'main' }}"
          # See supply-chain.yaml "Check dependency diff discipline": a depth-1
          # fetch of the base ref removes the ancestry `git merge-base` needs and
          # the three-dot diff dies with `fatal: ... no merge base` (exit 128).
          # Here that is worse than a false red - the `|| true` on the pipeline
          # below turns it into an EMPTY changed-file list, so gosec scans nothing
          # and the step passes green having analysed zero packages.
          git fetch --unshallow origin 2>/dev/null \
            || git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          # Fail closed: never let an uncomputed diff look like "no Go changed".
          if ! git merge-base "origin/${base_ref}" HEAD >/dev/null 2>&1; then
            echo "::error::no merge base between origin/${base_ref} and HEAD even after a full fetch."
            echo "::error::refusing to run gosec on an empty target set - that reports 0 findings, not clean code."
            exit 1
          fi
          mapfile -t changed_files < <(
            git diff --name-only "origin/${base_ref}...HEAD" -- '*.go' \
              | grep -v '_test.go' \
              | grep -v 'vendor/' \
              | grep -v '\.pb\.go$' \
              || true
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No non-generated Go files changed"
            exit 0
          fi

          gosec_exit=0
          gosec -fmt json -out gosec-results.json -exclude-generated "${changed_files[@]}" || gosec_exit=$?

          if [ ! -f gosec-results.json ]; then
            echo "::error::gosec did not produce gosec-results.json"
            exit "${gosec_exit}"
          fi

          high_critical=$(jq '[.Issues[] | select(.severity == "HIGH" or .severity == "CRITICAL")] | length' gosec-results.json)
          medium=$(jq '[.Issues[] | select(.severity == "MEDIUM")] | length' gosec-results.json)

          if [ "${high_critical}" -gt 0 ]; then
            echo "::error::Found ${high_critical} high/critical severity issues"
            exit 1
          fi

          if [ "${medium}" -gt 0 ]; then
            echo "::warning::Found ${medium} medium severity issues"
          fi

          if [ "${gosec_exit}" -ne 0 ] && [ "${high_critical}" -eq 0 ]; then
            echo "gosec reported non-blocking issues already captured in the JSON report"
          fi

  gitleaks-scan:
    name: gitleaks-scan
    runs-on: ubuntu-latest
    needs: analyze-changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          TOOL_DIR="$(mktemp -d)"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C "$TOOL_DIR"
          sudo install -m 0755 "$TOOL_DIR/gitleaks" /usr/local/bin/gitleaks

      - name: Fetch base ref for diff scanning
        # Fetch the full base branch INTO the remote-tracking ref. The old
        # `git fetch origin "<base>" --depth=1` only updated FETCH_HEAD, left a
        # shallow boundary, and never moved the origin/<base> ref the next step
        # reads — so merge-base found no common ancestor and the step died here
        # under `set -e` with no scan at all.
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }}"

      - name: Run gitleaks on PR diff
        run: |
          # Never let an empty base_sha through silently: fail loudly, or fall
          # back to the pull-request base SHA (PR events) / base tip (push).
          base_sha=""
          if base_sha=$(git merge-base "origin/${{ github.base_ref || 'main' }}" HEAD 2>merge-base.err); then
            echo "merge-base: ${base_sha}"
          elif [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "::warning::git merge-base failed; falling back to the pull-request base SHA"
            if [ -s merge-base.err ]; then cat merge-base.err; fi
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            echo "::warning::git merge-base failed; falling back to the base branch tip"
            if [ -s merge-base.err ]; then cat merge-base.err; fi
            base_sha=$(git rev-parse "origin/${{ github.base_ref || 'main' }}")
          fi
          rm -f merge-base.err
          [ -n "${base_sha}" ] || { echo "::error::could not determine base SHA for secret scan"; exit 1; }
          git rev-parse --verify --quiet "${base_sha}^{commit}" >/dev/null || { echo "::error::base SHA ${base_sha} is not present locally"; exit 1; }
          if [ -f .gitleaks.toml ]; then
            gitleaks detect --source . --config .gitleaks.toml --log-opts "${base_sha}..HEAD" --verbose --redact
          else
            gitleaks detect --source . --log-opts "${base_sha}..HEAD" --verbose --redact
          fi

  ml-determinism-check:
    name: ml-determinism-check
    needs: analyze-changes
    if: needs.analyze-changes.outputs.ml_changed == 'true'
    uses: ./.github/workflows/ml-determinism.yaml

  veid-e2e-check:
    name: veid-e2e-check
    needs: analyze-changes
    if: needs.analyze-changes.outputs.veid_changed == 'true'
    uses: ./.github/workflows/veid-e2e.yaml

  veid-conformance-check:
    name: veid-conformance-check
    needs: analyze-changes
    if: needs.analyze-changes.outputs.veid_changed == 'true'
    uses: ./.github/workflows/veid-conformance.yaml

  portal-lint:
    name: portal-lint
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.portal_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run portal lint and type-check
        run: |
          pnpm --filter @virtengine/portal lint
          pnpm --filter @virtengine/portal type-check

  portal-test:
    name: portal-test
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.portal_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run portal tests
        run: pnpm --filter @virtengine/portal test

  portal-build:
    name: portal-build
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.portal_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portal
        run: pnpm --filter @virtengine/portal build

  quality-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs:
      - analyze-changes
      - lint
      - vet
      - go-mod-download-selftest
      - build-linkmode-selftest
      - build
      - test-go
      - agents-docs
      - economics-sim
      - gosec-scan
      - gitleaks-scan
      - ml-determinism-check
      - veid-e2e-check
      - veid-conformance-check
      - portal-lint
      - portal-test
      - portal-build
    if: always()
    steps:
      - name: Check required jobs passed
        run: |
          failed=0

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint failed"
            failed=1
          fi

          if [ "${{ needs.vet.result }}" != "success" ]; then
            echo "::error::vet failed"
            failed=1
          fi

          # Unconditional, unlike the change-gated checks below: the wrapper this
          # guards protects EVERY job in this workflow, so a red here is not
          # conditional on what the PR touched.
          if [ "${{ needs.go-mod-download-selftest.result }}" != "success" ]; then
            echo "::error::go-mod-download selftest failed"
            failed=1
          fi

          # Also unconditional: the job it guards (Build (macOS)) runs only on
          # main and tags, so a composite action that breaks the darwin build is
          # otherwise invisible until after merge. This is the only signal that
          # can stop that in a PR.
          if [ "${{ needs.build-linkmode-selftest.result }}" != "success" ]; then
            echo "::error::build-linkmode selftest failed"
            failed=1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build failed"
            failed=1
          fi

          if [ "${{ needs.test-go.result }}" != "success" ]; then
            echo "::error::test-go failed"
            failed=1
          fi

          if [ "${{ needs.gitleaks-scan.result }}" != "success" ]; then
            echo "::error::gitleaks-scan failed"
            failed=1
          fi

          if [ "${{ needs.analyze-changes.outputs.go_changed }}" == "true" ] && [ "${{ needs.gosec-scan.result }}" != "success" ]; then
            echo "::error::gosec security scan failed"
            failed=1
          fi

          if [ "${{ needs.analyze-changes.outputs.ml_changed }}" == "true" ] && [ "${{ needs.ml-determinism-check.result }}" != "success" ]; then
            echo "::error::ML determinism check failed"
            failed=1
          fi

          if [ "${{ needs.analyze-changes.outputs.veid_changed }}" == "true" ]; then
            if [ "${{ needs.veid-e2e-check.result }}" != "success" ]; then
              echo "::error::VEID E2E check failed"
              failed=1
            fi
            if [ "${{ needs.veid-conformance-check.result }}" != "success" ]; then
              echo "::error::VEID conformance check failed"
              failed=1
            fi
          fi

          if [ "${{ needs.analyze-changes.outputs.portal_changed }}" == "true" ]; then
            if [ "${{ needs.portal-lint.result }}" != "success" ]; then
              echo "::error::portal-lint failed"
              failed=1
            fi
            if [ "${{ needs.portal-test.result }}" != "success" ]; then
              echo "::error::portal-test failed"
              failed=1
            fi
            if [ "${{ needs.portal-build.result }}" != "success" ]; then
              echo "::error::portal-build failed"
              failed=1
            fi
          fi

          if [ "${{ needs.analyze-changes.outputs.economics_changed }}" == "true" ] && [ "${{ needs.economics-sim.result }}" != "success" ]; then
            echo "::error::Economics simulation suite failed"
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

      - name: Post summary
        if: always()
        run: |
          {
            echo "## Quality Gate Summary"
            echo ""
            echo "| Check | Status | Required |"
            echo "|-------|--------|----------|"
            echo "| Lint | ${{ needs.lint.result }} | Yes |"
            echo "| Vet | ${{ needs.vet.result }} | Yes |"
            echo "| Build | ${{ needs.build.result }} | Yes |"
            echo "| Tests | ${{ needs.test-go.result }} | Yes |"
            echo "| AGENTS Docs | ${{ needs.agents-docs.result }} | Warning only |"
            echo "| gitleaks | ${{ needs.gitleaks-scan.result }} | Yes |"

            if [ "${{ needs.analyze-changes.outputs.go_changed }}" == "true" ]; then
              echo "| gosec | ${{ needs.gosec-scan.result }} | Yes |"
            else
              echo "| gosec | skipped | N/A |"
            fi

            if [ "${{ needs.analyze-changes.outputs.ml_changed }}" == "true" ]; then
              echo "| ML Determinism | ${{ needs.ml-determinism-check.result }} | Yes |"
            else
              echo "| ML Determinism | skipped | N/A |"
            fi

            if [ "${{ needs.analyze-changes.outputs.veid_changed }}" == "true" ]; then
              echo "| VEID E2E | ${{ needs.veid-e2e-check.result }} | Yes |"
              echo "| VEID Conformance | ${{ needs.veid-conformance-check.result }} | Yes |"
            else
              echo "| VEID E2E | skipped | N/A |"
              echo "| VEID Conformance | skipped | N/A |"
            fi

            if [ "${{ needs.analyze-changes.outputs.portal_changed }}" == "true" ]; then
              echo "| Portal Lint | ${{ needs.portal-lint.result }} | Yes |"
              echo "| Portal Test | ${{ needs.portal-test.result }} | Yes |"
              echo "| Portal Build | ${{ needs.portal-build.result }} | Yes |"
            else
              echo "| Portal Checks | skipped | N/A |"
            fi

            if [ "${{ needs.analyze-changes.outputs.economics_changed }}" == "true" ]; then
              echo "| Economics Sim | ${{ needs.economics-sim.result }} | Yes |"
            else
              echo "| Economics Sim | skipped | N/A |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
