---
name: compatibility

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - mainnet/main
    tags:
      - v*
  pull_request:
    paths:
      - "**/*.proto"
      - "api/**"
      - "pkg/compatibility/**"
      - "docs/COMPATIBILITY.md"
      - "**/types/*.go"
      - "**/keeper/*.go"
      - ".github/workflows/compatibility.yaml"

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GO_TEST_TIMEOUT_UNIT: "30m"
  BUF_VERSION: "v1.50.0"

jobs:
  proto-breaking:
    name: Proto Breaking Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }}
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Check proto breaking changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="HEAD~1"
          fi

          echo "Checking for breaking changes against ${base_ref}"
          buf breaking --against ".git#ref=${base_ref}"

  compatibility-tests:
    name: Compatibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Run compatibility tests
        run: make test-compatibility

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-test-results
          path: |
            test-results/
            coverage-compatibility.txt
          retention-days: 14

  api-version-check:
    name: API Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Check API version changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            diff_base="origin/${{ github.base_ref }}"
          else
            diff_base="${{ github.event.before || 'HEAD~1' }}"
          fi

          mapfile -t changed_files < <(git diff --name-only "${diff_base}" HEAD -- '*/types/*.go' '*/keeper/*.go' 'api/**' || true)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No API surface files changed"
            exit 0
          fi

          echo "Changed API files:"
          printf '%s\n' "${changed_files[@]}"

          removed_symbols="$(git diff "${diff_base}" HEAD -- "${changed_files[@]}" | grep -E '^-func ' || true)"
          if [ -n "${removed_symbols}" ]; then
            echo "::error::Potential API removals detected:"
            printf '%s\n' "${removed_symbols}"
            exit 1
          fi

          echo "No removed public functions detected in changed API files"

  deprecation-compliance:
    name: Deprecation Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Check deprecation annotations
        run: |
          deprecated_count=$(grep -R "Deprecated:" --include="*.go" --exclude-dir=vendor --exclude-dir=.bosun . | wc -l || echo "0")
          echo "Found ${deprecated_count} deprecated items outside vendor and worktree mirrors"

          missing_version=$(grep -R "Deprecated:" --include="*.go" --exclude-dir=vendor --exclude-dir=.bosun . | grep -v "v[0-9]" | head -5 || true)
          if [ -n "${missing_version}" ]; then
            echo "::warning::Some deprecated items may be missing explicit version information:"
            printf '%s\n' "${missing_version}"
          fi

  version-matrix-validation:
    name: Version Matrix Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Validate compatibility matrix
        run: |
          go test -v -timeout "${GO_TEST_TIMEOUT_UNIT}" \
            ./tests/compatibility/... -run TestCompatibilityMatrixLookup

          if [ ! -f "docs/COMPATIBILITY.md" ]; then
            echo "::error::docs/COMPATIBILITY.md not found"
            exit 1
          fi

          grep -q "## Repository API Surface" docs/COMPATIBILITY.md || {
            echo "::error::docs/COMPATIBILITY.md is missing the Repository API Surface section"
            exit 1
          }

          grep -q "## Compatibility Commitment" docs/COMPATIBILITY.md || {
            echo "::error::docs/COMPATIBILITY.md is missing the Compatibility Commitment section"
            exit 1
          }

  full-compatibility-suite:
    name: Full Compatibility Suite
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - proto-breaking
      - compatibility-tests
      - api-version-check
      - deprecation-compliance
      - version-matrix-validation
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Sync dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Run full compatibility suite
        run: |
          echo "Running full compatibility suite for ${GITHUB_REF_NAME}"
          make test-compatibility-full

      - name: Generate compatibility report
        run: |
          cat > compatibility-report.md <<EOF
          # Compatibility Report

          ## Release

          ${GITHUB_REF_NAME}

          ## Required Gates

          - Proto breaking: passed
          - Compatibility tests: passed
          - API version check: passed
          - Deprecation compliance: completed
          - Version matrix validation: passed
          - Full compatibility suite: passed
          EOF

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: compatibility-report.md
          retention-days: 30
