---
name: release

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing git tag to publish. Run this workflow from the same tag ref."
        required: true
        type: string
      environment:
        description: "Pre-publish environment gate"
        required: true
        default: "staging"
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release-context:
    name: Validate Release Context
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      environment: ${{ steps.validate.outputs.environment }}
    steps:
      - name: Ensure workflow ref matches release tag
        id: validate
        run: |
          release_tag="${{ inputs.release_tag }}"
          target_environment="${{ inputs.environment }}"

          if [[ ! "${release_tag}" =~ ^v ]]; then
            echo "::error::release_tag must begin with v"
            exit 1
          fi

          if [[ "${GITHUB_REF}" != "refs/tags/${release_tag}" ]]; then
            echo "::error::Dispatch this workflow from refs/tags/${release_tag}; current ref is ${GITHUB_REF}"
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "environment=${target_environment}" >> "${GITHUB_OUTPUT}"

  compatibility:
    name: Compatibility Gate
    needs: validate-release-context
    uses: ./.github/workflows/compatibility.yaml

  post-deploy-smoke:
    name: Post-Deploy Smoke Gate
    needs: validate-release-context
    uses: ./.github/workflows/smoke-test.yaml
    with:
      environment: ${{ needs.validate-release-context.outputs.environment }}
    secrets: inherit

  staging-e2e:
    name: Staging E2E Gate
    needs: validate-release-context
    uses: ./.github/workflows/staging-e2e.yaml
    with:
      environment: ${{ needs.validate-release-context.outputs.environment }}

  veid-e2e:
    name: VEID E2E Gate
    needs: validate-release-context
    uses: ./.github/workflows/veid-e2e.yaml

  ml-determinism:
    name: ML Determinism Gate
    needs: validate-release-context
    uses: ./.github/workflows/ml-determinism.yaml

  veid-conformance:
    name: VEID Conformance Gate
    needs: validate-release-context
    uses: ./.github/workflows/veid-conformance.yaml

  test-network-upgrade-on-release:
    name: Network Upgrade Gate
    runs-on:
      - self-hosted
      - gh-runner-test
    needs:
      - validate-release-context
      - compatibility
      - post-deploy-smoke
      - staging-e2e
      - veid-e2e
      - ml-determinism
      - veid-conformance
    steps:
      - name: Cleanup build folder
        run: |
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate-release-context.outputs.release_tag }}

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Detect release tag
        run: echo "RELEASE_TAG=${{ needs.validate-release-context.outputs.release_tag }}" >> "${GITHUB_ENV}"

      - name: Configure variables
        run: |
          test_required=$(./script/upgrades.sh test-required "${RELEASE_TAG}")
          echo "TEST_REQUIRED=${test_required}" >> "${GITHUB_ENV}"

      - name: Run upgrade test
        id: test
        if: env.TEST_REQUIRED != ''
        env:
          UPGRADE_BINARY_VERSION: ${{ env.RELEASE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_CONFIG: test-config-gha.json
        run: |
          cd tests/upgrade
          make test

      - name: Upload validator logs
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: release-upgrade-logs
          path: |
            .cache/run/upgrade/validators/logs/.virtengine*.log

  publish:
    name: Publish Release
    runs-on:
      - self-hosted
      - core-e2e
    needs:
      - validate-release-context
      - compatibility
      - post-deploy-smoke
      - staging-e2e
      - veid-e2e
      - ml-determinism
      - veid-conformance
      - test-network-upgrade-on-release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Cleanup build folder
        run: |
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate-release-context.outputs.release_tag }}

      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set release version into env variable
        run: echo "RELEASE_TAG=${{ needs.validate-release-context.outputs.release_tag }}" >> "${GITHUB_ENV}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make and publish
        run: |
          sudo rm -rf .cache/goreleaser
          make release
        env:
          GORELEASER_RELEASE: true
          GORELEASER_MOUNT_CONFIG: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-homebrew:
    name: Notify Homebrew
    runs-on: ubuntu-latest
    needs:
      - validate-release-context
      - publish
    steps:
      - name: Check homebrew token
        id: token_check
        run: |
          if [ -n "${GORELEASER_ACCESS_TOKEN}" ]; then
            echo "has_token=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_token=false" >> "${GITHUB_OUTPUT}"
          fi
        env:
          GORELEASER_ACCESS_TOKEN: ${{ secrets.GORELEASER_ACCESS_TOKEN }}

      - name: Checkout code
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.validate-release-context.outputs.release_tag }}

      - name: Release version
        if: steps.token_check.outputs.has_token == 'true'
        run: echo "RELEASE_TAG=${{ needs.validate-release-context.outputs.release_tag }}" >> "${GITHUB_ENV}"

      - name: Check if pre-release
        if: steps.token_check.outputs.has_token == 'true'
        id: check
        run: |
          is_prerelease=$(./script/is_prerelease.sh "${RELEASE_TAG}"; echo $?)
          is_mainnet=$(./script/mainnet-from-tag.sh "${RELEASE_TAG}"; echo $?)
          echo "is_prerelease=${is_prerelease}" >> "${GITHUB_OUTPUT}"
          echo "is_mainnet=${is_mainnet}" >> "${GITHUB_OUTPUT}"

      - name: Notify homebrew with a new release
        if: steps.token_check.outputs.has_token == 'true' && contains(steps.check.outputs.is_mainnet, '0') && contains(steps.check.outputs.is_prerelease, '1')
        uses: benc-uk/workflow-dispatch@v1
        with:
          token: ${{ secrets.GORELEASER_ACCESS_TOKEN }}
          repo: virtengine/homebrew-tap
          ref: refs/heads/main
          workflow: virtengine
          inputs: '{"tag": "${{ env.RELEASE_TAG }}"}'
