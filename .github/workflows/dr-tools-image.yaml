# VirtEngine DR tools image build/publish
#
# Closes the gap found in t_46de26f7: infra/kubernetes/dr/backup-cronjobs.yaml
# pins ghcr.io/virtengine/dr-tools by digest, but no Dockerfile existed and no
# workflow ever built or published it, so all three DR CronJobs were
# permanently ImagePullBackOff.
#
# Flow
#   1. build       — always builds _build/Dockerfile.dr-tools. On main/dispatch
#                    it also pushes to ghcr.io/virtengine/dr-tools with
#                    provenance + SBOM; on pull_request it loads the image into
#                    the runner's daemon instead (push and load are mutually
#                    exclusive).
#   2. assert-local — pull_request only. Runs scripts/ci/assert-dr-tools-image.sh
#                    against the freshly built image, so the CronJob runtime
#                    contract is enforced *before* merge, not just after.
#   3. verify      — publish runs only (digest non-empty). Pulls the image back
#                    by the digest that was just published and runs the same
#                    assertion script. This is the "successful pull proven"
#                    evidence for the pin. It is gated on the digest because on
#                    pull_request the push step never runs and the digest is
#                    empty — an unconditional pull would target the invalid
#                    reference "…dr-tools@".
#   4. pin         — re-pins infra/kubernetes/dr/backup-cronjobs.yaml to the real
#                    digest via an automated PR (never a direct commit to main).
#                    Idempotent: when the manifest already carries that digest
#                    the rewrite is a no-op and create-pull-request opens nothing.
#   5. verify-pin  — fail-closed drift check on the committed pin. While
#                    dr-tools has never been published it reports
#                    bootstrap-not-performed and passes; once the tag exists it
#                    enforces that the pinned digest resolves. Also reports
#                    anonymous pullability, because the CronJob pods mount no
#                    imagePullSecrets and so can only pull a public package.
#                    That probe is self-tested against a known-public control on
#                    every run: the success branch otherwise could not print
#                    before the package exists, so it could rot into a dead
#                    branch that misreports after merge.
#
# Loop safety
#   backup-cronjobs.yaml is watched by pull_request but deliberately NOT by
#   push. Pushing provenance/SBOM attestations makes every build produce a new
#   digest, so if merging the re-pin PR re-triggered a push-triggered build the
#   workflow would publish a fresh digest, open another re-pin PR, and repeat
#   forever. Merging the re-pin PR changes only the manifest, so with the
#   manifest off the push trigger that cycle cannot start. PRs that touch the
#   manifest still get full validation (build + assert-local + verify-pin).

name: DR Tools Image

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '_build/Dockerfile.dr-tools'
      - 'scripts/dr/**'
      - 'scripts/ci/assert-dr-tools-image.sh'
      - 'scripts/ci/probe-ghcr-pullability.sh'
      - 'cmd/virtengine/**'
      - 'go.mod'
      - 'go.sum'
      - 'sdk/go/**'
      - 'sdk/specs/**'
      - '.github/workflows/dr-tools-image.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '_build/Dockerfile.dr-tools'
      - 'scripts/dr/**'
      - 'scripts/ci/assert-dr-tools-image.sh'
      - 'scripts/ci/probe-ghcr-pullability.sh'
      - 'cmd/virtengine/**'
      - 'go.mod'
      - 'go.sum'
      - 'sdk/go/**'
      - 'sdk/specs/**'
      - 'infra/kubernetes/dr/backup-cronjobs.yaml'
      - '.github/workflows/dr-tools-image.yaml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the image and open the digest re-pin PR'
        required: true
        type: boolean
        default: true
  # Weekly drift check that needs no file change to fire: build from current
  # main (validation only — publish is false for any non-push/workflow_dispatch
  # event, so this can never mint a digest), then verify-pin.
  schedule:
    - cron: '0 5 * * 1'

env:
  # Matches every other VirtEngine workflow and the golang base image tag in
  # _build/Dockerfile.dr-tools; passed to the build as --build-arg GO_VERSION so
  # the toolchain cannot drift between this file and the Dockerfile.
  GO_VERSION: '1.26.8'
  IMAGE: ghcr.io/virtengine/dr-tools
  CRONJOB_MANIFEST: infra/kubernetes/dr/backup-cronjobs.yaml
  # Same pinned kubectl as infrastructure.yaml, which is what
  # scripts/task85c-validate-kubernetes.mjs runs `kubectl kustomize` with.
  KUBECTL_VERSION: '1.29.0'
  KUBECTL_SHA256: '0e03ab096163f61ab610b33f37f55709d3af8e16e4dcc1eb682882ef80f96fd5'

concurrency:
  group: dr-tools-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dr-tools
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ env.IMAGE }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine publish mode
        id: mode
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (validation only, loaded into the runner daemon)
        id: local
        if: steps.mode.outputs.publish != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: _build/Dockerfile.dr-tools
          # push and load are mutually exclusive; the image has to land in the
          # local daemon or there is nothing for the assertion step to inspect.
          push: false
          load: true
          tags: dr-tools:ci
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push
        id: push
        if: steps.mode.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: _build/Dockerfile.dr-tools
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull request path: the published digest cannot exist yet, so prove the
      # contract against the image that was just built from this tree. Same
      # assertion script as the post-publish verify job, so the two paths cannot
      # disagree about what "runnable" means.
      - name: Assert the CronJob runtime contract (local image)
        if: steps.mode.outputs.publish != 'true'
        env:
          IMG: dr-tools:ci
        run: bash scripts/ci/assert-dr-tools-image.sh "$IMG"

  verify:
    name: Prove pull and command paths
    runs-on: ubuntu-latest
    needs: [build]
    # Gated on a real digest: on pull_request the push step is skipped and
    # needs.build.outputs.digest is empty, so an ungated pull would target the
    # invalid reference "ghcr.io/virtengine/dr-tools@". The pull_request path is
    # covered by the build job's assert step instead.
    if: needs.build.outputs.digest != ''
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          # ${DIGEST:?...} turns an empty digest into a named error rather than
          # a confusing invalid-reference failure from docker.
          REF="${IMAGE}@${DIGEST:?verify ran without a published digest}"
          echo "pulling $REF"
          docker pull "$REF"

      - name: Assert the CronJob runtime contract (published digest)
        env:
          IMG: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: bash scripts/ci/assert-dr-tools-image.sh "$IMG"

  pin:
    name: Re-pin digest in the CronJob manifest
    runs-on: ubuntu-latest
    needs: [build, verify]
    if: needs.build.outputs.digest != ''
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Re-pin the digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - "$CRONJOB_MANIFEST" "$IMAGE" "$DIGEST" <<'PY'
          import re, sys
          path, image, digest = sys.argv[1], sys.argv[2], sys.argv[3]
          src = open(path, encoding="utf-8").read()
          pat = re.compile(r"(image:\s*)" + re.escape(image) + r"@sha256:[a-f0-9]{64}")
          new, n = pat.subn(r"\g<1>" + image + "@" + digest, src)
          if n == 0:
              sys.exit(f"no pinned reference to {image} found in {path}")
          open(path, "w", encoding="utf-8", newline="\n").write(new)
          print(f"re-pinned {n} reference(s) to {digest}")
          PY

      - name: Install pinned kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check --strict
          chmod +x kubectl
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Validate the manifest still satisfies policy
        run: node scripts/task85c-validate-kubernetes.mjs

      - name: Open re-pin PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(dr): re-pin dr-tools to published digest ${{ needs.build.outputs.digest }}"
          title: "fix(dr): re-pin dr-tools image to its published digest"
          body: |
            ## DR tools image digest re-pin

            The `dr-tools` image was built and published by the
            **DR Tools Image** workflow.

            - Image: `${{ needs.build.outputs.image }}`
            - Digest: `${{ needs.build.outputs.digest }}`
            - Verified: the image was pulled back by digest and every
              `command:` path in `infra/kubernetes/dr/backup-cronjobs.yaml`
              was confirmed present and executable inside it.

            This PR updates the pinned digest in
            `infra/kubernetes/dr/backup-cronjobs.yaml`. Merging it is what makes
            the DR CronJobs pullable.

            **Still required for the pods to actually start:** the GHCR package
            must be pullable from the cluster. `dr-backup-sa` carries no
            `imagePullSecrets`, so if `ghcr.io/virtengine/dr-tools` is private
            the CronJobs stay in ImagePullBackOff even with this digest merged —
            either make the package public or add a pull secret.

            ---
            *Automatically generated by the DR Tools Image workflow.*
          branch: dr-tools/repin-${{ github.sha }}
          base: main
          labels: |
            dr
            automated

  verify-pin:
    name: Verify the committed pin resolves
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the pinned digest resolves
        run: |
          set -euo pipefail
          PINNED="$(grep -oE 'ghcr\.io/virtengine/dr-tools@sha256:[a-f0-9]{64}' "$CRONJOB_MANIFEST" | head -n1)"
          test -n "$PINNED" || { echo "no dr-tools pin found"; exit 1; }

          if docker pull "$PINNED"; then
            echo "pinned digest resolves: $PINNED"
            exit 0
          fi

          # Not yet published. Distinguish "the repo does not exist at all"
          # (bootstrap pending) from "the repo exists but this digest is gone"
          # (a real, actionable drift that must fail). The :main tag is the
          # published signal — if the push tags in the build job are ever
          # changed, this check has to change with them.
          if docker manifest inspect "ghcr.io/virtengine/dr-tools:main" >/dev/null 2>&1; then
            echo "dr-tools is published but the pinned digest does not resolve:"
            echo "  $PINNED"
            echo "The pin has drifted. Merge the re-pin PR from the build job."
            exit 1
          fi

          echo "::warning::ghcr.io/virtengine/dr-tools has not been published yet."
          echo "The DR CronJobs cannot pull until the DR Tools Image workflow runs"
          echo "(push to main, or workflow_dispatch with publish=true) and its"
          echo "re-pin PR is merged. Tracked by t_46de26f7."

      # Cluster-side reachability, which the digest check above cannot see: the
      # CronJob pods authenticate with dr-backup-sa and mount no imagePullSecrets,
      # so they can only succeed if the package is anonymously pullable.
      #
      # The probe lives in a script rather than inline because it has to be
      # executable in a self-test mode: see the step below.
      - name: Report cluster-side pullability (anonymous)
        run: bash scripts/ci/probe-ghcr-pullability.sh

      # The "package is anonymously pullable" success branch only prints when the
      # package really is public, so on this repository it would never execute
      # before merge — leaving it free to rot into a dead branch that silently
      # misreports after merge, which is the exact vacuity class this workflow
      # has already been bitten by twice.
      #
      # Pointing the same probe at a KNOWN-public control as its subject forces
      # that branch to fire on every run, so a broken token exchange, a wrong
      # auth scheme or a dead success branch fails loudly here instead.
      - name: Self-test the pullability probe
        run: |
          set -euo pipefail
          out="$(bash scripts/ci/probe-ghcr-pullability.sh --self-test)"
          echo "$out"
          grep -q 'ANONYMOUS-PULL-OK' <<<"$out" \
            || { echo "::error::the probe never reached its 200 success branch"; exit 1; }
