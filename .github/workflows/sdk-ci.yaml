name: SDK CI

# The SDK used to have no CI at all: its workflows lived in the inert
# sdk/.github/workflows/ directory, and GitHub Actions only executes
# .github/workflows/ at the REPOSITORY ROOT. This workflow is the real
# gate for the SDK.
#
# SCOPE — deliberately partial, and each omission is deliberate:
#   sdk/go      linted + tested here (go test + golangci-lint).
#   sdk/ts      linted + tested + built here.
#   sdk/portal  is gated by portal-ci.yaml (job "SDK Portal"), not here.
#   sdk/python  and sdk/rust are NOT gated here: both fail for PRE-EXISTING
#   reasons a new gate cannot fix (python: the vendored google.protobuf
#   package shadows the real one, so pytest cannot collect; rust:
#   rust/src/proto/mod.rs:123 contains `pub mod mod {`, a syntax error on
#   every platform). Wiring them in red would fail every SDK PR while
#   telling nobody why. Tracked in sdk/README.md.

on:
  push:
    branches: [main, mainnet/main]
    paths:
      - "sdk/go/**"
      - "sdk/specs/**"
      - "sdk/ts/**"
      - "sdk/README.md"
      - ".github/workflows/sdk-ci.yaml"
  pull_request:
    paths:
      - "sdk/go/**"
      - "sdk/specs/**"
      - "sdk/ts/**"
      - "sdk/README.md"
      - ".github/workflows/sdk-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .github/workflows/portal-ci.yaml. sdk/ts declares
  # "engines": { "node": ">=22.14.0" } (sdk/ts/package.json).
  NODE_VERSION: "22"

jobs:
  go:
    name: Go SDK (lint and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk/go
    env:
      # sdk/go is its own module and must be proven in isolation, so the root
      # go.work (which also pulls in sdk/specs and infra/*) is switched off.
      # Without it the package set under test is the workspace's, not this
      # module's.
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Required by the --new-from-rev step below. actions/checkout defaults to
      # fetch-depth 1, which fetches only the PR merge commit; origin/<base>
      # is then an unknown revision and golangci-lint aborts on every run.
      # This mirrors .github/workflows/quality-gate.yaml (the lint job).
      - name: Fetch base ref for lint diff
        run: git fetch origin "${{ github.base_ref || 'develop' }}" --depth=1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache: true
          cache-dependency-path: sdk/go/go.sum

      - name: Run Go tests
        run: go test ./...

      - name: Run golangci-lint (new findings only)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: sdk/go
          # Diff-scoped, matching .github/workflows/quality-gate.yaml. sdk/go
          # carries ~60 inherited findings (50 goconst, mostly in _test.go)
          # that predate this workflow; an unscoped run would be red on its
          # first execution and stay red, which is how gates get ignored.
          # Un-comment locally to reproduce the full backlog:
          #   cd sdk/go && GOWORK=off golangci-lint run --timeout=10m ./...
          args: --timeout=10m --new-from-rev=origin/${{ github.base_ref || 'develop' }}

  typescript:
    name: TypeScript SDK (lint, tests, and build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache: true
          cache-dependency-path: sdk/go/go.sum

      # The Jest harness stages its buf modules out of `sdk/go/vendor/`:
      #   go/vendor/github.com/cosmos/gogoproto          (test/helpers/proto.ts)
      #   go/vendor/github.com/cosmos/cosmos-sdk/proto   (test/functional/protoc-gen-sdk-object.spec.ts)
      # Nothing else in this job builds that tree, so without this step the
      # functional specs die with ENOENT and fail 75 tests across 9 suites.
      #
      # `go mod vendor` creates the first path but NOT the second: vendor/ only
      # carries Go packages, and cosmos-sdk's proto/ tree is .proto files. The
      # sdk/go replace directive redirects github.com/cosmos/cosmos-sdk to
      # github.com/virtengine/cosmos-sdk, so the source has to be copied from the
      # resolved module directory rather than hard-coded to a version.
      - name: Stage sdk/go vendor tree for the Jest buf harness
        working-directory: sdk/go
        env:
          GOWORK: "off"
        run: |
          go mod vendor
          SDK_DIR="$(go list -m -f '{{.Dir}}' github.com/cosmos/cosmos-sdk)"
          mkdir -p vendor/github.com/cosmos/cosmos-sdk
          cp -r "${SDK_DIR}/proto" vendor/github.com/cosmos/cosmos-sdk/proto

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
