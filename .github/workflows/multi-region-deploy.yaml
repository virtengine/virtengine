name: Multi-Region Deploy

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region to target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - us-east-1
          - eu-west-1
          - ap-southeast-1
      action:
        description: "Deployment action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - deploy
          - drift

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.6.6'
  AWS_REGION: us-east-1

concurrency:
  group: multi-region-${{ github.ref }}-${{ github.event.inputs.region }}
  cancel-in-progress: false

jobs:
  staging-e2e-gate:
    name: Staging E2E Gate
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy'
    steps:
      - name: Verify staging E2E status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/staging-e2e.yaml/runs?per_page=20")

          conclusion=$(echo "$response" | jq -r --arg sha "$GITHUB_SHA" \
            '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' | head -1)

          if [ "$conclusion" != "success" ]; then
            echo "::error::Staging E2E workflow has not succeeded for ${GITHUB_SHA}."
            exit 1
          fi

          echo "Staging E2E gate passed."

  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify environment parity
        run: |
          chmod +x infra/scripts/check-environment-parity.sh
          infra/scripts/check-environment-parity.sh

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform/

      - name: Validate modules
        shell: bash
        run: |
          set -euo pipefail
          for module in infra/terraform/modules/*/; do
            echo "=== Validating ${module} ==="
            cd "$module"
            terraform init -backend=false -input=false
            terraform validate
            cd - >/dev/null
          done

  plan-primary:
    name: "Plan: us-east-1"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.region == 'all' || github.event.inputs.region == 'us-east-1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: multi-region-plan-primary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Generate reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh plan "infra/terraform/regions/us-east-1" "$RUNNER_TEMP/plan-us-east-1"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: plan-us-east-1
          path: ${{ runner.temp }}/plan-us-east-1
          retention-days: 7

  plan-secondary:
    name: "Plan: eu-west-1"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.region == 'all' || github.event.inputs.region == 'eu-west-1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: multi-region-plan-secondary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Generate reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh plan "infra/terraform/regions/eu-west-1" "$RUNNER_TEMP/plan-eu-west-1"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: plan-eu-west-1
          path: ${{ runner.temp }}/plan-eu-west-1
          retention-days: 7

  plan-tertiary:
    name: "Plan: ap-southeast-1"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.region == 'all' || github.event.inputs.region == 'ap-southeast-1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: multi-region-plan-tertiary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Generate reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh plan "infra/terraform/regions/ap-southeast-1" "$RUNNER_TEMP/plan-ap-southeast-1"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: plan-ap-southeast-1
          path: ${{ runner.temp }}/plan-ap-southeast-1
          retention-days: 7

  plan-global:
    name: "Plan: global"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.region == 'all' && (github.event.inputs.action == 'plan' || github.event.inputs.action == 'deploy')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: multi-region-plan-global-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Generate reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh plan "infra/terraform/global" "$RUNNER_TEMP/plan-global"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: plan-global
          path: ${{ runner.temp }}/plan-global
          retention-days: 7

  drift-primary:
    name: "Drift: us-east-1"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'drift' && (github.event.inputs.region == 'all' || github.event.inputs.region == 'us-east-1')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: multi-region-drift-primary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Detect drift
        shell: bash
        run: |
          chmod +x infra/scripts/terraform-run.sh
          set +e
          infra/scripts/terraform-run.sh drift "infra/terraform/regions/us-east-1" "$RUNNER_TEMP/drift-us-east-1"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::Drift detected in us-east-1."
            exit 1
          fi
          exit "$rc"

  drift-secondary:
    name: "Drift: eu-west-1"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'drift' && (github.event.inputs.region == 'all' || github.event.inputs.region == 'eu-west-1')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: multi-region-drift-secondary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Detect drift
        shell: bash
        run: |
          chmod +x infra/scripts/terraform-run.sh
          set +e
          infra/scripts/terraform-run.sh drift "infra/terraform/regions/eu-west-1" "$RUNNER_TEMP/drift-eu-west-1"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::Drift detected in eu-west-1."
            exit 1
          fi
          exit "$rc"

  drift-tertiary:
    name: "Drift: ap-southeast-1"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'drift' && (github.event.inputs.region == 'all' || github.event.inputs.region == 'ap-southeast-1')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: multi-region-drift-tertiary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Detect drift
        shell: bash
        run: |
          chmod +x infra/scripts/terraform-run.sh
          set +e
          infra/scripts/terraform-run.sh drift "infra/terraform/regions/ap-southeast-1" "$RUNNER_TEMP/drift-ap-southeast-1"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::Drift detected in ap-southeast-1."
            exit 1
          fi
          exit "$rc"

  deploy-primary:
    name: "Deploy: us-east-1"
    needs: [staging-e2e-gate, plan-primary]
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy' && (github.event.inputs.region == 'all' || github.event.inputs.region == 'us-east-1')
    environment: production-us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: multi-region-deploy-primary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: plan-us-east-1
          path: ${{ runner.temp }}/plan-us-east-1

      - name: Apply reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh apply "infra/terraform/regions/us-east-1" "$RUNNER_TEMP/plan-us-east-1"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh us-east-1

  deploy-secondary-single:
    name: "Deploy: eu-west-1"
    needs: [staging-e2e-gate, plan-secondary]
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy' && github.event.inputs.region == 'eu-west-1'
    environment: production-eu-west-1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: multi-region-deploy-secondary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: plan-eu-west-1
          path: ${{ runner.temp }}/plan-eu-west-1

      - name: Apply reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh apply "infra/terraform/regions/eu-west-1" "$RUNNER_TEMP/plan-eu-west-1"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh eu-west-1

  deploy-secondary-all:
    name: "Deploy: eu-west-1 after primary"
    needs: [plan-secondary, deploy-primary]
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy' && github.event.inputs.region == 'all'
    environment: production-eu-west-1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: multi-region-deploy-secondary-all-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: plan-eu-west-1
          path: ${{ runner.temp }}/plan-eu-west-1

      - name: Apply reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh apply "infra/terraform/regions/eu-west-1" "$RUNNER_TEMP/plan-eu-west-1"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh eu-west-1

  deploy-tertiary-single:
    name: "Deploy: ap-southeast-1"
    needs: [staging-e2e-gate, plan-tertiary]
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy' && github.event.inputs.region == 'ap-southeast-1'
    environment: production-ap-southeast-1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: multi-region-deploy-tertiary-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: plan-ap-southeast-1
          path: ${{ runner.temp }}/plan-ap-southeast-1

      - name: Apply reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh apply "infra/terraform/regions/ap-southeast-1" "$RUNNER_TEMP/plan-ap-southeast-1"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh ap-southeast-1

  deploy-tertiary-all:
    name: "Deploy: ap-southeast-1 after primary"
    needs: [plan-tertiary, deploy-primary]
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy' && github.event.inputs.region == 'all'
    environment: production-ap-southeast-1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: multi-region-deploy-tertiary-all-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: plan-ap-southeast-1
          path: ${{ runner.temp }}/plan-ap-southeast-1

      - name: Apply reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh apply "infra/terraform/regions/ap-southeast-1" "$RUNNER_TEMP/plan-ap-southeast-1"

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh ap-southeast-1

  deploy-global:
    name: "Deploy: Global resources"
    needs: [plan-global, deploy-primary, deploy-secondary-all, deploy-tertiary-all]
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy' && github.event.inputs.region == 'all'
    environment: production-global
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MULTI_REGION_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: multi-region-deploy-global-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_MULTI_REGION_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: plan-global
          path: ${{ runner.temp }}/plan-global

      - name: Apply reviewed plan
        run: |
          chmod +x infra/scripts/terraform-run.sh
          infra/scripts/terraform-run.sh apply "infra/terraform/global" "$RUNNER_TEMP/plan-global"

      - name: Cross-region verification
        run: |
          chmod +x scripts/verify-cross-region.sh
          scripts/verify-cross-region.sh

      - name: Database replication verification
        run: |
          chmod +x scripts/verify-db-replication.sh
          scripts/verify-db-replication.sh

      - name: Update global load balancer
        run: |
          chmod +x scripts/update-global-lb.sh
          scripts/update-global-lb.sh

      - name: Final smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          for region in us-east-1 eu-west-1 ap-southeast-1; do
            echo "=== Smoke testing ${region} ==="
            scripts/smoke-test.sh "${region}"
          done
