# TEMPORARY FALSIFICATION WORKFLOW - DELETE AFTER THE PROOF RUN.
#
# Purpose: produce the controlled single-shard failure evidence that
# t_53ec10dd's DONE WHEN requires and that PR #1053's mocked test does not
# supply. It runs the REAL security-summary aggregator (the same
# .github/scripts/check_security_gate_results.sh the Security workflow uses)
# against a matrix that is deliberately one-shard-red, so the proof exercises
# the shipped code path rather than a stand-in.
#
# It asserts the fail-closed property in both directions:
#   * one shard red    -> summary exits 1 (a partial scan is not a pass)
#   * all shards green -> summary exits 0 (the fix did not over-correct)
# and it re-runs the shard partition test so a shard definition cannot drift
# while the proof is being taken.
name: govulncheck-falsify-one-shard

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: govulncheck-falsify-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # One shard is forced red by pointing it at a package pattern that cannot
  # load. `verdict=error` is the classification the shard step emits for a
  # scanner that never loaded a package -- the exact condition the gate exists
  # to catch. The other four entries are the REAL partition from develop.
  shard-sim:
    name: "Shard (simulated ${{ matrix.shard }}${{ matrix.break }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            patterns: ". ./x/... ./app/... ./client/... ./pubsub/..."
            break: ""
          - shard: platform
            patterns: "./pkg/..."
            break: ""
          - shard: tooling
            patterns: "./cmd/... ./scripts/... ./tools/... ./docgen/..."
            break: ""
          - shard: tests-and-sim
            patterns: "./tests/... ./testutil/... ./sim/... ./upgrades/... ./sdk/... ./util/..."
            break: ""
          - shard: unavailable-shard-probe
            patterns: "./this-directory-does-not-exist/..."
            break: " (BROKEN ON PURPOSE)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      # REQUIRED for the real shards to reach a verdict. Without libudev the
      # zondax/troian hid cgo chain cannot compile, package loading fails, and
      # the report is config-only -- which govulncheck_verdict.sh correctly
      # classifies as verdict=error. Measured on the first proof run: with this
      # step omitted EVERY shard (including the real ones) returned verdict=error,
      # so the one-red-shard control was not actually distinguishable. That is
      # the gate failing closed correctly, and it is the same missing-package
      # class of defect t_2792115d fixed in ci.yaml.
      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Classify the simulated shard with the REAL verdict script
        id: verdict
        run: |
          set +e
          govulncheck -format json ${{ matrix.patterns }} > govulncheck-report.json
          json_status=$?
          set -e
          out="$(bash .github/scripts/govulncheck_verdict.sh govulncheck-report.json "$json_status" - 2>&1)"
          echo "$out"
          verdict="$(printf '%s\n' "$out" | sed -n 's/^verdict=//p')"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: "Enforce the shard contract (error MUST fail the shard)"
        run: |
          echo "shard=${{ matrix.shard }} verdict=${{ steps.verdict.outputs.verdict }}"
          if [ "${{ steps.verdict.outputs.verdict }}" = "error" ]; then
            echo "::error::govulncheck could not complete on shard ${{ matrix.shard }} - scanner error, not a vulnerability finding"
            exit 1
          fi

      - name: "Report the verdict (always, so the proof can count shards)"
        if: always()
        run: echo "verdict=${{ steps.verdict.outputs.verdict }}" >> "$GITHUB_OUTPUT"

  # Roll the per-shard verdicts up so the summary job can assert that EXACTLY
  # one shard was red, instead of inferring it from the collapsed matrix result.
  verdicts:
    name: "Collect shard verdicts"
    runs-on: ubuntu-latest
    needs:
      - shard-sim
    if: always()
    outputs:
      verdicts: ${{ steps.collect.outputs.verdicts }}
    steps:
      - name: Collect every shard's verdict
        id: collect
        env:
          SHARD_VERDICTS: ${{ toJSON(needs.shard-sim.outputs) }}
        run: |
          echo "raw matrix outputs: $SHARD_VERDICTS"
          verdicts="$(printf '%s' "$SHARD_VERDICTS" \
            | tr ',' '\n' \
            | sed -n 's/.*"verdict"[[:space:]]*:[[:space:]]*"\([a-z]*\)".*/\1/p' \
            | tr '\n' ' ')"
          echo "verdicts: $verdicts"
          echo "verdicts=$verdicts" >> "$GITHUB_OUTPUT"

  # The REAL aggregator, verbatim from the Security workflow's summary job.
  summary-sim:
    name: "Security Summary (fail-closed proof)"
    runs-on: ubuntu-latest
    needs:
      - shard-sim
      - verdicts
    if: always()
    steps:
      - name: "Checkout gate-result helper"
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: "One red shard MUST make the summary red"
        run: |
          echo "shard-sim matrix result: ${{ needs.shard-sim.result }}"
          # shard-sim is a matrix, so GitHub collapses it to one aggregate
          # result here: 'failure' when the broken probe shard failed.
          if [ "${{ needs.shard-sim.result }}" != "failure" ]; then
            echo "::error::PRECONDITION FAILED: the deliberately-broken shard did not fail (got '${{ needs.shard-sim.result }}'). The proof is invalid - a broken shard is passing, which is a false negative."
            exit 1
          fi
          set +e
          bash .github/scripts/check_security_gate_results.sh \
            success success failure success success success success success success
          agg_status=$?
          set -e
          echo "aggregator exit=$agg_status (expect 1)"
          if [ "$agg_status" -ne 1 ]; then
            echo "::error::FAIL-OPEN DEFECT: the aggregator returned $agg_status for a failed shard; a partial scan reported clean"
            exit 1
          fi
          echo "PASS: one red shard makes Security Summary red. A partial scan is never a pass."

      - name: "Control - all-green must NOT be over-corrected into red"
        run: |
          bash .github/scripts/check_security_gate_results.sh \
            success success success success success success success success success
          echo "PASS: an all-green run still summarises green (the gate is not stuck red)."

      - name: "Negative control - a truncated needs list is an error"
        run: |
          set +e
          bash .github/scripts/check_security_gate_results.sh success success success
          short=$?
          set -e
          echo "short-list exit=$short (expect 1)"
          if [ "$short" -ne 1 ]; then
            echo "::error::a truncated needs list was accepted"
            exit 1
          fi
          echo "PASS: a truncated result list fails closed."

      - name: "Proof validity - exactly the four real shards are green"
        run: |
          # First proof run (37000010379) failed this step legitimately: without
          # libudev every shard returned verdict=error, so "one red" was not
          # distinguishable from "all red". This asserts the distinction on
          # recorded per-shard verdicts rather than on the collapsed matrix
          # result, so the proof cannot pass for the wrong reason.
          green=0
          red=0
          for v in ${{ needs.verdicts.outputs.verdicts }}; do
            echo "  shard verdict: $v"
            case "$v" in
              clean|vulns) green=$((green + 1)) ;;
              error|broken) red=$((red + 1)) ;;
            esac
          done
          echo "shards with a real verdict: $green (expect 4), shards red: $red (expect 1)"
          if [ "$red" -ne 1 ]; then
            echo "::error::expected EXACTLY one red shard, got $red. The proof is invalid: the single failure is not attributable to the deliberately-broken pattern."
            exit 1
          fi
          if [ "$green" -ne 4 ]; then
            echo "::error::expected the 4 real shards to reach a verdict, got $green. Package loading is broken for them too, so this run proves nothing about a one-shard failure."
            exit 1
          fi
          echo "PASS: 4 real shards reached a verdict and exactly 1 shard was red."

  # The shard partition test needs the full tree and a Go toolchain (it runs
  # `go list ./...`), so it cannot live in the sparse-checkout summary job.
  # Measured on proof run 37002118880: as a step in that job it died with exit
  # 127 "No such file or directory" because .github/tests was not checked out.
  # Keeping it here also means it re-proves the partition on the SAME sha as
  # the proof, so a shard definition cannot have drifted between the two.
  partition-guard:
    name: "Shard partition still exact on this sha"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Prove the shards still partition ./... exactly
        run: bash .github/tests/test_govulncheck_shard_partition.sh

      - name: Re-run the verdict regression suite
        run: bash .github/tests/test_govulncheck_verdict.sh
