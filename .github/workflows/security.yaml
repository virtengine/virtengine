name: Security

on:
  push:
    branches:
      - main
      - mainnet/main
      - develop
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  # The concurrency key MUST include the commit sha. Keyed on workflow+ref alone, every
  # push to the same branch lands in the same group and cancels the in-flight run — and
  # because Security is the slowest workflow in the repo (the Go vuln scan alone runs for
  # many minutes) it was cancelled by the *next* push essentially every time on `develop`.
  # That is why the Security workflow could never reach a verdict, why `Security Summary`
  # cascaded to `One or more required security gates failed`, and why re-running the job
  # never helped. Keying on the sha makes each commit's run independent, so a run can
  # finish; superseded runs of the same commit (a re-run race) still cancel.
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.8"
  GOVULNCHECK_VERSION: "v1.1.4"
  GOSEC_VERSION: "v2.25.0"
  GITLEAKS_VERSION: "v8.30.1"
  TRIVY_VERSION: "v0.69.3"
  SYFT_VERSION: "v1.42.4"
  PNPM_VERSION: "10.28.2"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"
  GOWORK: "off"

permissions:
  contents: read

jobs:
  policy-validation:
    name: Policy Validation
    runs-on: ubuntu-latest
    # This job reads the per-shard verdict ledgers uploaded by the go-vuln-scan
    # shards (see "Verify every declared govulncheck shard reported a verdict"),
    # so it must run AFTER that matrix finishes. Measured on run 37290409373
    # (PR #1265): with no `needs`, policy-validation completed at 09:30:10 while
    # the shards were still running and completed at 09:31:27 - the ledgers did
    # not exist yet, so the check could only ever fail. A parallel job cannot
    # consume a sibling's output; `needs` is what makes the input exist.
    #
    # `go-vuln-scan` already sets `fail-fast: false`, so one shard failing does
    # not cancel the others: every shard that CAN reach a verdict still writes
    # its ledger, and the gate below names exactly which shard produced none.
    needs: go-vuln-scan
    # `always()` so the ledger gate still runs when the matrix is red or was
    # cancelled - which is precisely when it has something to report. Without
    # it, a cancelled shard would skip this job entirely and the run would say
    # only "Policy Validation: skipped", losing the name of the shard that
    # produced no verdict. Mirrors security-summary, which is also `always()`.
    if: always()
    # `actions: read` is required for the run-artifact download and is scoped to
    # THIS job only; every other job keeps the workflow-wide `contents: read`
    # and gains nothing. Widening the workflow-wide block would hand all 16 jobs
    # a broader token to fix one job's input.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Validate security policy files
        run: |
          python .github/scripts/validate_security_policies.py --files \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml \
            .github/workflows \
            .gitleaks.toml \
            .vulnerability-allowlist.yaml \
            SUPPLY_CHAIN_SECURITY.md

      - name: Run policy validator tests
        run: python -m unittest discover -s .github/tests -p "test_security_policy*.py"

      - name: Run govulncheck verdict regression tests
        run: bash .github/tests/test_govulncheck_verdict.sh

      - name: Run govulncheck JSON invocation guard
        # The guard script shipped on develop but NOTHING invoked it, so it could
        # never fail. It pins the sharded gate's invocation: govulncheck refuses
        # -show with -format json, prints "the -show flag is not supported for
        # json output" and writes NOTHING, so govulncheck-report.json is empty
        # and every shard classifies as verdict=error -- which is exactly how all
        # four shards went red after the gate was sharded. A workflow comment
        # records that reason; a comment is not a guard, this is.
        run: bash .github/tests/test_govulncheck_json_invocation.sh

      - name: Run allowlist filter regression tests
        # Pins the two defects in .github/scripts/filter_allowlist.py: it must
        # name every advisory it suppressed on a fully-allowlisted run (so a
        # green gate shows WHAT the allowlist hid), and it must exit 4 - never
        # 0 - when the govulncheck report does not parse to the end, so a scan
        # killed mid-write can never be reported clean.
        run: python -m unittest discover -s .github/tests -p "test_filter_allowlist*.py"

      - name: Run govulncheck verdict ledger tests
        # A shard cancelled mid-scan produces NO verdict, and a matrix-level
        # result cannot say WHICH shard lost it. These pin that a verdict-less
        # shard is classified as neither clean nor a finding, and that the gate
        # fails closed on an unreadable or empty ledger.
        run: |
          python -m unittest discover -s .github/tests \
            -p "test_govulncheck_verdict_ledger*.py"

      - name: Run shard verdict transport tests
        run: |
          python -m unittest discover -s .github/tests \
            -p "test_shard_verdict_transport*.py"

      - name: Falsify the shard verdict transport
        # The transport tests above assert what the workflow DOES. This asserts
        # those assertions can fail: it mutates security.yaml back to each of the
        # two transports that failed in production (matrix job outputs, and
        # `gh run download`), plus the two ways the new one could be silently
        # broken (an empty collection that is only a warning, and one shared
        # artifact name), and requires the suite to go RED for each.
        #
        # It is a MUTATION harness, so it edits the real workflow and restores
        # it byte-for-byte; the run asserts that restoration at the end. It must
        # never run on a tree with uncommitted workflow changes.
        run: |
          if ! git diff --quiet -- .github/workflows/security.yaml; then
            echo "::error::workflow has uncommitted changes - refusing to mutate it"
            exit 1
          fi
          python .github/tests/falsify_shard_verdict_transport.py

      - name: Download shard verdict artifacts
        # `pattern` + `merge-multiple` collects every `govulncheck-verdict-*`
        # artifact from THIS run in one action call. It reads the current run's
        # artifacts through the Actions runtime, so it needs no extra token scope
        # and cannot be defeated by the API permissions that broke `gh run
        # download` on run 37292268699.
        #
        # `if-no-files-found: error` is NOT available here - it is an
        # upload-artifact input, and download-artifact does not define it (CI
        # rejected exactly this on run 37303621734). An empty collection is
        # rejected by the gate step below instead, which requires one verdict per
        # DECLARED shard.
        #
        # Pinned to v7 (node24). v6 declared `using: node20`, which the Action
        # Node Runtime Audit rejects, and node20 is end-of-life. v7 keeps the
        # `pattern` + `merge-multiple` inputs this step relies on and is the pin
        # the rest of the tree already uses.
        if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: govulncheck-verdict-*
          path: ${{ runner.temp }}/verdicts
          merge-multiple: true

      - name: Verify every declared govulncheck shard reported a verdict
        # The summary job already fails on a non-success matrix result, so this
        # is NOT a second copy of that check: the matrix aggregate is a single
        # GitHub verdict for N shards and cannot distinguish "all shards clean"
        # from "one shard died before it judged anything". Measured on run
        # 37174317397 / job 111353646594: steps were success x5, cancelled,
        # skipped x2, success - the shard emitted no govulncheck output at all.
        #
        # Each shard writes `<shard>.verdict` before it can exit and publishes it
        # as its own artifact. A shard killed mid-scan runs no further step, so
        # it publishes nothing - which is the signal this gate keys on. The gate
        # fails closed: a missing verdict is an UNKNOWN shard and is never
        # counted as clean.
        #
        # Two earlier transports were measured and abandoned rather than retried:
        #   * `gh run download` here - all four downloads timed out at ~60s each
        #     while every shard had SUCCEEDED (run 37292268699), and the step
        #     discarded gh's stderr so a cancelled shard and a download failure
        #     produced the SAME log line.
        #   * matrix job outputs - ONE WRITER WINS and the rest vanish: the
        #     consumer saw `{tests-and-sim:clean}` on 37295691699 and
        #     `{"tooling":"clean"}` on 37298338441, the latter with all four
        #     shards green at every step. No expression-level fix exists for
        #     overwrite.
        #
        # `actions/download-artifact` has NO `if-no-files-found` input (that
        # belongs to upload-artifact), so an empty collection cannot be rejected
        # by the action itself. It is rejected here instead: the ledger requires
        # one verdict per DECLARED shard, so zero collected artifacts means every
        # shard is UNKNOWN and the step fails - the same fail-closed outcome, via
        # a mechanism the action actually supports.
        run: |
          set -uo pipefail
          # The DECLARED shard list comes from the workflow matrix itself (the
          # same reader the partition guard uses), so a shard added there is
          # required to report here without editing this step.
          python .github/scripts/govulncheck_shards.py --list > /tmp/govulncheck-shards.txt
          shard_count="$(wc -l < /tmp/govulncheck-shards.txt | tr -d ' ')"
          echo "declared shards: $shard_count"
          merged="$RUNNER_TEMP/merged-ledger"
          mkdir -p "$merged"
          awk '{print $1}' /tmp/govulncheck-shards.txt > "$merged/shards.manifest"
          echo "== declared shards =="
          cat "$merged/shards.manifest"
          echo "== downloaded verdict artifacts =="
          ls -1 "$RUNNER_TEMP/verdicts"
          # Copy only the verdict files; anything else in the directory is
          # ignored so the gate reads exactly the shards it asked for.
          find "$RUNNER_TEMP/verdicts" -name '*.verdict' -exec cp {} "$merged/" \;
          python .github/scripts/govulncheck_verdict_ledger.py "$merged" \
            --expect "$shard_count"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify the govulncheck shard partition is exact
        # The sharded gate is findings-equivalent to one unsharded scan ONLY when
        # the shards are disjoint AND their union is exactly ./... . A package in
        # no shard is a silent false negative; this asserts the partition against
        # the real `go list ./...` output on every run, so adding a top-level
        # directory without adding it to a shard fails here instead of quietly
        # going unscanned.
        run: bash .github/tests/test_govulncheck_shard_partition.sh

      - name: Test the security summary fails closed
        run: bash .github/tests/test_security_gate_summary.sh

      - name: Lint targeted workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml

      - name: Verify container base images are digest-pinned
        run: |
          chmod +x scripts/supply-chain/verify-pinned-images.sh
          scripts/supply-chain/verify-pinned-images.sh --self-test
          scripts/supply-chain/verify-pinned-images.sh

      - name: Verify no orphaned npm lockfile can report phantom advisories
        # Dependabot resolves advisories against every tracked manifest, including
        # lockfiles nothing installs. portal/ is a pnpm workspace member that
        # installs only via `pnpm install --frozen-lockfile`, so its committed
        # package-lock.json was a pre-pnpm fossil: it pinned next@15.5.10 while
        # package.json and pnpm-lock.yaml both said 15.5.24, which held two
        # CRITICAL unauthenticated-RCE advisories permanently "open" against a
        # runtime that was never vulnerable. A phantom advisory is worse than no
        # advisory — it cannot be closed and it teaches reviewers to ignore the
        # tool. This ADDS a check; it does not relax any existing one.
        run: |
          node scripts/supply-chain/check-orphan-lockfiles.mjs --selftest
          node scripts/supply-chain/check-orphan-lockfiles.mjs

      - name: Verify every gated dependency install reaches its own tree
        # A declared gate is only evidence if the command it pins actually
        # installs and runs the tree it names. Two defects made the Task 88B
        # gate matrix lie, both exiting 0 while measuring nothing:
        #
        # 1. WRONG SCOPE. `pnpm --dir <dir> install` does NOT scope to <dir>:
        #    pnpm walks up, finds the repo-root pnpm-workspace.yaml, and installs
        #    THAT workspace. For mobile/veid-capture-app (not a member) it
        #    reported "Scope: all 4 workspace projects", created no
        #    mobile/veid-capture-app/node_modules, read neither of mobile's two
        #    lockfiles, and the typecheck/test that followed failed on
        #    "'tsc' is not recognized" — a green category that was a false
        #    signal rather than a measurement.
        # 2. WRONG PACKAGE MANAGER. sdk/ts has NO pnpm-lock.yaml; its
        #    committed authority is sdk/ts/package-lock.json, which every
        #    workflow that builds sdk/ts consumes with `npm --prefix`. So the
        #    pinned `pnpm --dir sdk/ts install --frozen-lockfile` could not run
        #    at all (ERR_PNPM_NO_LOCKFILE) even when correctly scoped.
        #
        # The matrix now pins the installer each directory actually owns, and
        # this asserts, per gated command: install scope is reachable, the
        # lockfile that installer will read exists, and any script it runs is
        # declared. ADDITIONAL check; relaxes nothing.
        run: node scripts/validate-required-gate-install-scope.test.cjs

  codeql-analysis:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: +security-extended,security-and-quality
          config: |
            paths-ignore:
              - vendor
              - "**/*.pb.go"
              - "**/mocks/**"
              - testutil

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Build for CodeQL
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  go-vuln-scan:
    name: Go Vulnerability Scan (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # This job runs govulncheck at the DEFAULT -scan=symbol level, which builds a
    # whole-program call graph. That is the signal this gate exists to provide, so
    # it is not negotiable — but over 3442 Go files it OOMs a free 7 GB hosted
    # runner and the runner evicts the job at ~7 minutes with ZERO output on
    # 27/27 runs. (CodeQL in the same run survived 18m33s on the same image, so
    # this is memory pressure, not a runner lifetime cap; timeout-minutes is 15
    # and was never reached.)
    #
    # The fix is to SHARD, not to weaken the scan. Each shard scans a disjoint set
    # of top-level package roots at the SAME default -scan=symbol level, so the
    # union of the shards' findings is findings-equivalent to one unsharded scan,
    # while peak RAM per runner stays bounded (no whole-program call graph).
    #
    # Coverage-preserving constraints, both enforced below — do NOT relax them:
    #   1. Shards are disjoint and their patterns UNION TO ./... . Adding a
    #      top-level directory means adding it to exactly one shard.
    #   2. A shard that fails to load/type-check is a FAILURE, never a pass. A
    #      broken shard reports no findings, which would otherwise be a silent
    #      false negative; .github/scripts/govulncheck_verdict.sh classifies a
    #      config-only report as `verdict=error`, and the shard fails on that.
    # The summary job then fails if ANY shard is red or produced findings.
    #
    # Alternatives REJECTED with reasons (do not "simplify" back to these):
    #   * CGO_ENABLED=0 — silently drops files gated behind cgo build constraints
    #     from compilation, so they stop being scanned. A cleaner-looking run that
    #     is actually a narrower one, with no warning. Not acceptable on a gate.
    #   * -scan=package — sound, but reports unreachable code and discards the
    #     reachability signal entirely.
    #   * scanning only ./ (root package) — misses every subpackage: false negatives.
    #   * a larger hosted runner — that is a paid-plan spend decision, which is a
    #     human call, not something a bot may switch on.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Partition of the MEASURED package list (`go list ./...` -> 318 packages),
        # not of the directory tree: several top-level dirs (infra/, ml/, mobile/,
        # deploy/, artifacts/, output/, _build/, api/, config/, lib/, models/,
        # fuzz/, script/, gentx/, make/) are separate Go modules or hold no Go
        # packages from the root module's view, so a `./<dir>/...` pattern for them
        # matches nothing. `.` carries the root package `github.com/virtengine/virtengine`,
        # which is a real package and was previously unscanned.
        # .github/tests/test_govulncheck_shard_partition.sh asserts that these
        # shards stay disjoint and keep unioning to exactly `go list ./...`.
        include:
          - shard: core
            patterns: ". ./x/... ./app/... ./client/... ./pubsub/..."
          - shard: platform
            patterns: "./pkg/..."
          - shard: tooling
            patterns: "./cmd/... ./scripts/... ./tools/... ./docgen/..."
          - shard: tests-and-sim
            patterns: "./tests/... ./testutil/... ./sim/... ./upgrades/... ./sdk/... ./util/..."
    # NO job-level `outputs:` for verdicts, and deliberately so.
    #
    # Matrix job outputs were measured and do not work. One object arrives
    # intact while the others vanish, with no error and no warning:
    #   37295691699 - the consumer received `{tests-and-sim:clean}`
    #   37298338441 - the consumer received `{"tooling":"clean"}`, with all four
    #                 shards SUCCEEDED and every step green
    # That is OVERWRITE (one writer wins), not concatenation, so no
    # expression-level fix exists: the losing shards' values are already gone by
    # the time any consumer reads them. Each shard therefore publishes its
    # verdict as its OWN artifact, and the collector reads them one by one so a
    # missing shard is individually attributable.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies for cgo packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck (${{ matrix.shard }})
        id: govulncheck
        env:
          CGO_ENABLED: "1"
        run: |
          # default -scan=symbol, same as the unsharded gate; only the package SET
          # is partitioned. NOTE: -show=verbose is NOT valid with -format json
          # (govulncheck answers "the -show flag is not supported for json output"
          # and writes no report at all, which the verdict classifier correctly
          # reports as verdict=error rather than as a clean scan). Progress
          # reporting is therefore unavailable on the JSON pass; the per-shard
          # job name and the step's own echo lines are the progress signal.
          #
          # The verdict ledger below records this shard's verdict as a FILE that
          # survives cancellation. A shard killed mid-scan cannot run any later
          # step, so the only evidence it produced a verdict is something written
          # before the kill; the policy-validation job then requires one verdict
          # per declared shard and fails closed on a missing one.
          mkdir -p "$RUNNER_TEMP/govulncheck-ledger"
          printf '%s\n' "${{ matrix.shard }}" > "$RUNNER_TEMP/govulncheck-ledger/shards.manifest"
          set +e
          govulncheck -format json ${{ matrix.patterns }} \
            > govulncheck-report.json
          json_status=$?
          set -e
          # Classify the run before reporting anything. A config-only report
          # (package loading failed) must never be reported as a vulnerability
          # finding, and a scanner failure must never be reported as a clean
          # scan. Regression cases: .github/tests/test_govulncheck_verdict.sh
          out="$(bash .github/scripts/govulncheck_verdict.sh \
            govulncheck-report.json "$json_status" - 2>&1)"
          echo "$out"
          verdict="$(printf '%s\n' "$out" | sed -n 's/^verdict=//p')"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = "error" ]; then
            echo "::error::govulncheck could not complete on shard ${{ matrix.shard }} - this is a scanner error, not a vulnerability finding"
            echo "verdict=error" > "$RUNNER_TEMP/govulncheck-ledger/${{ matrix.shard }}.verdict"
            exit 1
          fi
          # Filter findings against the vulnerability allowlist. Only advisories
          # with no fixed version AND no reachable-and-fixable alternative are
          # allowlisted; anything the filter still reports is real work.
          # Exit codes: 3 = un-allowlisted findings remain, 0 = clean and the
          # report parsed to the end, 4 = the report was INCOMPLETE (the scan
          # was cut short, so no verdict may be claimed), other = a real error.
          set +e
          python .github/scripts/filter_allowlist.py \
            govulncheck-report.json .vulnerability-allowlist.yaml
          filter_status=$?
          set -e
          if [ "$filter_status" -eq 3 ]; then
            echo "verdict_after_allowlist=vulns" >> "$GITHUB_OUTPUT"
            echo "::error::govulncheck reported reachable vulnerabilities not covered by allowlist on shard ${{ matrix.shard }}"
            echo "verdict=vulns" > "$RUNNER_TEMP/govulncheck-ledger/${{ matrix.shard }}.verdict"
            exit 1
          elif [ "$filter_status" -eq 4 ]; then
            echo "verdict_after_allowlist=incomplete" >> "$GITHUB_OUTPUT"
            echo "::error::govulncheck report on shard ${{ matrix.shard }} is incomplete - the scan did not finish, so this shard has NO verdict. Treating it as clean would be a false negative."
            echo "verdict=incomplete" > "$RUNNER_TEMP/govulncheck-ledger/${{ matrix.shard }}.verdict"
            exit 1
          elif [ "$filter_status" -eq 0 ]; then
            echo "verdict_after_allowlist=clean" >> "$GITHUB_OUTPUT"
            echo "verdict=clean" > "$RUNNER_TEMP/govulncheck-ledger/${{ matrix.shard }}.verdict"
          else
            echo "::error::allowlist filter failed with exit code $filter_status"
            echo "verdict=error" > "$RUNNER_TEMP/govulncheck-ledger/${{ matrix.shard }}.verdict"
            exit 1
          fi

      - name: Upload govulncheck report (${{ matrix.shard }})
        uses: actions/upload-artifact@v6
        # `always()` so the report is uploaded even when the scan step failed:
        # a shard that failed AFTER reaching a verdict still has a verdict, and
        # the policy-validation gate must see the difference between that and a
        # shard that never got far enough to reach one.
        if: always()
        with:
          name: govulncheck-report-${{ matrix.shard }}
          path: govulncheck-report.json
          retention-days: 30

      - name: Publish this shard's verdict
        # The verdict travels as THIS SHARD'S OWN ARTIFACT.
        #
        # Two transports were measured and both failed silently:
        #   * `gh run download` in the consumer - all four downloads timed out at
        #     ~60s each while every shard had SUCCEEDED (run 37292268699), and the
        #     step discarded gh's stderr so a cancelled shard and a download
        #     failure produced the SAME log line.
        #   * matrix job outputs - ONE WRITER WINS and the rest vanish, on both
        #     37295691699 and 37298338441 (the latter with all four shards green
        #     at every step). No expression-level fix exists for overwrite.
        #
        # A separate artifact per shard has neither problem: each is
        # independently addressable by name, so a shard with no artifact is
        # attributable to that shard rather than to an aggregate.
        #
        # `if: always()` is NOT a weakening: a shard that reached a verdict
        # publishes it (the matrix result stays red on its own), while a shard
        # killed mid-scan never reaches this step and therefore publishes
        # nothing - which is precisely the no-verdict signal the gate keys on.
        #
        # `if-no-files-found: error` makes a shard that reached this step without
        # a verdict file fail loudly here, rather than publishing an empty
        # artifact that would read as a present-but-empty verdict.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: govulncheck-verdict-${{ matrix.shard }}
          path: ${{ runner.temp }}/govulncheck-ledger/${{ matrix.shard }}.verdict
          retention-days: 30
          if-no-files-found: error

  python-vuln-scan:
    name: Python Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.0

      - name: Audit Python requirement files
        id: pip_audit
        run: |
          mkdir -p security-reports/python
          mapfile -t requirement_files < <(find . -type f \( -name "requirements.txt" -o -name "requirements-deterministic.txt" \) \
            -not -path "./.venv/*" \
            -not -path "./node_modules/*" | sort)
          if [ "${#requirement_files[@]}" -eq 0 ]; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=0
          for requirement_file in "${requirement_files[@]}"; do
            report_name="${requirement_file#./}"
            report_name="${report_name//\//__}"
            report_name="${report_name//\\/__}"
            report_path="security-reports/python/${report_name}.json"
            set +e
            pip-audit -r "$requirement_file" --format json -o "$report_path"
            audit_status=$?
            set -e
            if [ ! -s "$report_path" ]; then
              echo "::error::pip-audit did not produce a report for $requirement_file"
              exit 1
            fi
            if [ "$audit_status" -ne 0 ]; then
              status=1
            fi
          done

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload Python audit reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-audit-reports
          path: security-reports/python
          retention-days: 30

      - name: Fail on Python vulnerabilities
        if: steps.pip_audit.outputs.exit_code != '0'
        run: |
          echo "::error::pip-audit reported vulnerabilities"
          exit 1

  node-vuln-scan:
    name: JavaScript Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sdk/portal/pnpm-lock.yaml

      - name: Test the audit gate
        run: |
          # `pnpm audit --json` exits 1 when ANY advisory is present, regardless of
          # --audit-level, so a gate that reads that exit code cannot express the
          # threshold its own flags document. scripts/ci/audit-gate.mjs evaluates the
          # severity counts out of the report instead. Keep its negative cases green:
          node --test scripts/ci/audit-gate.test.mjs > audit-gate-tests.log 2>&1
          cat audit-gate-tests.log
          # A test run that discovers no tests also exits 0, so assert a positive count.
          count=$(grep -oE 'tests[[:space:]]+[0-9]+' audit-gate-tests.log | head -1 | grep -oE '[0-9]+')
          if [ -z "${count:-}" ] || [ "$count" -eq 0 ]; then
            echo "::error::audit-gate tests did not run"
            exit 1
          fi
          echo "audit-gate self-tests ran: $count"

      - name: Audit root pnpm workspace
        id: root_pnpm_audit
        run: |
          mkdir -p security-reports/node
          pnpm install --frozen-lockfile --ignore-scripts
          # The audit's own exit code is deliberately not read; the gate below reads the
          # report it writes, and fails closed if that report is missing or unparseable.
          set +e
          pnpm audit --prod --audit-level=high --json > security-reports/node/root-workspace.json
          set -e
          set +e
          AUDIT_GATE_LABEL="root pnpm workspace" \
            node scripts/ci/audit-gate.mjs security-reports/node/root-workspace.json high
          gate_status=$?
          set -e
          echo "exit_code=$gate_status" >> "$GITHUB_OUTPUT"

      - name: Audit sdk/portal
        id: sdk_portal_audit
        run: |
          # --ignore-workspace is REQUIRED here. sdk/portal is a standalone pnpm project,
          # and without this flag pnpm walks up to the repo-root pnpm-workspace.yaml and
          # installs/audits the ROOT workspace instead — so this step used to report the
          # root workspace's dependency graph (417 deps, paths like `portal>next`) and
          # never scanned sdk/portal at all. portal-ci.yaml already passes this flag for
          # the same command; this job had omitted it.
          pnpm --ignore-workspace --dir sdk/portal install --frozen-lockfile --ignore-scripts
          set +e
          pnpm --ignore-workspace --dir sdk/portal audit --prod --audit-level=high --json \
            > security-reports/node/sdk-portal.json
          set -e
          set +e
          AUDIT_GATE_LABEL="sdk/portal" \
            node scripts/ci/audit-gate.mjs security-reports/node/sdk-portal.json high
          gate_status=$?
          set -e
          echo "exit_code=$gate_status" >> "$GITHUB_OUTPUT"

      - name: Audit sdk/ts
        id: sdk_ts_audit
        run: |
          # Deliberately NOT --prod, unlike the two pnpm scans above: sdk/ts is a library
          # whose devDependencies are the build/test toolchain, and auditing them keeps
          # that toolchain covered. The threshold is the same (`high`), so this job's
          # acceptance bar is consistent across all three workspaces.
          npm --prefix sdk/ts ci --ignore-scripts
          set +e
          npm --prefix sdk/ts audit --audit-level=high --json > security-reports/node/sdk-ts.json
          set -e
          set +e
          AUDIT_GATE_LABEL="sdk/ts" \
            node scripts/ci/audit-gate.mjs security-reports/node/sdk-ts.json high
          gate_status=$?
          set -e
          echo "exit_code=$gate_status" >> "$GITHUB_OUTPUT"

      - name: Upload JavaScript audit reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: node-audit-reports
          path: security-reports/node
          retention-days: 30

      - name: Fail on JavaScript vulnerabilities
        if: |
          steps.root_pnpm_audit.outputs.exit_code != '0' ||
          steps.sdk_portal_audit.outputs.exit_code != '0' ||
          steps.sdk_ts_audit.outputs.exit_code != '0'
        run: |
          echo "::error::JavaScript dependency audits reported high or critical advisories"
          exit 1

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: virtengine
            dockerfile: _build/Dockerfile.virtengine
          - name: provider-daemon
            dockerfile: _build/Dockerfile.provider-daemon
          - name: test-runner
            dockerfile: _build/Dockerfile.test
          - name: veid-pipeline
            dockerfile: _build/Dockerfile.veid-pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Trivy
        run: |
          TOOL_DIR="$(mktemp -d)"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" | tar -xz -C "$TOOL_DIR"
          sudo install -m 0755 "$TOOL_DIR/trivy" /usr/local/bin/trivy

      - name: Build image
        run: |
          docker buildx build \
            --load \
            -f "${{ matrix.image.dockerfile }}" \
            -t "${{ matrix.image.name }}:scan" \
            .

      - name: Generate Trivy SARIF report
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --scanners vuln \
            --vuln-type os,library \
            --format sarif \
            --output "trivy-${{ matrix.image.name }}.sarif" \
            "${{ matrix.image.name }}:scan"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

      - name: Enforce Trivy policy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --scanners vuln \
            --vuln-type os,library \
            --exit-code 1 \
            "${{ matrix.image.name }}:scan"

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Syft
        run: |
          TOOL_DIR="$(mktemp -d)"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" | tar -xz -C "$TOOL_DIR"
          sudo install -m 0755 "$TOOL_DIR/syft" /usr/local/bin/syft

      - name: Generate SBOM bundle
        run: |
          chmod +x scripts/supply-chain/generate-sbom.sh
          scripts/supply-chain/generate-sbom.sh --format all --output .cache/sbom
          sha256sum .cache/sbom/*.json > .cache/sbom/SHA256SUMS

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: security-sbom
          path: .cache/sbom
          retention-days: 90

      - name: Publish SPDX SBOM to the dependency graph
        uses: anchore/sbom-action/publish-sbom@v0
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mainnet/main')
        with:
          sbom-artifact-match: ".*\\.spdx\\.json$"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          TOOL_DIR="$(mktemp -d)"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz -C "$TOOL_DIR"
          sudo install -m 0755 "$TOOL_DIR/gitleaks" /usr/local/bin/gitleaks

      - name: Run gitleaks
        id: gitleaks
        run: |
          set +e
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif
          status=$?
          set -e
          if [ ! -s gitleaks.sarif ]; then
            echo "::error::gitleaks did not produce a SARIF report"
            exit 1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Fail on secret findings
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::gitleaks detected secrets or secret-like material"
          exit 1

  gosec-scan:
    name: gosec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      # Same libudev requirement as go-vuln-scan: gosec type-checks the hid
      # chain (zondax/hid carries `#cgo pkg-config: libudev`).
      - name: Install build dependencies for cgo packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev

      # gosec resolves packages through golang.org/x/tools/go/packages, which runs
      # the go command with the default -mod=readonly. When a module is not tidy the
      # loader refuses with "updates to go.mod needed" and gosec discards every
      # affected package without logging anything: analyzer.go does
      # `if pkg.Name == "" { continue }` before it has a chance to record an error,
      # so the JSON report's "Golang errors" stays empty and the job still exits 0.
      # That is how this gate came to analyse 582 of the repository's 3367 Go files
      # while reporting success. Fail here, with the go tool's own message, instead.
      - name: Assert every scanned module resolves under -mod=readonly
        run: |
          set -euo pipefail
          failed=0
          for module in . sdk/go sdk/specs; do
            log="/tmp/golist-$(echo "$module" | tr '/' '-').log"
            if ! (cd "$module" && GOWORK=off go list ./... > /dev/null 2>"$log"); then
              echo "::error::module '$module' does not resolve, so gosec would silently skip its packages"
              cat "$log"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::run 'go mod tidy' in each module listed above and commit go.mod/go.sum"
            exit 1
          fi

      - name: Run gosec
        id: gosec
        run: |
          set +e
          status=0
          # Each module is scanned explicitly. `gosec ./...` from the repository root
          # only reaches packages of the root module; the nested sdk/go and sdk/specs
          # modules were not analysed by any gate before this change. sdk/generation
          # and the infra/*/tests modules are deliberately out of scope: they contain
          # no non-test Go files (verified by the coverage assertion below).
          run_gosec() {
            module="$1"
            slug="$2"
            for format in json sarif; do
              if ! (cd "$module" && gosec -fmt "$format" -out "$GITHUB_WORKSPACE/gosec-${slug}.${format}" \
                      -exclude-generated -exclude-dir=vendor -exclude-dir=testutil ./...) \
                      >> "/tmp/gosec-${slug}.log" 2>&1; then
                status=1
              fi
              if [ ! -s "$GITHUB_WORKSPACE/gosec-${slug}.${format}" ]; then
                echo "::error::gosec did not produce a $format report for module '$module'"
                status=1
              fi
            done
          }
          run_gosec . root
          run_gosec sdk/go sdk-go
          run_gosec sdk/specs sdk-specs
          set -e
          if [ "$status" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      # The scan above cannot tell a suppressed finding from a suppressed
      # annotation: standalone gosec reads only `#nosec`, so a file whose
      # suppressions are written as `//nolint:gosec` silences golangci-lint and
      # the developer's editor while every finding still lands in this job. That
      # is how PR #1254 put 7 findings into this gate looking justified.
      #
      # This step grades the FORMS, not the findings -- it does not run gosec and
      # does not decide whether any finding is real. It fails on an annotation
      # that silences the linter but not the gate, and is ratcheted against a
      # recorded baseline so the existing debt does not red the gate on arrival.
      # See _docs/security/gosec-triage.md section 9.5.
      - name: Reject gosec suppressions the gate cannot read
        run: |
          set -uo pipefail
          GOWORK=off go run ./scripts/gosecsuppressions \
            -root . \
            -baseline scripts/gosecsuppressions/gosec-suppressions.baseline

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-root.sarif
          category: gosec

      - name: Upload gosec SARIF (sdk/go)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-sdk-go.sarif
          category: gosec-sdk-go

      - name: Upload gosec SARIF (sdk/specs)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-sdk-specs.sarif
          category: gosec-sdk-specs

      - name: Upload gosec JSON reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gosec-report
          path: gosec-*.json
          retention-days: 30

      # A partial scan must never look like a clean one. This reconstructs the
      # expected package set with the go tool and fails if gosec analysed fewer
      # packages than the module contains, naming each package it skipped.
      - name: Assert gosec analysed every package
        run: |
          set -euo pipefail
          python3 .github/scripts/check_gosec_coverage.py --log /tmp/gosec-root.log \
            --module-dir . --exclude-dir vendor --exclude-dir testutil
          python3 .github/scripts/check_gosec_coverage.py --log /tmp/gosec-sdk-go.log \
            --module-dir sdk/go --exclude-dir vendor --exclude-dir testutil
          python3 .github/scripts/check_gosec_coverage.py --log /tmp/gosec-sdk-specs.log \
            --module-dir sdk/specs --exclude-dir vendor --exclude-dir testutil

      - name: Fail on gosec findings
        if: steps.gosec.outputs.exit_code != '0'
        run: |
          echo "::error::gosec reported security findings"
          exit 1

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - codeql-analysis
      - go-vuln-scan
      - python-vuln-scan
      - node-vuln-scan
      - container-scan
      - sbom-generation
      - secret-scan
      - gosec-scan
    if: always()
    steps:
      # The "Fail if any security gate failed" step runs a helper FROM THIS REPO
      # (.github/scripts/check_security_gate_results.sh). Without a checkout the job's
      # workspace is empty and bash exits 127 ("No such file or directory"), so the gate
      # fails for a reason that has nothing to do with the security results it summarises.
      - name: Checkout gate-result helper
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Summarize security gates
        run: |
          {
            echo "# Security Summary"
            echo ""
            echo "| Gate | Status |"
            echo "|------|--------|"
            echo "| Policy Validation | ${{ needs.policy-validation.result }} |"
            echo "| CodeQL | ${{ needs.codeql-analysis.result }} |"
            echo "| govulncheck (all shards) | ${{ needs.go-vuln-scan.result }} |"
            echo "| pip-audit | ${{ needs.python-vuln-scan.result }} |"
            echo "| JavaScript audits | ${{ needs.node-vuln-scan.result }} |"
            echo "| Container scan | ${{ needs.container-scan.result }} |"
            echo "| SBOM generation | ${{ needs.sbom-generation.result }} |"
            echo "| gitleaks | ${{ needs.secret-scan.result }} |"
            echo "| gosec | ${{ needs.gosec-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any security gate failed
        run: |
          bash .github/scripts/check_security_gate_results.sh \
            "${{ needs.policy-validation.result }}" \
            "${{ needs.codeql-analysis.result }}" \
            "${{ needs.go-vuln-scan.result }}" \
            "${{ needs.python-vuln-scan.result }}" \
            "${{ needs.node-vuln-scan.result }}" \
            "${{ needs.container-scan.result }}" \
            "${{ needs.sbom-generation.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.gosec-scan.result }}"
