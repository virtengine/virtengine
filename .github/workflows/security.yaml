name: Security

on:
  push:
    branches:
      - main
      - mainnet/main
      - develop
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.25.5"
  GOVULNCHECK_VERSION: "v1.1.4"
  GOSEC_VERSION: "v2.25.0"
  GITLEAKS_VERSION: "v8.30.1"
  TRIVY_VERSION: "v0.69.3"
  SYFT_VERSION: "v1.42.4"
  PNPM_VERSION: "10.28.2"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"
  GOWORK: "off"

permissions:
  contents: read

jobs:
  policy-validation:
    name: Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Validate security policy files
        run: |
          python .github/scripts/validate_security_policies.py --files \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml \
            .gitleaks.toml \
            .vulnerability-allowlist.yaml \
            SUPPLY_CHAIN_SECURITY.md

      - name: Run policy validator tests
        run: python -m unittest discover -s .github/tests -p "test_security_policy*.py"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint targeted workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/security.yaml \
            .github/workflows/supply-chain.yaml \
            .github/workflows/license-compliance.yaml \
            .github/workflows/pr-security-check.yaml

  codeql-analysis:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: +security-extended,security-and-quality
          config: |
            paths-ignore:
              - vendor
              - "**/*.pb.go"
              - "**/mocks/**"
              - testutil

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build for CodeQL
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"

  go-vuln-scan:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        id: govulncheck
        run: |
          set +e
          govulncheck -format json ./... > govulncheck-report.json
          json_status=$?
          govulncheck ./...
          text_status=$?
          set -e
          if [ ! -s govulncheck-report.json ]; then
            echo "::error::govulncheck did not produce a JSON report"
            exit 1
          fi
          if [ "$json_status" -ne 0 ] || [ "$text_status" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload govulncheck report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck-report
          path: govulncheck-report.json
          retention-days: 30

      - name: Fail on Go vulnerabilities
        if: steps.govulncheck.outputs.exit_code != '0'
        run: |
          echo "::error::govulncheck reported vulnerabilities"
          exit 1

  python-vuln-scan:
    name: Python Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.0

      - name: Audit Python requirement files
        id: pip_audit
        run: |
          mkdir -p security-reports/python
          mapfile -t requirement_files < <(find . -type f \( -name "requirements.txt" -o -name "requirements-deterministic.txt" \) \
            -not -path "./.venv/*" \
            -not -path "./node_modules/*" | sort)
          if [ "${#requirement_files[@]}" -eq 0 ]; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=0
          for requirement_file in "${requirement_files[@]}"; do
            report_name=$(echo "${requirement_file#./}" | tr '/\\' '__')
            report_path="security-reports/python/${report_name}.json"
            set +e
            pip-audit -r "$requirement_file" --format json -o "$report_path"
            audit_status=$?
            set -e
            if [ ! -s "$report_path" ]; then
              echo "::error::pip-audit did not produce a report for $requirement_file"
              exit 1
            fi
            if [ "$audit_status" -ne 0 ]; then
              status=1
            fi
          done

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload Python audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-audit-reports
          path: security-reports/python
          retention-days: 30

      - name: Fail on Python vulnerabilities
        if: steps.pip_audit.outputs.exit_code != '0'
        run: |
          echo "::error::pip-audit reported vulnerabilities"
          exit 1

  node-vuln-scan:
    name: JavaScript Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            sdk/portal/pnpm-lock.yaml

      - name: Audit root pnpm workspace
        id: root_pnpm_audit
        run: |
          mkdir -p security-reports/node
          pnpm install --frozen-lockfile --ignore-scripts
          set +e
          pnpm audit --prod --audit-level=high --json > security-reports/node/root-workspace.json
          audit_status=$?
          set -e
          if [ ! -s security-reports/node/root-workspace.json ]; then
            echo "::error::pnpm audit did not produce a root workspace report"
            exit 1
          fi
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"

      - name: Audit sdk/portal
        id: sdk_portal_audit
        run: |
          pnpm --dir sdk/portal install --frozen-lockfile --ignore-scripts
          set +e
          pnpm --dir sdk/portal audit --prod --audit-level=high --json > security-reports/node/sdk-portal.json
          audit_status=$?
          set -e
          if [ ! -s security-reports/node/sdk-portal.json ]; then
            echo "::error::pnpm audit did not produce an sdk/portal report"
            exit 1
          fi
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"

      - name: Audit sdk/ts
        id: sdk_ts_audit
        run: |
          npm --prefix sdk/ts ci --ignore-scripts
          set +e
          npm --prefix sdk/ts audit --audit-level=high --json > security-reports/node/sdk-ts.json
          audit_status=$?
          set -e
          if [ ! -s security-reports/node/sdk-ts.json ]; then
            echo "::error::npm audit did not produce an sdk/ts report"
            exit 1
          fi
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"

      - name: Upload JavaScript audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-audit-reports
          path: security-reports/node
          retention-days: 30

      - name: Fail on JavaScript vulnerabilities
        if: |
          steps.root_pnpm_audit.outputs.exit_code != '0' ||
          steps.sdk_portal_audit.outputs.exit_code != '0' ||
          steps.sdk_ts_audit.outputs.exit_code != '0'
        run: |
          echo "::error::JavaScript dependency audits reported vulnerabilities"
          exit 1

  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: virtengine
            dockerfile: _build/Dockerfile.virtengine
          - name: provider-daemon
            dockerfile: _build/Dockerfile.provider-daemon
          - name: test-runner
            dockerfile: _build/Dockerfile.test
          - name: veid-pipeline
            dockerfile: _build/Dockerfile.veid-pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" | tar -xz
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Build image
        run: |
          docker buildx build \
            --load \
            -f "${{ matrix.image.dockerfile }}" \
            -t "${{ matrix.image.name }}:scan" \
            .

      - name: Generate Trivy SARIF report
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --vuln-type os,library \
            --format sarif \
            --output "trivy-${{ matrix.image.name }}.sarif" \
            "${{ matrix.image.name }}:scan"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

      - name: Enforce Trivy policy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --vuln-type os,library \
            --exit-code 1 \
            "${{ matrix.image.name }}:scan"

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" | tar -xz
          sudo install -m 0755 syft /usr/local/bin/syft

      - name: Generate SBOM bundle
        run: |
          chmod +x scripts/supply-chain/generate-sbom.sh
          scripts/supply-chain/generate-sbom.sh --format all --output .cache/sbom
          sha256sum .cache/sbom/*.json > .cache/sbom/SHA256SUMS

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-sbom
          path: .cache/sbom
          retention-days: 90

      - name: Publish SPDX SBOM to the dependency graph
        uses: anchore/sbom-action/publish-sbom@v0
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mainnet/main')
        with:
          sbom-artifact-match: ".*\\.spdx\\.json$"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        id: gitleaks
        run: |
          set +e
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif
          status=$?
          set -e
          if [ ! -s gitleaks.sarif ]; then
            echo "::error::gitleaks did not produce a SARIF report"
            exit 1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Fail on secret findings
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "::error::gitleaks detected secrets or secret-like material"
          exit 1

  gosec-scan:
    name: gosec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: Run gosec
        id: gosec
        run: |
          set +e
          gosec -fmt json -out gosec.json -exclude-generated -exclude-dir=vendor -exclude-dir=testutil ./...
          json_status=$?
          gosec -fmt sarif -out gosec.sarif -exclude-generated -exclude-dir=vendor -exclude-dir=testutil ./...
          sarif_status=$?
          set -e
          if [ ! -s gosec.json ] || [ ! -s gosec.sarif ]; then
            echo "::error::gosec did not produce both JSON and SARIF outputs"
            exit 1
          fi
          if [ "$json_status" -ne 0 ] || [ "$sarif_status" -ne 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Upload gosec JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosec-report
          path: gosec.json
          retention-days: 30

      - name: Fail on gosec findings
        if: steps.gosec.outputs.exit_code != '0'
        run: |
          echo "::error::gosec reported security findings"
          exit 1

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - policy-validation
      - codeql-analysis
      - go-vuln-scan
      - python-vuln-scan
      - node-vuln-scan
      - container-scan
      - sbom-generation
      - secret-scan
      - gosec-scan
    if: always()
    steps:
      - name: Summarize security gates
        run: |
          echo "# Security Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Policy Validation | ${{ needs.policy-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | ${{ needs.codeql-analysis.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| govulncheck | ${{ needs.go-vuln-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pip-audit | ${{ needs.python-vuln-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| JavaScript audits | ${{ needs.node-vuln-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container scan | ${{ needs.container-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM generation | ${{ needs.sbom-generation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gitleaks | ${{ needs.secret-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gosec | ${{ needs.gosec-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any security gate failed
        run: |
          FAILED=0
          for result in \
            "${{ needs.policy-validation.result }}" \
            "${{ needs.codeql-analysis.result }}" \
            "${{ needs.go-vuln-scan.result }}" \
            "${{ needs.python-vuln-scan.result }}" \
            "${{ needs.node-vuln-scan.result }}" \
            "${{ needs.container-scan.result }}" \
            "${{ needs.sbom-generation.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.gosec-scan.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more required security gates failed"
            exit 1
          fi
