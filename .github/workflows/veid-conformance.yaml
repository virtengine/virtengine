# VEID Deterministic Inference Conformance Suite

name: VEID Conformance

on:
  workflow_call:
  push:
    branches:
      - main
      - mainnet/main
      - "release/**"
    paths:
      - "cmd/inference-sidecar/**"
      - "pkg/inference/**"
      - "x/veid/**"
      - "tests/integration/veid/task85d_process_boundary_test.go"
      - "deploy/kubernetes/**"
      - "infra/kubernetes/**"
      - ".github/scripts/validate_inference_deployment_policy.py"
      - ".github/tests/test_inference_deployment_policy.py"
      - ".github/workflows/veid-conformance.yaml"
      - ".github/AGENTS.md"
      - "docs/inference-sidecar-deployment.md"
      - "_docs/inference-fallback-behavior.md"
      - "_docs/runbooks/**"
      - "_docs/INDEX.md"
  pull_request:
    branches:
      - main
      - mainnet/main
    paths:
      - "cmd/inference-sidecar/**"
      - "pkg/inference/**"
      - "x/veid/**"
      - "tests/integration/veid/task85d_process_boundary_test.go"
      - "deploy/kubernetes/**"
      - "infra/kubernetes/**"
      - ".github/scripts/validate_inference_deployment_policy.py"
      - ".github/tests/test_inference_deployment_policy.py"
      - ".github/workflows/veid-conformance.yaml"
      - ".github/AGENTS.md"
      - "docs/inference-sidecar-deployment.md"
      - "_docs/inference-fallback-behavior.md"
      - "_docs/runbooks/**"
      - "_docs/INDEX.md"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logging"
        required: false
        default: "false"
        type: boolean

env:
  GO_VERSION: "1.25.5"
  PYTHON_VERSION: "3.11"
  KUBECTL_VERSION: "1.29.0"
  KUBECTL_SHA256: "0e03ab096163f61ab610b33f37f55709d3af8e16e4dcc1eb682882ef80f96fd5"
  VEID_CONFORMANCE_EVIDENCE_DIR: ${{ github.workspace }}/conformance-evidence

jobs:
  deployment-policy:
    name: Deployment Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install pinned kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check --strict
          chmod +x kubectl
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client=true --output=yaml

      - name: Run inference deployment policy tests
        shell: bash
        run: python .github/tests/test_inference_deployment_policy.py

      - name: Run inference sidecar mTLS tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/inference-sidecar ./pkg/inference \
            -run "Test.*MTLS|TestSidecarClient.*MTLS|TestStartupOptionsFailClosedDefaultsAndFallbackPolicy" \
            -count=1

      - name: Build and test inference sidecar
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/inference-sidecar ./pkg/inference -count=1
          go build -trimpath -o "${RUNNER_TEMP}/inference-sidecar" ./cmd/inference-sidecar

      - name: Validate rendered inference deployment policy
        shell: bash
        run: python .github/scripts/validate_inference_deployment_policy.py

  process-boundary:
    name: Process Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run VEID receipt and keeper tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./x/veid/types ./x/veid/keeper -count=1 -timeout 15m

      - name: Run Task 85D separate-process integration tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./tests/integration/veid -run '^TestTask85D' -count=1 -timeout 15m

  conformance-tests:
    name: Conformance (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Create evidence directory
        shell: bash
        run: mkdir -p "${VEID_CONFORMANCE_EVIDENCE_DIR}"

      - name: Run deterministic conformance tests
        shell: bash
        run: |
          set -euo pipefail
          export VE_DIRENV_SET=1
          export TF_DETERMINISTIC_OPS=1
          export TF_CUDNN_DETERMINISTIC=1
          export PYTHONHASHSEED=42
          export OMP_NUM_THREADS=1
          export TF_ENABLE_ONEDNN_OPTS=0

          go test -v -race -timeout 10m \
            -run "TestDeterministicConformanceSuite" \
            ./pkg/inference/... \
            2>&1 | tee conformance-output.txt

      - name: Run golden vector tests
        shell: bash
        run: |
          set -euo pipefail
          export VE_DIRENV_SET=1
          go test -v -timeout 5m \
            -run "TestGoldenVector" \
            ./pkg/inference/... \
            2>&1 | tee golden-vector-output.txt

      - name: Run multi-environment simulation
        shell: bash
        run: |
          set -euo pipefail
          export VE_DIRENV_SET=1
          go test -v -timeout 5m \
            -run "TestMultiEnvironmentSimulation" \
            ./pkg/inference/... \
            2>&1 | tee multi-env-output.txt

      - name: Collect test evidence
        if: always()
        shell: bash
        run: |
          {
            echo "Platform: ${{ matrix.os }}/${{ matrix.arch }}"
            echo "Go version: $(go version)"
            echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Commit: ${GITHUB_SHA}"
          } > "${VEID_CONFORMANCE_EVIDENCE_DIR}/platform-info.txt"
          cp -f conformance-output.txt "${VEID_CONFORMANCE_EVIDENCE_DIR}/" 2>/dev/null || true
          cp -f golden-vector-output.txt "${VEID_CONFORMANCE_EVIDENCE_DIR}/" 2>/dev/null || true
          cp -f multi-env-output.txt "${VEID_CONFORMANCE_EVIDENCE_DIR}/" 2>/dev/null || true

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.VEID_CONFORMANCE_EVIDENCE_DIR }}/
          retention-days: 90
          if-no-files-found: error

  verify-cross-platform-hashes:
    name: Verify Cross-Platform Hashes
    runs-on: ubuntu-latest
    needs: conformance-tests
    if: always()
    steps:
      - name: Download all evidence artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-evidence
          pattern: conformance-evidence-*

      - name: Compare hashes across platforms
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          expected_dirs = {
              "conformance-evidence-linux-amd64",
              "conformance-evidence-darwin-arm64",
              "conformance-evidence-windows-amd64",
          }
          evidence_root = Path("all-evidence")
          found_dirs = {p.name for p in evidence_root.iterdir() if p.is_dir()}
          missing = sorted(expected_dirs - found_dirs)
          if missing:
              raise SystemExit(f"Missing conformance evidence directories: {missing}")

          canonical = None
          for directory in sorted(evidence_root.iterdir()):
              if not directory.is_dir():
                  continue
              for expected_file in ("conformance-output.txt", "golden-vector-output.txt", "multi-env-output.txt"):
                  if not (directory / expected_file).exists():
                      raise SystemExit(f"Missing {expected_file} in {directory}")

              text = (directory / "conformance-output.txt").read_text(encoding="utf-8", errors="ignore")
              if "FAIL" in text:
                  raise SystemExit(f"Conformance output contains FAIL markers for {directory.name}")

              hashes = sorted({
                  match
                  for line in text.splitlines()
                  if "hash" in line.lower()
                  for match in re.findall(r"[a-f0-9]{16,64}", line)
              })
              if not hashes:
                  raise SystemExit(f"No deterministic hash lines found in {directory.name}")

              if canonical is None:
                  canonical = hashes
              elif hashes != canonical:
                  raise SystemExit(f"Cross-platform hash mismatch for {directory.name}")
          PY

  benchmark:
    name: Determinism Benchmarks
    runs-on: ubuntu-latest
    needs: conformance-tests
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          go test -v -bench=. -benchmem -timeout 10m \
            ./pkg/inference/... \
            -run=^$ \
            2>&1 | tee benchmark-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-output.txt
          retention-days: 30

  conformance-summary:
    name: Conformance Summary
    runs-on: ubuntu-latest
    needs: [deployment-policy, process-boundary, conformance-tests, verify-cross-platform-hashes]
    if: always()
    steps:
      - name: Check overall status
        shell: bash
        run: |
          if [[ "${{ needs.deployment-policy.result }}" == "success" ]] && \
             [[ "${{ needs.process-boundary.result }}" == "success" ]] && \
             [[ "${{ needs.conformance-tests.result }}" == "success" ]] && \
             [[ "${{ needs.verify-cross-platform-hashes.result }}" == "success" ]]; then
            echo "VEID conformance checks passed"
            exit 0
          fi

          echo "::error::VEID conformance checks failed"
          echo "  - Deployment Policy: ${{ needs.deployment-policy.result }}"
          echo "  - Process Boundary: ${{ needs.process-boundary.result }}"
          echo "  - Conformance Tests: ${{ needs.conformance-tests.result }}"
          echo "  - Hash Verification: ${{ needs.verify-cross-platform-hashes.result }}"
          exit 1

      - name: Create summary
        if: always()
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          # VEID Conformance Suite Results

          | Required Gate | Status |
          |---------------|--------|
          | Deployment policy render and mTLS gate | ${{ needs.deployment-policy.result }} |
          | VEID receipt and separate-process boundary tests | ${{ needs.process-boundary.result }} |
          | Cross-platform conformance matrix | ${{ needs.conformance-tests.result }} |
          | Hash verification | ${{ needs.verify-cross-platform-hashes.result }} |

          Required matrix platforms:
          - linux/amd64
          - darwin/arm64
          - windows/amd64
          EOF
