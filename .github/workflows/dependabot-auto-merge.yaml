# Auto-merge Dependabot PRs after all CI checks pass.
# Only merges patch and minor updates to keep risk low.
# Controlled by the DEPENDABOT_AUTO_MERGE repository variable:
#   - Set to "true" (or leave absent) to enable
#   - Set to "false" to disable without removing the workflow
#
# This workflow complements the monitor's built-in dependabot auto-merge
# (DEPENDABOT_AUTO_MERGE env var) and serves as a reliable fallback when
# the bosun process is not running.

name: Dependabot Auto-Merge
on: pull_request

permissions:
    contents: write
    pull-requests: write

jobs:
    dependabot:
        runs-on: ubuntu-latest
        # Two conditions, both required.
        #
        # 1. Only Dependabot's own PRs.
        # 2. ONLY PRs based on `develop`. Estate policy is that `main` is
        #    human-only: `bin/safe-merge.py` merges tier-1 work onto `develop`
        #    and refuses protected-branch merges, and the standing
        #    `develop` -> `main` PR is tier-2 and human-gated. Without this
        #    condition this workflow would `gh pr merge` a bot-authored
        #    dependency bump straight into `main` whenever Dependabot filed a
        #    PR against the default branch -- which it did on every entry in
        #    `.github/dependabot.yml`, because none of them set `target-branch`
        #    and the default branch is `main`. The guard is on the JOB, not on
        #    the merge step, so the approve and merge steps are both
        #    unreachable for a `main`-based PR rather than only the merge being
        #    skipped after the PR was already approved.
        #
        # `.github/dependabot.yml` now sets `target-branch: "develop"` on every
        # update entry, so this condition is a second, independent barrier --
        # config drift cannot silently restore a bot merge into `main`.
        if: >-
          github.actor == 'dependabot[bot]' &&
          github.base_ref == 'develop'
        steps:
            - name: Check auto-merge toggle
              id: toggle
              run: |
                  # Default to enabled if var is not set
                  ENABLED="${{ vars.DEPENDABOT_AUTO_MERGE }}"
                  if [ "$ENABLED" = "false" ] || [ "$ENABLED" = "0" ]; then
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                    echo "::notice::Dependabot auto-merge is disabled via DEPENDABOT_AUTO_MERGE repository variable"
                  else
                    echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Fetch Dependabot metadata
              if: steps.toggle.outputs.skip != 'true'
              id: metadata
              uses: dependabot/fetch-metadata@v3
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            - name: Auto-approve patch & minor updates
              if: >
                  steps.toggle.outputs.skip != 'true' &&
                  contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
              run: gh pr review --approve "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Enable auto-merge (squash)
              if: >
                  steps.toggle.outputs.skip != 'true' &&
                  contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
              run: gh pr merge --auto --squash --delete-branch "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Skip major updates
              if: >
                  steps.toggle.outputs.skip != 'true' &&
                  steps.metadata.outputs.update-type == 'version-update:semver-major'
              run: |
                  echo "::warning::Major version bump detected (${{ steps.metadata.outputs.dependency-names }}). Skipping auto-merge — requires manual review."
