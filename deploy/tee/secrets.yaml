apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tee-attestation-material
  namespace: virtengine
  labels:
    app.kubernetes.io/name: tee-enclave
    app.kubernetes.io/component: enclave
    app.kubernetes.io/part-of: virtengine
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tee-attestation-material
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: attestation-client-cert.pem
      remoteRef:
        key: virtengine/prod/tee/attestation
        property: clientCertPem
    - secretKey: attestation-client-key.pem
      remoteRef:
        key: virtengine/prod/tee/attestation
        property: clientKeyPem
    - secretKey: attestation-ca.pem
      remoteRef:
        key: virtengine/prod/tee/attestation
        property: caBundlePem
    - secretKey: signer-public.pem
      remoteRef:
        key: virtengine/prod/tee/attestation
        property: signerPublicPem
    - secretKey: rotation-bundle.json
      remoteRef:
        key: virtengine/prod/tee/attestation
        property: rotationBundleJson
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tee-measurement-allowlist
  namespace: virtengine
  labels:
    app.kubernetes.io/name: tee-enclave
    app.kubernetes.io/component: enclave
    app.kubernetes.io/part-of: virtengine
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tee-measurement-allowlist
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: measurements.json
      remoteRef:
        key: virtengine/prod/tee/measurements
        property: measurementsJson
