apiVersion: apps/v1
kind: Deployment
metadata:
  name: tee-enclave-sgx
  namespace: virtengine
  labels:
    app.kubernetes.io/name: tee-enclave
    app.kubernetes.io/component: enclave
    app.kubernetes.io/part-of: virtengine
    app.kubernetes.io/version: "v1.0.0"
    virtengine.com/tee-platform: sgx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tee-enclave
      app.kubernetes.io/component: enclave
      virtengine.com/tee-platform: sgx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tee-enclave
        app.kubernetes.io/component: enclave
        app.kubernetes.io/part-of: virtengine
        virtengine.com/tee-platform: sgx
    spec:
      serviceAccountName: tee-enclave
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        virtengine.com/tee-platform: sgx
        virtengine.com/enclave-ready: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tee-enclave
              app.kubernetes.io/component: enclave
              virtengine.com/tee-platform: sgx
      tolerations:
        - key: virtengine.com/tee
          operator: Exists
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: enclave
          effect: NoSchedule
      initContainers:
        - name: tee-secret-preflight
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ec
            - |
              test -s /var/run/virtengine/tee-secrets/attestation-client-cert.pem
              test -s /var/run/virtengine/tee-secrets/attestation-client-key.pem
              test -s /var/run/virtengine/tee-secrets/attestation-ca.pem
              test -s /var/run/virtengine/tee-secrets/signer-public.pem
              test -s /var/run/virtengine/tee-secrets/rotation-bundle.json
              test -s /config/measurements.json
              grep -Eq '"allowed_mrenclaves"[[:space:]]*:[[:space:]]*\[[[:space:]]*"[^"]+"' /config/measurements.json
              grep -Eq '"allowed_mrsigners"[[:space:]]*:[[:space:]]*\[[[:space:]]*"[^"]+"' /config/measurements.json
              ! grep -Eiq '[Pp][Ee][Nn][Dd][Ii][Nn][Gg]|[Tt][Bb][Dd]|placeh[o]lder|not published y[e]t' /config/measurements.json /var/run/virtengine/tee-secrets/rotation-bundle.json
          volumeMounts:
            - name: attestation-secrets
              mountPath: /var/run/virtengine/tee-secrets
              readOnly: true
            - name: measurements
              mountPath: /config/measurements.json
              subPath: measurements.json
              readOnly: true
        - name: tee-hardware-preflight
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ec
            - |
              test -e /dev/sgx_enclave || test -e /dev/sgx/enclave
              test -e /dev/sgx_provision || test -e /dev/sgx/provision
          volumeMounts:
            - name: dev-sgx
              mountPath: /dev/sgx
              readOnly: true
            - name: dev-sgx-enclave
              mountPath: /dev/sgx_enclave
              readOnly: true
            - name: dev-sgx-provision
              mountPath: /dev/sgx_provision
              readOnly: true
      containers:
        - name: enclave
          image: virtengine/tee-enclave:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/config/enclave.yaml
          ports:
            - name: grpc
              containerPort: 8443
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
            - name: attestation
              containerPort: 8444
          env:
            - name: VIRTENGINE_TEE_PLATFORM
              value: sgx
            - name: VIRTENGINE_TEE_MODE
              valueFrom:
                configMapKeyRef:
                  name: tee-enclave-config
                  key: VIRTENGINE_TEE_MODE
            - name: VIRTENGINE_TEE_REQUIRE_HARDWARE
              valueFrom:
                configMapKeyRef:
                  name: tee-enclave-config
                  key: VIRTENGINE_TEE_REQUIRE_HARDWARE
            - name: VIRTENGINE_TEE_ALLOW_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: tee-enclave-config
                  key: VIRTENGINE_TEE_ALLOW_DEBUG
            - name: VIRTENGINE_TEE_ATTESTATION_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: tee-enclave-config
                  key: VIRTENGINE_TEE_ATTESTATION_ENDPOINT
            - name: VIRTENGINE_TEE_CERT_CACHE_PATH
              valueFrom:
                configMapKeyRef:
                  name: tee-enclave-config
                  key: VIRTENGINE_TEE_CERT_CACHE_PATH
            - name: VIRTENGINE_TEE_MIN_TCB_VERSION
              valueFrom:
                configMapKeyRef:
                  name: tee-enclave-config
                  key: VIRTENGINE_TEE_MIN_TCB_VERSION
            - name: VIRTENGINE_TEE_ATTESTATION_MAX_AGE_HOURS
              valueFrom:
                configMapKeyRef:
                  name: tee-enclave-config
                  key: VIRTENGINE_TEE_ATTESTATION_MAX_AGE_HOURS
            - name: VIRTENGINE_TEE_ROTATION_BUNDLE_PATH
              valueFrom:
                configMapKeyRef:
                  name: tee-enclave-config
                  key: VIRTENGINE_TEE_ROTATION_BUNDLE_PATH
            - name: VIRTENGINE_TEE_MEASUREMENT_ALLOWLIST
              value: /config/measurements.json
            - name: VIRTENGINE_TEE_ATTESTATION_CLIENT_CERT_FILE
              value: /var/run/virtengine/tee-secrets/attestation-client-cert.pem
            - name: VIRTENGINE_TEE_ATTESTATION_CLIENT_KEY_FILE
              value: /var/run/virtengine/tee-secrets/attestation-client-key.pem
            - name: VIRTENGINE_TEE_ATTESTATION_CA_FILE
              value: /var/run/virtengine/tee-secrets/attestation-ca.pem
            - name: VIRTENGINE_TEE_SIGNER_PUBLIC_KEY_FILE
              value: /var/run/virtengine/tee-secrets/signer-public.pem
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - sleep 15
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: measurements
              mountPath: /config/measurements.json
              subPath: measurements.json
              readOnly: true
            - name: attestation-secrets
              mountPath: /var/run/virtengine/tee-secrets
              readOnly: true
            - name: cert-cache
              mountPath: /var/cache/virtengine/tee-certs
            - name: tmp
              mountPath: /tmp
            - name: dev-sgx
              mountPath: /dev/sgx
              readOnly: true
            - name: dev-sgx-enclave
              mountPath: /dev/sgx_enclave
              readOnly: true
            - name: dev-sgx-provision
              mountPath: /dev/sgx_provision
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tee-enclave-config
        - name: measurements
          secret:
            secretName: tee-measurement-allowlist
            optional: false
        - name: attestation-secrets
          secret:
            secretName: tee-attestation-material
            optional: false
        - name: cert-cache
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: dev-sgx
          hostPath:
            path: /dev/sgx
            type: DirectoryOrCreate
        - name: dev-sgx-enclave
          hostPath:
            path: /dev/sgx_enclave
            type: CharDevice
        - name: dev-sgx-provision
          hostPath:
            path: /dev/sgx_provision
            type: CharDevice
