# Pod Disruption Budgets
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: virtengine-validator-pdb
  namespace: virtengine
  labels:
    app.kubernetes.io/name: virtengine-validator
    app.kubernetes.io/component: validator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: virtengine-validator
      app.kubernetes.io/component: validator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: virtengine-node-pdb
  namespace: virtengine
  labels:
    app.kubernetes.io/name: virtengine-node
    app.kubernetes.io/component: sentry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: virtengine-node
      app.kubernetes.io/component: sentry
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: provider-daemon-pdb
  namespace: virtengine
  labels:
    app.kubernetes.io/name: provider-daemon
    app.kubernetes.io/component: provider
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-daemon
      app.kubernetes.io/component: provider
