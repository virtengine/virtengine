apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: veid-inference
  namespace: virtengine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: veid-inference
      app.kubernetes.io/component: inference
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: virtengine-platform
      ports:
        - protocol: TCP
          port: 50051
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # A production overlay restricts this to its approved KMS/HSM endpoint.
    - to: []
      ports:
        - protocol: TCP
          port: 443
