# Network Policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: virtengine
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: virtengine
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: virtengine-validator
  namespace: virtengine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: virtengine-validator
      app.kubernetes.io/component: validator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: virtengine-node
              app.kubernetes.io/component: sentry
      ports:
        - protocol: TCP
          port: 26656
        - protocol: TCP
          port: 26657
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 26660
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: virtengine-node
              app.kubernetes.io/component: sentry
      ports:
        - protocol: TCP
          port: 26656
        - protocol: TCP
          port: 26657
    # Remote signer / TMKMS endpoint. Restrict this with cluster-specific CIDRs
    # in private overlays when signer networking is known.
    - to: []
      ports:
        - protocol: TCP
          port: 26658
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: virtengine-node
  namespace: virtengine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: virtengine-node
      app.kubernetes.io/component: sentry
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 26656
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 26657
        - protocol: TCP
          port: 1317
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 26660
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 26656
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: virtengine-validator
              app.kubernetes.io/component: validator
      ports:
        - protocol: TCP
          port: 26656
        - protocol: TCP
          port: 26657
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-daemon
  namespace: virtengine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider-daemon
      app.kubernetes.io/component: provider
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8444
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: virtengine-node
              app.kubernetes.io/component: sentry
      ports:
        - protocol: TCP
          port: 26657
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443
