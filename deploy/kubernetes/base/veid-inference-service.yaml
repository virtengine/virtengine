apiVersion: v1
kind: Service
metadata:
  name: veid-inference
  namespace: virtengine
  labels:
    app.kubernetes.io/name: veid-inference
    app.kubernetes.io/component: inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: veid-inference
    app.kubernetes.io/component: inference
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: metrics
      port: 9090
      targetPort: metrics
