# VirtEngine Kubernetes Base Manifests
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: virtengine

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - virtengine-node-deployment.yaml
  - virtengine-node-service.yaml
  - provider-daemon-deployment.yaml
  - provider-daemon-service.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  # TEE Enclave resources (TEE-HW-001)
  - tee-enclave-configmap.yaml
  - tee-enclave-deployment.yaml
  - tee-enclave-service.yaml
