# External Secrets references
# Validator private key material is not mounted into Kubernetes pods. The
# validator workload consumes only remote-signer/TMKMS metadata and a fencing
# token, while the key remains in the signer/HSM custody boundary.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validator-signer-identity
  namespace: virtengine
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: validator-signer-identity
    creationPolicy: Owner
  data:
    - secretKey: validator-address
      remoteRef:
        key: secret/virtengine/dev/validator-signer
        property: validator-address
    - secretKey: validator-key-fingerprint
      remoteRef:
        key: secret/virtengine/dev/validator-signer
        property: validator-key-fingerprint
    - secretKey: signer-endpoint
      remoteRef:
        key: secret/virtengine/dev/validator-signer
        property: signer-endpoint
    - secretKey: signer-epoch
      remoteRef:
        key: secret/virtengine/dev/validator-signer
        property: signer-epoch
    - secretKey: signer-fencing-token
      remoteRef:
        key: secret/virtengine/dev/validator-signer
        property: signer-fencing-token
    - secretKey: tmkms-config-sha256
      remoteRef:
        key: secret/virtengine/dev/validator-signer
        property: tmkms-config-sha256
    - secretKey: signer-cert-sha256
      remoteRef:
        key: secret/virtengine/dev/validator-signer
        property: signer-cert-sha256
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: provider-daemon-secrets
  namespace: virtengine
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: provider-daemon-secrets
    creationPolicy: Owner
  data:
    - secretKey: provider-address
      remoteRef:
        key: secret/virtengine/dev/provider-daemon
        property: provider-address
    - secretKey: provider-key-fingerprint
      remoteRef:
        key: secret/virtengine/dev/provider-daemon
        property: provider-key-fingerprint
    - secretKey: provider-key-passphrase
      remoteRef:
        key: secret/virtengine/dev/provider-daemon
        property: provider-key-passphrase
    - secretKey: provider-key-backup-passphrase
      remoteRef:
        key: secret/virtengine/dev/provider-daemon
        property: provider-key-backup-passphrase
    - secretKey: waldur-chain-keyring-passphrase
      remoteRef:
        key: secret/virtengine/dev/provider-daemon
        property: waldur-chain-keyring-passphrase
    - secretKey: portal-auth-secret
      remoteRef:
        key: secret/virtengine/dev/provider-daemon
        property: portal-auth-secret
---
# The inference process authenticates mutually with callers and delegates
# receipt signing to an HSM/KMS. The referenced store creates the tls.crt,
# tls.key and ca.crt values; no certificate, private key or KMS credential is
# committed to this repository.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: veid-inference-identity
  namespace: virtengine
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: veid-inference-mtls
    creationPolicy: Owner
  data:
    - secretKey: tls.crt
      remoteRef:
        key: secret/virtengine/dev/veid-inference
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: secret/virtengine/dev/veid-inference
        property: tls.key
    - secretKey: ca.crt
      remoteRef:
        key: secret/virtengine/dev/veid-inference
        property: ca.crt
---
# Database credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: virtengine
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: database-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/virtengine/dev/database
