# VirtEngine chain workloads
#
# The validator identity is intentionally separated from horizontally scalable
# sentry/full nodes. Only virtengine-validator can connect to the remote signer,
# and it is pinned to one replica to prevent double-signing.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: virtengine-validator
  namespace: virtengine
  labels:
    app.kubernetes.io/name: virtengine-validator
    app.kubernetes.io/component: validator
    app.kubernetes.io/part-of: virtengine-platform
    virtengine.com/signer-mode: remote-tmkms
  annotations:
    reloader.stakater.com/auto: "true"
    virtengine.com/validator-identity: "single-active-remote-signer"
spec:
  serviceName: virtengine-validator-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: virtengine-validator
      app.kubernetes.io/component: validator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: virtengine-validator
        app.kubernetes.io/component: validator
        app.kubernetes.io/part-of: virtengine-platform
        virtengine.com/signer-mode: remote-tmkms
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "26660"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: virtengine-validator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        role: validator
        virtengine.com/chain: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: validator
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: virtengine-validator
                  app.kubernetes.io/component: validator
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: virtengine-validator
              app.kubernetes.io/component: validator
      initContainers:
        - name: init-config
          image: ghcr.io/virtengine/virtengine-node@sha256:9f0f3a2d8d3d8ea6ef2a72e0b23fdc05ad7c4e50af92757f6c61ef2f86d85c01
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              required="CHAIN_ID MONIKER VALIDATOR_ADDRESS VALIDATOR_KEY_FINGERPRINT VALIDATOR_SIGNER_ENDPOINT VALIDATOR_SIGNER_EPOCH VALIDATOR_SIGNER_FENCING_TOKEN TMKMS_CONFIG_SHA256 TMKMS_SIGNER_CERT_SHA256"
              for name in $required; do
                eval value="\${$name:-}"
                if [ -z "$value" ]; then
                  echo "missing required validator signer metadata: $name" >&2
                  exit 1
                fi
              done
              case "$VALIDATOR_ADDRESS" in
                virtenginevaloper1*|vevaloper1*) ;;
                *) echo "VALIDATOR_ADDRESS is not a VirtEngine validator address" >&2; exit 1 ;;
              esac
              for digest in "$VALIDATOR_KEY_FINGERPRINT" "$TMKMS_CONFIG_SHA256" "$TMKMS_SIGNER_CERT_SHA256"; do
                case "$digest" in
                  *[!0-9a-fA-F]* ) echo "validator/TMKMS fingerprints must be hexadecimal" >&2; exit 1 ;;
                esac
                if [ "${#digest}" -ne 64 ]; then
                  echo "validator/TMKMS fingerprints must be SHA-256 digests" >&2
                  exit 1
                fi
              done
              case "$VALIDATOR_SIGNER_EPOCH:$VALIDATOR_SIGNER_FENCING_TOKEN" in
                *[!0-9:]*|0:*|*:0) echo "signer epoch and fencing token must be positive integers" >&2; exit 1 ;;
              esac
              case "$VALIDATOR_SIGNER_ENDPOINT" in
                tcp://*|grpc://*|https://*) ;;
                *) echo "VALIDATOR_SIGNER_ENDPOINT must use tcp://, grpc://, or https://" >&2; exit 1 ;;
              esac
              mkdir -p /data/config /data/data
              if [ ! -f /data/config/config.toml ]; then
                virtengine init "$MONIKER" --chain-id "$CHAIN_ID" --home /data
              fi
          envFrom:
            - configMapRef:
                name: virtengine-config
          env:
            - name: VALIDATOR_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: validator-address
            - name: VALIDATOR_KEY_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: validator-key-fingerprint
            - name: VALIDATOR_SIGNER_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: signer-endpoint
            - name: VALIDATOR_SIGNER_EPOCH
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: signer-epoch
            - name: VALIDATOR_SIGNER_FENCING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: signer-fencing-token
            - name: TMKMS_CONFIG_SHA256
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: tmkms-config-sha256
            - name: TMKMS_SIGNER_CERT_SHA256
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: signer-cert-sha256
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      containers:
        - name: virtengine-validator
          image: ghcr.io/virtengine/virtengine-node@sha256:9f0f3a2d8d3d8ea6ef2a72e0b23fdc05ad7c4e50af92757f6c61ef2f86d85c01
          imagePullPolicy: IfNotPresent
          command: ["virtengine"]
          args:
            - start
            - --home=/data
            - --log_level=$(LOG_LEVEL)
            - --log_format=$(LOG_FORMAT)
            - --p2p.laddr=tcp://0.0.0.0:$(P2P_PORT)
            - --rpc.laddr=tcp://0.0.0.0:$(RPC_PORT)
            - --grpc.address=0.0.0.0:$(GRPC_PORT)
            - --grpc-web.address=0.0.0.0:$(GRPC_WEB_PORT)
            - --api.address=tcp://0.0.0.0:$(REST_PORT)
            - --api.enable=$(API_ENABLE)
            - --telemetry.enabled=$(TELEMETRY_ENABLED)
            - --priv_validator_laddr=$(VALIDATOR_SIGNER_ENDPOINT)
          envFrom:
            - configMapRef:
                name: virtengine-config
          env:
            - name: VALIDATOR_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: validator-address
            - name: VALIDATOR_KEY_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: validator-key-fingerprint
            - name: VALIDATOR_SIGNER_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: signer-endpoint
            - name: VALIDATOR_SIGNER_EPOCH
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: signer-epoch
            - name: VALIDATOR_SIGNER_FENCING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: signer-fencing-token
            - name: TMKMS_CONFIG_SHA256
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: tmkms-config-sha256
            - name: TMKMS_SIGNER_CERT_SHA256
              valueFrom:
                secretKeyRef:
                  name: validator-signer-identity
                  key: signer-cert-sha256
          ports:
            - name: p2p
              containerPort: 26656
              protocol: TCP
            - name: rpc
              containerPort: 26657
              protocol: TCP
            - name: rest
              containerPort: 1317
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: grpc-web
              containerPort: 9091
              protocol: TCP
            - name: prometheus
              containerPort: 26660
              protocol: TCP
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
            limits:
              cpu: "4000m"
              memory: "16Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -n "$CHAIN_ID" && test -n "$VALIDATOR_ADDRESS" && test -n "$VALIDATOR_KEY_FINGERPRINT"
                  test -n "$VALIDATOR_SIGNER_EPOCH" && test -n "$VALIDATOR_SIGNER_FENCING_TOKEN"
                  test -n "$TMKMS_CONFIG_SHA256" && test -n "$TMKMS_SIGNER_CERT_SHA256"
                  endpoint="${VALIDATOR_SIGNER_ENDPOINT#*://}"; host="${endpoint%:*}"; port="${endpoint##*:}"
                  test -n "$host" && test -n "$port"
                  (echo >/dev/tcp/$host/$port) >/dev/null 2>&1
                  wget -qO- http://127.0.0.1:26657/status | grep -q "\"network\":\"$CHAIN_ID\""
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -n "$VALIDATOR_SIGNER_ENDPOINT" && wget -qO- http://127.0.0.1:26657/status | grep -q "\"network\":\"$CHAIN_ID\""
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      terminationGracePeriodSeconds: 120
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: virtengine-validator
          app.kubernetes.io/component: validator
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 1Ti
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: virtengine-node
  namespace: virtengine
  labels:
    app.kubernetes.io/name: virtengine-node
    app.kubernetes.io/component: sentry
    app.kubernetes.io/part-of: virtengine-platform
  annotations:
    reloader.stakater.com/auto: "true"
    virtengine.com/validator-identity: "none"
spec:
  serviceName: virtengine-node-headless
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: virtengine-node
      app.kubernetes.io/component: sentry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: virtengine-node
        app.kubernetes.io/component: sentry
        app.kubernetes.io/part-of: virtengine-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "26660"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: virtengine-node
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        role: chain-sentry
        virtengine.com/chain: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: virtengine-node
                    app.kubernetes.io/component: sentry
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: virtengine-node
              app.kubernetes.io/component: sentry
      initContainers:
        - name: init-config
          image: ghcr.io/virtengine/virtengine-node@sha256:9f0f3a2d8d3d8ea6ef2a72e0b23fdc05ad7c4e50af92757f6c61ef2f86d85c01
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /data/config /data/data
              if [ ! -f /data/config/config.toml ]; then
                virtengine init "$MONIKER" --chain-id "$CHAIN_ID" --home /data
              fi
          envFrom:
            - configMapRef:
                name: virtengine-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      containers:
        - name: virtengine-node
          image: ghcr.io/virtengine/virtengine-node@sha256:9f0f3a2d8d3d8ea6ef2a72e0b23fdc05ad7c4e50af92757f6c61ef2f86d85c01
          imagePullPolicy: IfNotPresent
          command: ["virtengine"]
          args:
            - start
            - --home=/data
            - --log_level=$(LOG_LEVEL)
            - --log_format=$(LOG_FORMAT)
            - --p2p.laddr=tcp://0.0.0.0:$(P2P_PORT)
            - --rpc.laddr=tcp://0.0.0.0:$(RPC_PORT)
            - --grpc.address=0.0.0.0:$(GRPC_PORT)
            - --grpc-web.address=0.0.0.0:$(GRPC_WEB_PORT)
            - --api.address=tcp://0.0.0.0:$(REST_PORT)
            - --api.enable=$(API_ENABLE)
            - --telemetry.enabled=$(TELEMETRY_ENABLED)
          envFrom:
            - configMapRef:
                name: virtengine-config
          ports:
            - name: p2p
              containerPort: 26656
              protocol: TCP
            - name: rpc
              containerPort: 26657
              protocol: TCP
            - name: rest
              containerPort: 1317
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: grpc-web
              containerPort: 9091
              protocol: TCP
            - name: prometheus
              containerPort: 26660
              protocol: TCP
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status
              port: rpc
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /status
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: virtengine-node
          app.kubernetes.io/component: sentry
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 500Gi
