# Staging Environment Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: virtengine

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  # Staging replicas
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: provider-daemon
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # Moderate resources
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "4Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "3000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "6Gi"
  - target:
      kind: ExternalSecret
      name: virtengine-node-secrets
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: secret/virtengine/staging/virtengine-node
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: secret/virtengine/staging/virtengine-node
  - target:
      kind: ExternalSecret
      name: provider-daemon-secrets
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: secret/virtengine/staging/provider-daemon
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: secret/virtengine/staging/provider-daemon
  - target:
      kind: ExternalSecret
      name: database-credentials
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: secret/virtengine/staging/database
  - target:
      kind: ConfigMap
      name: virtengine-config
    patch: |
      - op: replace
        path: /data/CHAIN_ID
        value: virtengine-staging-1
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      - op: replace
        path: /data/API_SWAGGER
        value: "false"

images:
  - name: virtengine/virtengine-node
    newTag: staging
  - name: virtengine/provider-daemon
    newTag: staging
