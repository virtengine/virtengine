# Development Environment Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: virtengine

resources:
  - ../../base

commonLabels:
  environment: dev

# Patches for dev environment
patches:
  # Reduce replicas for dev
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: provider-daemon
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Reduce resources for dev
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
  # Remove node selectors for dev
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: remove
        path: /spec/template/spec/tolerations
  - target:
      kind: Deployment
      name: provider-daemon
    patch: |
      - op: remove
        path: /spec/template/spec/nodeSelector
  # Update PDB for single instance
  - target:
      kind: PodDisruptionBudget
      name: virtengine-node-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: ExternalSecret
      name: virtengine-node-secrets
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: secret/virtengine/dev/virtengine-node
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: secret/virtengine/dev/virtengine-node
  - target:
      kind: ExternalSecret
      name: provider-daemon-secrets
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: secret/virtengine/dev/provider-daemon
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: secret/virtengine/dev/provider-daemon
  - target:
      kind: ExternalSecret
      name: database-credentials
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: secret/virtengine/dev/database
  - target:
      kind: ConfigMap
      name: virtengine-config
    patch: |
      - op: replace
        path: /data/CHAIN_ID
        value: virtengine-dev-1
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      - op: replace
        path: /data/API_SWAGGER
        value: "true"

images:
  - name: virtengine/virtengine-node
    newTag: dev
  - name: virtengine/provider-daemon
    newTag: dev
