# Development Environment Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: virtengine

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
    includeSelectors: true

patches:
  - target:
      kind: StatefulSet
      name: virtengine-validator
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: remove
        path: /spec/template/spec/tolerations
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
  - target:
      kind: StatefulSet
      name: provider-daemon
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/nodeSelector
  - target:
      kind: PodDisruptionBudget
      name: virtengine-validator-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: PodDisruptionBudget
      name: virtengine-node-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: PodDisruptionBudget
      name: provider-daemon-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: ConfigMap
      name: virtengine-config
    patch: |
      - op: replace
        path: /data/CHAIN_ID
        value: virtengine-dev-1
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      - op: replace
        path: /data/API_SWAGGER
        value: "true"
  - target:
      kind: ConfigMap
      name: provider-daemon-config
    patch: |
      - op: replace
        path: /data/CHAIN_ID
        value: virtengine-dev-1
  - target:
      kind: HorizontalPodAutoscaler
      name: provider-daemon-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
