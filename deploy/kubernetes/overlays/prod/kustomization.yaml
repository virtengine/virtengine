# Production Environment Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: virtengine

resources:
  - ../../base
  - blue-green-service.yaml
  - hpa-enhanced.yaml
  - keda-scaledobject.yaml

labels:
  - pairs:
      environment: prod
    includeSelectors: true

commonAnnotations:
  sidecar.istio.io/inject: "true"

patches:
  - target:
      kind: StatefulSet
      name: virtengine-validator
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "8Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "16Gi"
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Ti
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "8Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "16Gi"
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Ti
  - target:
      kind: StatefulSet
      name: provider-daemon
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "3000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"
  - target:
      kind: PersistentVolumeClaim
      name: provider-data
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 200Gi
  - target:
      kind: PersistentVolumeClaim
      name: provider-ha-state
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 200Gi
  - target:
      kind: PersistentVolumeClaim
      name: provider-backups
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 200Gi
  - target:
      kind: ExternalSecret
      name: validator-signer-identity
    patch: |
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: validator-signer-identity
      spec:
        data:
          - secretKey: validator-address
            remoteRef:
              key: secret/virtengine/prod/validator-signer
              property: validator-address
          - secretKey: validator-key-fingerprint
            remoteRef:
              key: secret/virtengine/prod/validator-signer
              property: validator-key-fingerprint
          - secretKey: signer-endpoint
            remoteRef:
              key: secret/virtengine/prod/validator-signer
              property: signer-endpoint
          - secretKey: signer-epoch
            remoteRef:
              key: secret/virtengine/prod/validator-signer
              property: signer-epoch
          - secretKey: signer-fencing-token
            remoteRef:
              key: secret/virtengine/prod/validator-signer
              property: signer-fencing-token
          - secretKey: tmkms-config-sha256
            remoteRef:
              key: secret/virtengine/prod/validator-signer
              property: tmkms-config-sha256
          - secretKey: signer-cert-sha256
            remoteRef:
              key: secret/virtengine/prod/validator-signer
              property: signer-cert-sha256
  - target:
      kind: ExternalSecret
      name: provider-daemon-secrets
    patch: |
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: provider-daemon-secrets
      spec:
        data:
          - secretKey: provider-address
            remoteRef:
              key: secret/virtengine/prod/provider-daemon
              property: provider-address
          - secretKey: provider-key-fingerprint
            remoteRef:
              key: secret/virtengine/prod/provider-daemon
              property: provider-key-fingerprint
          - secretKey: provider-key-passphrase
            remoteRef:
              key: secret/virtengine/prod/provider-daemon
              property: provider-key-passphrase
          - secretKey: provider-key-backup-passphrase
            remoteRef:
              key: secret/virtengine/prod/provider-daemon
              property: provider-key-backup-passphrase
          - secretKey: waldur-chain-keyring-passphrase
            remoteRef:
              key: secret/virtengine/prod/provider-daemon
              property: waldur-chain-keyring-passphrase
          - secretKey: portal-auth-secret
            remoteRef:
              key: secret/virtengine/prod/provider-daemon
              property: portal-auth-secret
  - target:
      kind: ExternalSecret
      name: database-credentials
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: secret/virtengine/prod/database
  - target:
      kind: PodDisruptionBudget
      name: virtengine-validator-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: virtengine-node-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 3
  - target:
      kind: PodDisruptionBudget
      name: provider-daemon-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: provider-daemon-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: ConfigMap
      name: virtengine-config
    patch: |
      - op: replace
        path: /data/CHAIN_ID
        value: virtengine-1
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      - op: replace
        path: /data/API_SWAGGER
        value: "false"
      - op: replace
        path: /data/PRUNING
        value: custom
      - op: replace
        path: /data/PRUNING_KEEP_RECENT
        value: "1000"
      - op: replace
        path: /data/PRUNING_INTERVAL
        value: "100"
  - target:
      kind: ConfigMap
      name: provider-daemon-config
    patch: |
      - op: replace
        path: /data/CHAIN_ID
        value: virtengine-1
      - op: replace
        path: /data/LOG_LEVEL
        value: info
  - target:
      kind: Deployment
      name: tee-enclave
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"
