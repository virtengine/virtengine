# Production Environment Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: virtengine

resources:
  - ../../base
  - blue-green-service.yaml
  - hpa-enhanced.yaml
  - keda-scaledobject.yaml

commonLabels:
  environment: prod

commonAnnotations:
  # Production-specific annotations
  sidecar.istio.io/inject: "true"

patches:
  # Production replicas
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: Deployment
      name: provider-daemon
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  # Production resources
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "8Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "16Gi"
  - target:
      kind: Deployment
      name: provider-daemon
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "3000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"
  # Storage for production
  - target:
      kind: StatefulSet
      name: virtengine-node
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Ti
  - target:
      kind: ExternalSecret
      name: virtengine-node-secrets
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: secret/virtengine/prod/virtengine-node
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: secret/virtengine/prod/virtengine-node
  - target:
      kind: ExternalSecret
      name: provider-daemon-secrets
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: secret/virtengine/prod/provider-daemon
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: secret/virtengine/prod/provider-daemon
  - target:
      kind: ExternalSecret
      name: database-credentials
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: secret/virtengine/prod/database
  # PDB for production
  - target:
      kind: PodDisruptionBudget
      name: virtengine-node-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 3
  - target:
      kind: PodDisruptionBudget
      name: provider-daemon-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 2
  # HPA for production
  - target:
      kind: HorizontalPodAutoscaler
      name: provider-daemon-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: ConfigMap
      name: virtengine-config
    patch: |
      - op: replace
        path: /data/CHAIN_ID
        value: virtengine-1
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      - op: replace
        path: /data/API_SWAGGER
        value: "false"
      - op: replace
        path: /data/PRUNING
        value: custom
      - op: replace
        path: /data/PRUNING_KEEP_RECENT
        value: "1000"
      - op: replace
        path: /data/PRUNING_INTERVAL
        value: "100"
  - target:
      kind: Deployment
      name: tee-enclave
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"

images:
  - name: virtengine/virtengine-node
    newTag: v1.0.0  # Pin to specific version in prod
  - name: virtengine/provider-daemon
    newTag: v1.0.0
  - name: virtengine/tee-enclave
    newTag: v1.0.0  # TEE-HW-001: Production TEE enclave
