{{- if .Values.munge.enabled }}
{{- $_ := required "munge.existingSecret is required when munge.enabled=true; provision the Secret before installing" .Values.munge.existingSecret -}}
{{- $_ := required "munge.secretKeyName is required when munge.enabled=true" .Values.munge.secretKeyName -}}
{{- end }}
{{- if .Values.database.enabled }}
{{- $_ := required "database.config.existingSecret is required when database.enabled=true; provision the Secret before installing" .Values.database.config.existingSecret -}}
{{- $_ := required "database.config.secretPasswordKey is required when database.enabled=true" .Values.database.config.secretPasswordKey -}}
{{- end }}
{{- if .Values.mariadb.enabled }}
{{- $_ := required "mariadb.existingSecret is required when mariadb.enabled=true; provision the Secret before installing" .Values.mariadb.existingSecret -}}
{{- $_ := required "mariadb.secretRootPasswordKey is required when mariadb.enabled=true" .Values.mariadb.secretRootPasswordKey -}}
{{- end }}
{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.tls.enabled }}
{{- $_ := required "nodeAgent.tls.existingSecret is required when nodeAgent TLS is enabled; provision the Secret before installing" .Values.nodeAgent.tls.existingSecret -}}
{{- $_ := required "nodeAgent.tls.caCertKey is required when nodeAgent TLS is enabled" .Values.nodeAgent.tls.caCertKey -}}
{{- $_ := required "nodeAgent.tls.clientCertKey is required when nodeAgent TLS is enabled" .Values.nodeAgent.tls.clientCertKey -}}
{{- $_ := required "nodeAgent.tls.clientKeyKey is required when nodeAgent TLS is enabled" .Values.nodeAgent.tls.clientKeyKey -}}
{{- end }}
