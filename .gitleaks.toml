title = "VirtEngine Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key assignments outside controlled fixtures"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?token)\s*[:=]\s*['"]([A-Za-z0-9._-]{16,})['"]'''
[rules.allowlist]
paths = [
  '''(^|/)(testdata|fixtures|__snapshots__)/''',
  '''(^|/).*_test\.go$''',
  '''(^|/).*\.(spec|test)\.(ts|js)$''',
  '''(^|/).+\.golden$''',
  '''(^|/).+\.snap$''',
]
description = "Fixture and test-only API key samples"

[[rules]]
id = "fixture-private-key"
description = "Private keys allowed only in dedicated fixtures"
regex = '''-----BEGIN(?: [A-Z]+)? PRIVATE KEY-----'''
[rules.allowlist]
paths = [
  '''(^|/)(testdata|fixtures)/''',
  '''(^|/).*_test\.go$''',
]
description = "Controlled fixture material"

[allowlist]
paths = [
  '''(^|/)\.bosun/worktrees/''',
  '''(^|/)vendor/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.git/''',
  '''(^|/)\.cache/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)\.venv/''',
  '''(^|/)output/''',
  '''(^|/)(testdata|fixtures|__snapshots__)/''',
  '''(^|/).+\.golden$''',
  '''(^|/).+\.snap$''',
  '''(^|/).*_test\.go$''',
  '''(^|/).*\.(spec|test)\.(ts|js)$''',
  '''(^|/).+\.env\.example$''',
  '''(^|/)_docs/api-gateway\.md$''',
  '''(^|/)docs/api/guides/authentication\.md$''',
  '''(^|/)docs/api/guides/getting-started\.md$''',
  '''(^|/)docs/RATELIMIT_CLIENT_GUIDE\.md$''',
  '''(^|/)_docs/training/labs/security-assessment-lab\.md$''',
]
regexes = [
  '''\bexample([_-]?(api|secret|token|key))\b''',
  '''\b(sample|placeholder|dummy|fake|test)[-_ ]?(secret|token|key)\b''',
  '''\b(sk|pk)_test_[A-Za-z0-9]+\b''',
]
stopwords = [
  "example",
  "sample",
  "placeholder",
  "dummy",
  "fake",
  "redacted",
  "test",
  "your-key-here",
]
