syntax = "proto3";
package virtengine.resources.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "virtengine/resources/v1/types.proto";

option go_package = "github.com/virtengine/virtengine/sdk/go/node/resources/v1";

// Query defines the gRPC querier service for the resources module.
service Query {
  // AvailableResources returns eligible inventories for a request.
  rpc AvailableResources(QueryAvailableResourcesRequest) returns (QueryAvailableResourcesResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/availability";
  }

  // Allocation returns an allocation by ID.
  rpc Allocation(QueryAllocationRequest) returns (QueryAllocationResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/allocation/{allocation_id}";
  }

  // AllocationHistory returns lifecycle events for an allocation.
  rpc AllocationHistory(QueryAllocationHistoryRequest) returns (QueryAllocationHistoryResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/allocation/{allocation_id}/history";
  }

  // AllocationsByProvider returns allocations for a provider.
  rpc AllocationsByProvider(QueryAllocationsByProviderRequest) returns (QueryAllocationsByProviderResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/allocations/provider/{provider_address}";
  }

  // Reservation returns a single reservation by its id.
  rpc Reservation(QueryReservationRequest) returns (QueryReservationResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/reservation/{reservation_id}";
  }

  // ReservationByOrder returns the reservation for an order.
  rpc ReservationByOrder(QueryReservationByOrderRequest) returns (QueryReservationByOrderResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/reservation/order/{order_id}";
  }

  // ReservationByBid returns the reservation for a bid.
  rpc ReservationByBid(QueryReservationByBidRequest) returns (QueryReservationByBidResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/reservation/bid/{bid_id}";
  }

  // ReservationByLease returns the reservation for a lease.
  rpc ReservationByLease(QueryReservationByLeaseRequest) returns (QueryReservationByLeaseResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/reservation/lease/{lease_id}";
  }

  // ReservationByJob returns the reservation for an HPC job.
  rpc ReservationByJob(QueryReservationByJobRequest) returns (QueryReservationByJobResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/reservation/job/{job_id}";
  }

  // ReservationByConsumer returns the reservation for a typed consumer.
  rpc ReservationByConsumer(QueryReservationByConsumerRequest) returns (QueryReservationByConsumerResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/reservation/consumer/{consumer_type}/{consumer_id}";
  }

  // ReservationsByProvider lists the reservations held by one provider.
  rpc ReservationsByProvider(QueryReservationsByProviderRequest) returns (QueryReservationsByProviderResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/reservations/provider/{provider_address}";
  }

  // ReservationLineage returns a reservation and its ordered event history.
  rpc ReservationLineage(QueryReservationLineageRequest) returns (QueryReservationLineageResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/reservation/{reservation_id}/lineage";
  }

  // Params returns module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/virtengine/resources/v1/params";
  }
}

message QueryAvailableResourcesRequest {
  ResourceRequest request = 1 [(gogoproto.nullable) = false, (gogoproto.jsontag) = "request", (gogoproto.moretags) = "yaml:\"request\""];
  cosmos.base.query.v1beta1.PageRequest pagination = 2 [(gogoproto.jsontag) = "pagination,omitempty", (gogoproto.moretags) = "yaml:\"pagination\""];
}

message AvailableResource {
  ResourceInventory inventory = 1 [(gogoproto.nullable) = false, (gogoproto.jsontag) = "inventory", (gogoproto.moretags) = "yaml:\"inventory\""];
  string score = 2 [(gogoproto.jsontag) = "score", (gogoproto.moretags) = "yaml:\"score\""];
}

message QueryAvailableResourcesResponse {
  repeated AvailableResource candidates = 1 [(gogoproto.nullable) = false, (gogoproto.jsontag) = "candidates", (gogoproto.moretags) = "yaml:\"candidates\""];
  cosmos.base.query.v1beta1.PageResponse pagination = 2 [(gogoproto.jsontag) = "pagination,omitempty", (gogoproto.moretags) = "yaml:\"pagination\""];
}

message QueryAllocationRequest {
  string allocation_id = 1 [(gogoproto.jsontag) = "allocation_id", (gogoproto.moretags) = "yaml:\"allocation_id\""];
}

message QueryAllocationResponse {
  ResourceAllocation allocation = 1 [(gogoproto.nullable) = false, (gogoproto.jsontag) = "allocation", (gogoproto.moretags) = "yaml:\"allocation\""];
}

message QueryAllocationHistoryRequest {
  string allocation_id = 1 [(gogoproto.jsontag) = "allocation_id", (gogoproto.moretags) = "yaml:\"allocation_id\""];
  cosmos.base.query.v1beta1.PageRequest pagination = 2 [(gogoproto.jsontag) = "pagination,omitempty", (gogoproto.moretags) = "yaml:\"pagination\""];
}

message QueryAllocationHistoryResponse {
  repeated AllocationEvent events = 1 [(gogoproto.nullable) = false, (gogoproto.jsontag) = "events", (gogoproto.moretags) = "yaml:\"events\""];
  cosmos.base.query.v1beta1.PageResponse pagination = 2 [(gogoproto.jsontag) = "pagination,omitempty", (gogoproto.moretags) = "yaml:\"pagination\""];
}

message QueryAllocationsByProviderRequest {
  string provider_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString", (gogoproto.jsontag) = "provider_address", (gogoproto.moretags) = "yaml:\"provider_address\""];
  cosmos.base.query.v1beta1.PageRequest pagination = 2 [(gogoproto.jsontag) = "pagination,omitempty", (gogoproto.moretags) = "yaml:\"pagination\""];
}

message QueryAllocationsByProviderResponse {
  repeated ResourceAllocation allocations = 1 [(gogoproto.nullable) = false, (gogoproto.jsontag) = "allocations", (gogoproto.moretags) = "yaml:\"allocations\""];
  cosmos.base.query.v1beta1.PageResponse pagination = 2 [(gogoproto.jsontag) = "pagination,omitempty", (gogoproto.moretags) = "yaml:\"pagination\""];
}

message QueryReservationRequest { string reservation_id = 1; }
message QueryReservationByOrderRequest { string order_id = 1; }
message QueryReservationByBidRequest { string bid_id = 1; }
message QueryReservationByLeaseRequest { string lease_id = 1; }
message QueryReservationByJobRequest { string job_id = 1; }
message QueryReservationByConsumerRequest {
  string consumer_type = 1;
  string consumer_id = 2;
}
message QueryReservationsByProviderRequest {
  string provider_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
// QueryReservationResponse is the response for the Reservation RPC.
message QueryReservationResponse {
  Reservation reservation = 1 [(gogoproto.nullable) = false];
}
// QueryReservationByOrderResponse is the response for the ReservationByOrder RPC.
// Field layout is identical to QueryReservationResponse so the wire encoding of
// an existing client is unchanged.
message QueryReservationByOrderResponse {
  Reservation reservation = 1 [(gogoproto.nullable) = false];
}
// QueryReservationByBidResponse is the response for the ReservationByBid RPC.
message QueryReservationByBidResponse {
  Reservation reservation = 1 [(gogoproto.nullable) = false];
}
// QueryReservationByLeaseResponse is the response for the ReservationByLease RPC.
message QueryReservationByLeaseResponse {
  Reservation reservation = 1 [(gogoproto.nullable) = false];
}
// QueryReservationByJobResponse is the response for the ReservationByJob RPC.
message QueryReservationByJobResponse {
  Reservation reservation = 1 [(gogoproto.nullable) = false];
}
// QueryReservationByConsumerResponse is the response for the ReservationByConsumer RPC.
message QueryReservationByConsumerResponse {
  Reservation reservation = 1 [(gogoproto.nullable) = false];
}
// QueryReservationsByProviderResponse is the response for the ReservationsByProvider RPC.
message QueryReservationsByProviderResponse {
  repeated Reservation reservations = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryReservationsResponse is the legacy shared response for the
// reservation list RPCs.
//
// Deprecated: no RPC returns this type any more. ReservationsByProvider now
// returns QueryReservationsByProviderResponse, whose field layout is identical,
// so the encoded bytes are unchanged. It is retained only so existing Go and
// TypeScript clients keep compiling against it.
message QueryReservationsResponse {
  repeated Reservation reservations = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
message QueryReservationLineageRequest {
  string reservation_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryReservationLineageResponse {
  Reservation reservation = 1 [(gogoproto.nullable) = false];
  repeated ReservationEvent events = 2 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 3;
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false, (gogoproto.jsontag) = "params", (gogoproto.moretags) = "yaml:\"params\""];
}
