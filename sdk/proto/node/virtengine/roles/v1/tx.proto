syntax = "proto3";
package virtengine.roles.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "virtengine/roles/v1/types.proto";
import "virtengine/mfa/v1/types.proto";

option go_package = "github.com/virtengine/virtengine/sdk/go/node/roles/v1";

// Msg defines the roles Msg service
service Msg {
  option (cosmos.msg.v1.service) = true;

  // AssignRole assigns a role to an account
  rpc AssignRole(MsgAssignRole) returns (MsgAssignRoleResponse);

  // RevokeRole revokes a role from an account
  rpc RevokeRole(MsgRevokeRole) returns (MsgRevokeRoleResponse);

  // SetAccountState sets the state of an account
  rpc SetAccountState(MsgSetAccountState) returns (MsgSetAccountStateResponse);

  // NominateAdmin nominates an administrator (GenesisAccount only)
  rpc NominateAdmin(MsgNominateAdmin) returns (MsgNominateAdminResponse);

  // UpdateParams updates the module parameters (governance only)
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // ImposeSanction records a scoped, time-limited sanction against an account
  rpc ImposeSanction(MsgImposeSanction) returns (MsgImposeSanctionResponse);

  // ConfirmSanction applies a pending sanction as its second, distinct reviewer
  rpc ConfirmSanction(MsgConfirmSanction) returns (MsgConfirmSanctionResponse);

  // RevokeSanction clears an in-force or pending sanction
  rpc RevokeSanction(MsgRevokeSanction) returns (MsgRevokeSanctionResponse);

  // OpenSanctionAppeal opens an appeal against an in-force sanction
  rpc OpenSanctionAppeal(MsgOpenSanctionAppeal) returns (MsgOpenSanctionAppealResponse);

  // ResolveSanctionAppeal resolves an open appeal
  rpc ResolveSanctionAppeal(MsgResolveSanctionAppeal) returns (MsgResolveSanctionAppealResponse);
}

// MsgAssignRole is the message for assigning a role to an account
message MsgAssignRole {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "roles/MsgAssignRole";

  // Sender is the account assigning the role
  string sender = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "sender",
    (gogoproto.moretags) = "yaml:\"sender\""
  ];

  // Address is the target account to receive the role
  string address = 2 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "address",
    (gogoproto.moretags) = "yaml:\"address\""
  ];

  // Role is the role to assign
  string role = 3 [
    (gogoproto.jsontag) = "role",
    (gogoproto.moretags) = "yaml:\"role\""
  ];
}

// MsgAssignRoleResponse is the response for MsgAssignRole
message MsgAssignRoleResponse {}

// MsgRevokeRole is the message for revoking a role from an account
message MsgRevokeRole {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "roles/MsgRevokeRole";

  // Sender is the account revoking the role
  string sender = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "sender",
    (gogoproto.moretags) = "yaml:\"sender\""
  ];

  // Address is the target account to lose the role
  string address = 2 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "address",
    (gogoproto.moretags) = "yaml:\"address\""
  ];

  // Role is the role to revoke
  string role = 3 [
    (gogoproto.jsontag) = "role",
    (gogoproto.moretags) = "yaml:\"role\""
  ];
}

// MsgRevokeRoleResponse is the response for MsgRevokeRole
message MsgRevokeRoleResponse {}

// MsgSetAccountState is the message for setting an account's state
message MsgSetAccountState {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "roles/MsgSetAccountState";

  // Sender is the account setting the state
  string sender = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "sender",
    (gogoproto.moretags) = "yaml:\"sender\""
  ];

  // Address is the target account whose state is being set
  string address = 2 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "address",
    (gogoproto.moretags) = "yaml:\"address\""
  ];

  // State is the new state for the account
  string state = 3 [
    (gogoproto.jsontag) = "state",
    (gogoproto.moretags) = "yaml:\"state\""
  ];

  // Reason is the reason for the state change
  string reason = 4 [
    (gogoproto.jsontag) = "reason",
    (gogoproto.moretags) = "yaml:\"reason\""
  ];

  // MFAProof is optional proof of MFA for sensitive account recovery operations
  virtengine.mfa.v1.MFAProof mfa_proof = 5 [
    (gogoproto.jsontag) = "mfa_proof,omitempty",
    (gogoproto.moretags) = "yaml:\"mfa_proof\""
  ];

  // DeviceFingerprint is the optional client device fingerprint
  string device_fingerprint = 6 [
    (gogoproto.jsontag) = "device_fingerprint,omitempty",
    (gogoproto.moretags) = "yaml:\"device_fingerprint\""
  ];
}

// MsgSetAccountStateResponse is the response for MsgSetAccountState
message MsgSetAccountStateResponse {}

// MsgNominateAdmin is the message for nominating an administrator (GenesisAccount only)
message MsgNominateAdmin {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "roles/MsgNominateAdmin";

  // Sender is the genesis account making the nomination
  string sender = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "sender",
    (gogoproto.moretags) = "yaml:\"sender\""
  ];

  // Address is the account to be nominated as administrator
  string address = 2 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "address",
    (gogoproto.moretags) = "yaml:\"address\""
  ];
}

// MsgNominateAdminResponse is the response for MsgNominateAdmin
message MsgNominateAdminResponse {}

// MsgUpdateParams is the message for updating module parameters
message MsgUpdateParams {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "roles/MsgUpdateParams";

  // Authority is the address that controls the module (x/gov module account)
  string authority = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "authority",
    (gogoproto.moretags) = "yaml:\"authority\""
  ];

  // Params are the new module parameters
  Params params = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "params",
    (gogoproto.moretags) = "yaml:\"params\""
  ];
}

// MsgUpdateParamsResponse is the response for MsgUpdateParams
message MsgUpdateParamsResponse {}

// MsgImposeSanction records a scoped, time-limited sanction against an account.
//
// A suspension or termination it proposes does not take effect on this message:
// it is recorded pending review and a second, distinct moderator-or-above must
// confirm it via MsgConfirmSanction. An emergency hold binds immediately but
// expires unless confirmed within its window.
message MsgImposeSanction {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "roles/MsgImposeSanction";

  // Sender is the moderator imposing the sanction
  string sender = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "sender",
    (gogoproto.moretags) = "yaml:\"sender\""
  ];

  // Subject is the account being sanctioned
  string subject = 2 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "subject",
    (gogoproto.moretags) = "yaml:\"subject\""
  ];

  // Scope is the breadth of the sanction (account, order, listing, provider_offerings)
  string scope = 3 [
    (gogoproto.jsontag) = "scope",
    (gogoproto.moretags) = "yaml:\"scope\""
  ];

  // ScopeRef is the order/listing ID for ref-bearing scopes
  string scope_ref = 4 [
    (gogoproto.jsontag) = "scope_ref,omitempty",
    (gogoproto.moretags) = "yaml:\"scope_ref\""
  ];

  // Kind is the severity class (warning, emergency_hold, suspension, termination)
  string kind = 5 [
    (gogoproto.jsontag) = "kind",
    (gogoproto.moretags) = "yaml:\"kind\""
  ];

  // ReasonCode is the machine-classifiable reason
  string reason_code = 6 [
    (gogoproto.jsontag) = "reason_code",
    (gogoproto.moretags) = "yaml:\"reason_code\""
  ];

  // Justification is the free-text basis for the action
  string justification = 7 [
    (gogoproto.jsontag) = "justification",
    (gogoproto.moretags) = "yaml:\"justification\""
  ];

  // Notice is the text served on the sanctioned party
  string notice = 8 [
    (gogoproto.jsontag) = "notice,omitempty",
    (gogoproto.moretags) = "yaml:\"notice\""
  ];

  // DurationSeconds is the requested duration; zero means the kind's default.
  // Required for a suspension, and meaningless for a termination.
  int64 duration_seconds = 9 [
    (gogoproto.jsontag) = "duration_seconds,omitempty",
    (gogoproto.moretags) = "yaml:\"duration_seconds\""
  ];
}

// MsgImposeSanctionResponse is the response for MsgImposeSanction
message MsgImposeSanctionResponse {
  // SanctionID is the ID of the recorded sanction record
  string sanction_id = 1 [
    (gogoproto.jsontag) = "sanction_id",
    (gogoproto.moretags) = "yaml:\"sanction_id\""
  ];

  // Status is the recorded status; "pending_review" means no effect yet
  string status = 2 [
    (gogoproto.jsontag) = "status",
    (gogoproto.moretags) = "yaml:\"status\""
  ];
}

// MsgConfirmSanction applies a pending sanction as its second, distinct reviewer
message MsgConfirmSanction {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "reviewer";
  option (amino.name) = "roles/MsgConfirmSanction";

  // Reviewer is the second, distinct moderator confirming the sanction
  string reviewer = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "reviewer",
    (gogoproto.moretags) = "yaml:\"reviewer\""
  ];

  // SanctionID is the pending sanction being confirmed
  string sanction_id = 2 [
    (gogoproto.jsontag) = "sanction_id",
    (gogoproto.moretags) = "yaml:\"sanction_id\""
  ];

  // ReviewedUntil is the Unix time the confirmed sanction should run to.
  // Required when confirming an emergency hold, which must be converted into a
  // reviewed time-limited sanction. Ignored for other kinds.
  int64 reviewed_until = 3 [
    (gogoproto.jsontag) = "reviewed_until,omitempty",
    (gogoproto.moretags) = "yaml:\"reviewed_until\""
  ];
}

// MsgConfirmSanctionResponse is the response for MsgConfirmSanction
message MsgConfirmSanctionResponse {}

// MsgRevokeSanction clears an in-force or pending sanction
message MsgRevokeSanction {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "roles/MsgRevokeSanction";

  // Sender is the moderator revoking the sanction
  string sender = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "sender",
    (gogoproto.moretags) = "yaml:\"sender\""
  ];

  // SanctionID is the sanction to revoke
  string sanction_id = 2 [
    (gogoproto.jsontag) = "sanction_id",
    (gogoproto.moretags) = "yaml:\"sanction_id\""
  ];

  // Reason is the free-text basis for the revocation
  string reason = 3 [
    (gogoproto.jsontag) = "reason",
    (gogoproto.moretags) = "yaml:\"reason\""
  ];
}

// MsgRevokeSanctionResponse is the response for MsgRevokeSanction
message MsgRevokeSanctionResponse {}

// MsgOpenSanctionAppeal opens an appeal against an in-force sanction
message MsgOpenSanctionAppeal {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "subject";
  option (amino.name) = "roles/MsgOpenSanctionAppeal";

  // Subject is the sanctioned party opening the appeal
  string subject = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "subject",
    (gogoproto.moretags) = "yaml:\"subject\""
  ];

  // SanctionID is the sanction being appealed
  string sanction_id = 2 [
    (gogoproto.jsontag) = "sanction_id",
    (gogoproto.moretags) = "yaml:\"sanction_id\""
  ];

  // Justification is the appellant's free-text basis
  string justification = 3 [
    (gogoproto.jsontag) = "justification",
    (gogoproto.moretags) = "yaml:\"justification\""
  ];
}

// MsgOpenSanctionAppealResponse is the response for MsgOpenSanctionAppeal
message MsgOpenSanctionAppealResponse {
  // AppealID is the ID of the recorded appeal record
  string appeal_id = 1 [
    (gogoproto.jsontag) = "appeal_id",
    (gogoproto.moretags) = "yaml:\"appeal_id\""
  ];
}

// MsgResolveSanctionAppeal resolves an open appeal
message MsgResolveSanctionAppeal {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "reviewer";
  option (amino.name) = "roles/MsgResolveSanctionAppeal";

  // Reviewer is the moderator deciding the appeal
  string reviewer = 1 [
    (cosmos_proto.scalar) = "cosmos.AddressString",
    (gogoproto.jsontag) = "reviewer",
    (gogoproto.moretags) = "yaml:\"reviewer\""
  ];

  // AppealID is the open appeal being resolved
  string appeal_id = 2 [
    (gogoproto.jsontag) = "appeal_id",
    (gogoproto.moretags) = "yaml:\"appeal_id\""
  ];

  // Grant reports whether the appeal is allowed, revoking the challenged sanction
  bool grant = 3 [
    (gogoproto.jsontag) = "grant",
    (gogoproto.moretags) = "yaml:\"grant\""
  ];

  // Notes are the reviewer's free-text reasoning
  string notes = 4 [
    (gogoproto.jsontag) = "notes",
    (gogoproto.moretags) = "yaml:\"notes\""
  ];
}

// MsgResolveSanctionAppealResponse is the response for MsgResolveSanctionAppeal
message MsgResolveSanctionAppealResponse {}
