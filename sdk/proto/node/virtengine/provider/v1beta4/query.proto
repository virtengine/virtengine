syntax = "proto3";
package virtengine.provider.v1beta4;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";

import "virtengine/provider/v1beta4/provider.proto";

option go_package = "github.com/virtengine/virtengine/sdk/go/node/provider/v1beta4";

// Query defines the gRPC querier service for the provider package.
service Query {
  // Providers queries providers
  rpc Providers(QueryProvidersRequest) returns (QueryProvidersResponse) {
    option (google.api.http).get = "/virtengine/provider/v1beta4/providers";
  }

  // Provider queries provider details
  rpc Provider(QueryProviderRequest) returns (QueryProviderResponse) {
    option (google.api.http).get = "/virtengine/provider/v1beta4/providers/{owner}";
  }

  rpc ProviderSigningKey(QueryProviderSigningKeyRequest) returns (QueryProviderSigningKeyResponse) {
    option (google.api.http).get = "/virtengine/provider/v1beta4/providers/{owner}/signing-keys/{epoch}";
  }

  rpc ProviderSigningKeyEpochs(QueryProviderSigningKeyEpochsRequest) returns (QueryProviderSigningKeyEpochsResponse) {
    option (google.api.http).get = "/virtengine/provider/v1beta4/providers/{owner}/signing-keys";
  }
}

// QueryProvidersRequest is request type for the Query/Providers RPC method
message QueryProvidersRequest {
  // Pagination is used to paginate the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryProvidersResponse is response type for the Query/Providers RPC method
message QueryProvidersResponse {
  // Providers is a list of providers on the network.
  repeated Provider providers = 1 [
    (gogoproto.nullable)     = false,
    (gogoproto.castrepeated) = "Providers"
  ];

  // Pagination contains the information about response pagination.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryProviderRequest is request type for the Query/Provider RPC method
message QueryProviderRequest {
  // Owner is the bech32 address of the account of the provider.
  // It is a string representing a valid account address.
  //
  // Example:
  //   "ve1..."
  string owner = 1;
}

// QueryProviderResponse is response type for the Query/Provider RPC method.
message QueryProviderResponse {
  // Provider holds the representation of a provider on the network.
  Provider provider = 1 [
    (gogoproto.nullable) = false
  ];
}

message ProviderSigningKeyRecord {
  bytes public_key = 1;
  string key_type = 2;
  string key_id = 3;
  uint64 epoch = 4;
  int64 activated_at_height = 5;
  int64 activated_at_unix = 6;
  int64 expires_at_height = 7;
  int64 expires_at_unix = 8;
  int64 retired_at_height = 9;
  int64 retired_at_unix = 10;
  int64 revoked_at_height = 11;
  int64 revoked_at_unix = 12;
  string previous_key_id = 13;
  uint32 rotation_count = 14;
}

message QueryProviderSigningKeyRequest {
  string owner = 1;
  string key_id = 2;
  uint64 epoch = 3;
}

message QueryProviderSigningKeyResponse {
  ProviderSigningKeyRecord key = 1 [(gogoproto.nullable) = false];
}

message QueryProviderSigningKeyEpochsRequest {
  string owner = 1;
}

message QueryProviderSigningKeyEpochsResponse {
  repeated ProviderSigningKeyRecord keys = 1 [(gogoproto.nullable) = false];
}
