syntax = "proto3";
package virtengine.settlement.v1;

import "google/api/annotations.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/base/query/v1beta1/pagination.proto";

option go_package = "github.com/virtengine/virtengine/sdk/go/node/settlement/v1";

// ReleaseCondition defines a condition that must be met for escrow release.
message ReleaseCondition {
  string type = 1;
  int64 unlock_after = 2;
  repeated string required_signers = 3;
  uint32 signature_threshold = 4;
  uint64 min_usage_units = 5;
  uint32 required_verification_score = 6;
  bool satisfied = 7;
  int64 satisfied_at = 8;
}

// EscrowAccount represents funds held in escrow for a marketplace order.
message EscrowAccount {
  string escrow_id = 1;
  string order_id = 2;
  string lease_id = 3;
  string depositor = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string recipient = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated cosmos.base.v1beta1.Coin amount = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin balance = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string state = 8;
  repeated ReleaseCondition conditions = 9 [(gogoproto.nullable) = false];
  int64 created_at = 10;
  int64 expires_at = 11;
  int64 activated_at = 12;
  int64 closed_at = 13;
  string closure_reason = 14;
  repeated cosmos.base.v1beta1.Coin total_settled = 15 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  uint32 settlement_count = 16;
  int64 block_height = 17;
}

// SettlementRecord represents a completed settlement for an order.
message SettlementRecord {
  string settlement_id = 1;
  string escrow_id = 2;
  string order_id = 3;
  string lease_id = 4;
  string provider = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string customer = 6 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated cosmos.base.v1beta1.Coin total_amount = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin provider_share = 8 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin platform_fee = 9 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin validator_fee = 10 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  int64 settled_at = 11;
  repeated string usage_record_ids = 12;
  uint64 total_usage_units = 13;
  int64 period_start = 14;
  int64 period_end = 15;
  int64 block_height = 16;
  string settlement_type = 17;
  bool is_final = 18;
}

// RawUsageMetrics contains exact integer deltas for one metering period.
message RawUsageMetrics {
  int64 cpu_milli_seconds = 1;
  int64 memory_byte_seconds = 2;
  int64 storage_byte_seconds = 3;
  int64 network_bytes_in = 4;
  int64 network_bytes_out = 5;
  int64 gpu_seconds = 6;
}

// UsageRecord represents a signed usage record from a provider.
message UsageRecord {
  string usage_id = 1;
  string order_id = 2;
  string lease_id = 3;
  string provider = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string customer = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 usage_units = 6;
  string usage_type = 7;
  int64 period_start = 8;
  int64 period_end = 9;
  cosmos.base.v1beta1.DecCoin unit_price = 10 [(gogoproto.nullable) = false];
  repeated cosmos.base.v1beta1.Coin total_cost = 11 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  bytes provider_signature = 12;
  bool customer_acknowledged = 13;
  bytes customer_signature = 14;
  bool settled = 15;
  string settlement_id = 16;
  int64 submitted_at = 17;
  int64 block_height = 18;
  map<string, string> metadata = 19;
  string allocation_id = 20;
  string chain_id = 21;
  RawUsageMetrics raw_metrics = 22;
  uint32 pricing_version = 23;
  uint32 formula_version = 24;
  uint32 model_version = 25;
  uint64 stream_sequence = 26;
  bytes nonce = 27;
  bytes idempotency_key = 28;
  uint64 provider_key_epoch = 29;
  string provider_key_id = 30;
  int64 issued_at_height = 31;
  int64 expires_at_height = 32;
  int64 issued_at_unix = 33;
  int64 expires_at_unix = 34;
  uint32 signature_version = 35;
  bytes usage_digest = 36;
  bool signature_verified = 37;
  string authentication_status = 38;
  bool legacy_unverified = 39;
  bytes customer_ack_replay_key = 40;
  int64 customer_ack_issued_at_height = 41;
  int64 customer_ack_expires_at_height = 42;
  int64 customer_ack_issued_at_unix = 43;
  int64 customer_ack_expires_at_unix = 44;
  uint32 customer_ack_signature_version = 45;
  bool signature_material_redacted = 46;
}

// UsageTypeSummary aggregates usage by type.
message UsageTypeSummary {
  string usage_type = 1;
  uint64 usage_units = 2;
  repeated cosmos.base.v1beta1.Coin total_cost = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

// UsageSummary provides aggregated usage information.
message UsageSummary {
  string provider = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string order_id = 2;
  int64 period_start = 3;
  int64 period_end = 4;
  uint64 total_usage_units = 5;
  repeated cosmos.base.v1beta1.Coin total_cost = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated UsageTypeSummary by_usage_type = 7 [(gogoproto.nullable) = false];
  int64 generated_at = 8;
  int64 block_height = 9;
  repeated string usage_record_ids = 10;
}

// RewardRecipient represents a single reward recipient.
message RewardRecipient {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated cosmos.base.v1beta1.Coin amount = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string reason = 3;
  uint64 usage_units = 4;
  uint32 verification_score = 5;
  string staking_weight = 6;
  string reference_id = 7;
}

// RewardDistribution represents a batch of rewards distributed.
message RewardDistribution {
  string distribution_id = 1;
  uint64 epoch_number = 2;
  repeated cosmos.base.v1beta1.Coin total_rewards = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated RewardRecipient recipients = 4 [(gogoproto.nullable) = false];
  string source = 5;
  int64 distributed_at = 6;
  int64 block_height = 7;
  repeated string reference_tx_hashes = 8;
  map<string, string> metadata = 9;
}

// RewardHistoryEntry represents a reward distribution entry for an address.
message RewardHistoryEntry {
  string distribution_id = 1;
  uint64 epoch_number = 2;
  string source = 3;
  repeated cosmos.base.v1beta1.Coin amount = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string reason = 5;
  uint64 usage_units = 6;
  string reference_id = 7;
  int64 distributed_at = 8;
}

// RewardEntry represents a single claimable reward entry.
message RewardEntry {
  string distribution_id = 1;
  string source = 2;
  repeated cosmos.base.v1beta1.Coin amount = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  int64 created_at = 4;
  int64 expires_at = 5;
  string reason = 6;
}

// ClaimableRewards represents rewards that can be claimed by an address.
message ClaimableRewards {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated cosmos.base.v1beta1.Coin total_claimable = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated RewardEntry reward_entries = 3 [(gogoproto.nullable) = false];
  int64 last_updated = 4;
  repeated cosmos.base.v1beta1.Coin total_claimed = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

// PayoutRecord represents a payout execution record.
message PayoutRecord {
  string payout_id = 1;
  string fiat_conversion_id = 2;
  string invoice_id = 3;
  string settlement_id = 4;
  string escrow_id = 5;
  string order_id = 6;
  string lease_id = 7;
  string provider = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string customer = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated cosmos.base.v1beta1.Coin gross_amount = 10 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin platform_fee = 11 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin validator_fee = 12 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin holdback_amount = 13 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin net_amount = 14 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string state = 15;
  string dispute_id = 16;
  string hold_reason = 17;
  string idempotency_key = 18;
  uint32 execution_attempts = 19;
  int64 last_attempt_at = 20;
  string last_error = 21;
  string tx_hash = 22;
  int64 created_at = 23;
  int64 processed_at = 24;
  int64 completed_at = 25;
  int64 block_height = 26;
  // external_finality_hash is a SHA-256 digest for an authenticated external
  // payout. It is never an on-chain transaction hash.
  bytes external_finality_hash = 27;
  // value_movement_applied is true only after net_amount moved from the
  // settlement account to the governed fiat custody sink.
  bool value_movement_applied = 28;
  // value_movement_effect_hash binds the payout to that exact bank effect.
  bytes value_movement_effect_hash = 29;
}

// FinancialSubjectType identifies the canonical financial lineage root.
enum FinancialSubjectType {
  FINANCIAL_SUBJECT_TYPE_UNSPECIFIED = 0;
  FINANCIAL_SUBJECT_TYPE_ORDER = 1;
  FINANCIAL_SUBJECT_TYPE_INVOICE = 2;
  FINANCIAL_SUBJECT_TYPE_USAGE = 3;
  FINANCIAL_SUBJECT_TYPE_HPC_JOB = 4;
  FINANCIAL_SUBJECT_TYPE_SETTLEMENT = 5;
}

// FinancialClaimType identifies a privacy-safe typed allegation or finding.
enum FinancialClaimType {
  FINANCIAL_CLAIM_TYPE_UNSPECIFIED = 0;
  FINANCIAL_CLAIM_TYPE_BILLING = 1;
  FINANCIAL_CLAIM_TYPE_USAGE = 2;
  FINANCIAL_CLAIM_TYPE_SERVICE = 3;
  FINANCIAL_CLAIM_TYPE_FRAUD = 4;
  FINANCIAL_CLAIM_TYPE_HPC = 5;
  FINANCIAL_CLAIM_TYPE_REVIEW = 6;
  FINANCIAL_CLAIM_TYPE_MODERATION = 7;
  FINANCIAL_CLAIM_TYPE_MIGRATION = 8;
}

// FinancialCaseStatus is the canonical dispute lifecycle state.
enum FinancialCaseStatus {
  FINANCIAL_CASE_STATUS_UNSPECIFIED = 0;
  FINANCIAL_CASE_STATUS_OPEN = 1;
  FINANCIAL_CASE_STATUS_EVIDENCE = 2;
  FINANCIAL_CASE_STATUS_REVIEW = 3;
  FINANCIAL_CASE_STATUS_ESCALATED = 4;
  FINANCIAL_CASE_STATUS_RESOLVED_PENDING_APPEAL = 5;
  FINANCIAL_CASE_STATUS_FINAL = 6;
  FINANCIAL_CASE_STATUS_REJECTED = 7;
  FINANCIAL_CASE_STATUS_CANCELLED = 8;
  FINANCIAL_CASE_STATUS_EXPIRED = 9;
  FINANCIAL_CASE_STATUS_QUARANTINED = 10;
}

// FinancialResolutionType selects the terminal policy applied after appeal.
enum FinancialResolutionType {
  FINANCIAL_RESOLUTION_TYPE_UNSPECIFIED = 0;
  FINANCIAL_RESOLUTION_TYPE_PROVIDER_WIN = 1;
  FINANCIAL_RESOLUTION_TYPE_CUSTOMER_WIN = 2;
  FINANCIAL_RESOLUTION_TYPE_PARTIAL_SPLIT = 3;
  FINANCIAL_RESOLUTION_TYPE_MUTUAL = 4;
  FINANCIAL_RESOLUTION_TYPE_FRAUD_CONFIRMED = 5;
  FINANCIAL_RESOLUTION_TYPE_INCONCLUSIVE_TIMEOUT = 6;
}

// FinancialEffectType identifies an exactly-once terminal side effect.
enum FinancialEffectType {
  FINANCIAL_EFFECT_TYPE_UNSPECIFIED = 0;
  FINANCIAL_EFFECT_TYPE_PAYOUT = 1;
  FINANCIAL_EFFECT_TYPE_ESCROW = 2;
  FINANCIAL_EFFECT_TYPE_REWARD = 3;
  FINANCIAL_EFFECT_TYPE_RESERVATION = 4;
  FINANCIAL_EFFECT_TYPE_REPUTATION = 5;
  FINANCIAL_EFFECT_TYPE_PROJECTION = 6;
}

// FinancialEffectStatus identifies durable effect progress.
enum FinancialEffectStatus {
  FINANCIAL_EFFECT_STATUS_UNSPECIFIED = 0;
  FINANCIAL_EFFECT_STATUS_PENDING = 1;
  FINANCIAL_EFFECT_STATUS_APPLIED = 2;
  FINANCIAL_EFFECT_STATUS_FAILED = 3;
}

// FinancialSubject contains all known privacy-safe lineage identifiers.
message FinancialSubject {
  FinancialSubjectType type = 1;
  string primary_id = 2;
  string order_id = 3;
  string invoice_id = 4;
  string usage_id = 5;
  string hpc_job_id = 6;
  string settlement_id = 7;
  string escrow_id = 8;
  string reservation_id = 9;
  string lease_id = 10;
}

// FinancialClaim is one typed claim merged into the canonical case.
message FinancialClaim {
  string claim_id = 1;
  FinancialClaimType claim_type = 2;
  string claimant = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string source_module = 4;
  string source_reference = 5;
  bytes evidence_hash = 6;
  string encrypted_reference = 7;
  bytes payload_hash = 8;
  bytes idempotency_key = 9;
  int64 created_height = 10;
  int64 created_at = 11;
  string recommendation = 12;
}

// FinancialExposure is the original multi-denom value/capacity held by a case.
message FinancialExposure {
  repeated cosmos.base.v1beta1.Coin escrow_amount = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin payout_amount = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin unclaimed_rewards = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string reservation_id = 4;
  string payout_id = 5;
  string escrow_id = 6;
  repeated cosmos.base.v1beta1.Coin original_held = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string reward_address = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// TerminalAllocation conserves the original held exposure independently per denom.
message TerminalAllocation {
  repeated cosmos.base.v1beta1.Coin original_exposure = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin provider = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin customer = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin platform = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin slash_witness = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string slash_witness_recipient = 6 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  FinancialResolutionType resolution_type = 7;
  bytes allocation_hash = 8;
}

// FinancialAppeal is a bounded privacy-safe appeal filing.
message FinancialAppeal {
  string appeal_id = 1;
  string appellant = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes evidence_hash = 3;
  string encrypted_reference = 4;
  int64 created_height = 5;
  int64 created_at = 6;
  bytes idempotency_key = 7;
}

// FinancialCaseTransition is one append-only audit transition.
message FinancialCaseTransition {
  uint64 sequence = 1;
  FinancialCaseStatus from = 2;
  FinancialCaseStatus to = 3;
  string actor = 4;
  string action = 5;
  bytes reason_hash = 6;
  int64 block_height = 7;
  int64 block_time = 8;
}

// FinancialCaseEffect is an exactly-once persisted terminal effect marker.
message FinancialCaseEffect {
  string effect_id = 1;
  FinancialEffectType type = 2;
  FinancialEffectStatus status = 3;
  string reference_id = 4;
  uint32 attempts = 5;
  int64 applied_height = 6;
  int64 applied_at = 7;
  string error_code = 8;
}

// FinancialCase is the sole authoritative financial dispute aggregate.
message FinancialCase {
  uint32 version = 1;
  string case_id = 2;
  FinancialSubject subject = 3 [(gogoproto.nullable) = false];
  repeated FinancialClaim claims = 4 [(gogoproto.nullable) = false];
  string claimant = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string respondent = 6 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  FinancialExposure exposure = 7 [(gogoproto.nullable) = false];
  FinancialCaseStatus status = 8;
  int64 filing_deadline_height = 9;
  int64 evidence_deadline_height = 10;
  int64 review_deadline_height = 11;
  int64 appeal_deadline_height = 12;
  int64 escalation_deadline_height = 13;
  int64 filing_deadline_time = 14;
  int64 evidence_deadline_time = 15;
  int64 review_deadline_time = 16;
  int64 appeal_deadline_time = 17;
  int64 escalation_deadline_time = 18;
  string resolver_authority = 19 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  TerminalAllocation terminal_allocation = 20;
  repeated FinancialAppeal appeals = 21 [(gogoproto.nullable) = false];
  uint32 max_appeals = 22;
  bytes open_idempotency_key = 23;
  bool migrated = 24;
  bool quarantined = 25;
  string quarantine_reason = 26;
  repeated FinancialCaseTransition transitions = 27 [(gogoproto.nullable) = false];
  repeated FinancialCaseEffect effects = 28 [(gogoproto.nullable) = false];
  int64 created_height = 29;
  int64 created_at = 30;
  int64 updated_height = 31;
  int64 updated_at = 32;
  bytes claim_root = 33;
  uint32 active_hold_count = 34;
  uint32 legacy_source_count = 35;
  string provider = 36 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string customer = 37 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// Generated financial-case events use bounded, privacy-safe fields only.
message EventFinancialCaseOpened { string case_id = 1; string subject_key = 2; FinancialCaseStatus status = 3; uint32 hold_count = 4; }
message EventFinancialClaimAdded { string case_id = 1; string claim_id = 2; FinancialClaimType claim_type = 3; string source_module = 4; }
message EventFinancialCaseHeld { string case_id = 1; string reference_type = 2; string reference_id = 3; }
message EventFinancialCaseReviewed { string case_id = 1; FinancialCaseStatus status = 2; }
message EventFinancialCaseEscalated { string case_id = 1; FinancialCaseStatus status = 2; }
message EventFinancialCaseResolved { string case_id = 1; FinancialResolutionType resolution_type = 2; bytes allocation_hash = 3; }
message EventFinancialCaseAppealed { string case_id = 1; string appeal_id = 2; uint32 appeal_count = 3; }
message EventFinancialCaseFinalized { string case_id = 1; FinancialResolutionType resolution_type = 2; }
message EventFinancialCaseEffectApplied { string case_id = 1; string effect_id = 2; FinancialEffectType effect_type = 3; }
message EventFinancialCaseQuarantined { string case_id = 1; bytes reason_hash = 2; }
message EventFinancialCaseExpired { string case_id = 1; FinancialCaseStatus status = 2; }

// FiatConversionProfileState distinguishes engineering readiness from real
// external production certification. Only CERTIFIED_ENABLED is executable.
enum FiatConversionProfileState {
  FIAT_CONVERSION_PROFILE_STATE_UNSPECIFIED = 0;
  FIAT_CONVERSION_PROFILE_STATE_UNSUPPORTED = 1;
  FIAT_CONVERSION_PROFILE_STATE_ENGINEERING_INCOMPLETE = 2;
  FIAT_CONVERSION_PROFILE_STATE_ENGINEERING_COMPLETE_EXTERNAL_BLOCKED = 3;
  FIAT_CONVERSION_PROFILE_STATE_CERTIFIED_ENABLED = 4;
  FIAT_CONVERSION_PROFILE_STATE_PAUSED = 5;
}

// FiatConversionObservationStage is the legal external execution vocabulary.
enum FiatConversionObservationStage {
  FIAT_CONVERSION_OBSERVATION_STAGE_UNSPECIFIED = 0;
  FIAT_CONVERSION_OBSERVATION_STAGE_QUOTE_ACCEPTED = 1;
  FIAT_CONVERSION_OBSERVATION_STAGE_SWAP_SUBMITTED = 2;
  FIAT_CONVERSION_OBSERVATION_STAGE_SWAP_FINALIZED = 3;
  FIAT_CONVERSION_OBSERVATION_STAGE_PAYOUT_QUOTED = 4;
  FIAT_CONVERSION_OBSERVATION_STAGE_PAYOUT_SUBMITTED = 5;
  FIAT_CONVERSION_OBSERVATION_STAGE_PAYOUT_COMPLETED = 6;
  FIAT_CONVERSION_OBSERVATION_STAGE_FAILED = 7;
  FIAT_CONVERSION_OBSERVATION_STAGE_CANCELLED = 8;
}

// Params defines the parameters for the settlement module.
message Params {
  string platform_fee_rate = 1;
  string validator_fee_rate = 2;
  uint64 min_escrow_duration = 3;
  uint64 max_escrow_duration = 4;
  uint64 settlement_period = 5;
  uint64 reward_claim_expiry = 6;
  string min_settlement_amount = 7;
  uint64 usage_grace_period = 8;
  uint64 staking_reward_epoch_length = 9;
  string verification_reward_amount = 10;
  string payout_holdback_rate = 11;
  uint32 max_payout_retries = 12;
  uint64 dispute_window_duration = 13;
  uint32 usage_reward_rate_bps = 14;
  uint32 usage_reward_cpu_multiplier_bps = 15;
  uint32 usage_reward_memory_multiplier_bps = 16;
  uint32 usage_reward_storage_multiplier_bps = 17;
  uint32 usage_reward_gpu_multiplier_bps = 18;
  uint32 usage_reward_network_multiplier_bps = 19;
  uint32 usage_reward_sla_ontime_multiplier_bps = 20;
  uint32 usage_reward_sla_late_multiplier_bps = 21;
  uint32 usage_reward_ack_multiplier_bps = 22;
  uint32 usage_reward_unack_multiplier_bps = 23;
  bool fiat_conversion_enabled = 24;
  string fiat_conversion_min_amount = 25;
  string fiat_conversion_max_amount = 26;
  string fiat_conversion_daily_limit = 27;
  string fiat_conversion_stable_denom = 28;
  string fiat_conversion_stable_symbol = 29;
  uint32 fiat_conversion_stable_decimals = 30;
  string fiat_conversion_default_fiat = 31;
  string fiat_conversion_default_method = 32;
  string fiat_conversion_max_slippage = 33;
  int32 fiat_conversion_risk_score_threshold = 34;
  string fiat_conversion_min_compliance_status = 35;
  uint64 financial_case_filing_window_seconds = 36;
  uint64 financial_case_evidence_window_seconds = 37;
  uint64 financial_case_review_window_seconds = 38;
  uint64 financial_case_appeal_window_seconds = 39;
  uint64 financial_case_escalation_window_seconds = 40;
  int64 financial_case_filing_window_blocks = 41;
  int64 financial_case_evidence_window_blocks = 42;
  int64 financial_case_review_window_blocks = 43;
  int64 financial_case_appeal_window_blocks = 44;
  int64 financial_case_escalation_window_blocks = 45;
  uint32 financial_case_max_claims = 46;
  uint32 financial_case_max_appeals = 47;
  uint32 financial_case_max_evidence_reference_bytes = 48;
  uint32 financial_case_timeout_batch_limit = 49;
  string fiat_conversion_dex_profile_id = 50;
  bytes fiat_conversion_dex_profile_digest = 51;
  FiatConversionProfileState fiat_conversion_dex_profile_state = 52;
  string fiat_conversion_payout_profile_id = 53;
  bytes fiat_conversion_payout_profile_digest = 54;
  FiatConversionProfileState fiat_conversion_payout_profile_state = 55;
  uint32 fiat_conversion_min_swap_finality_confirmations = 56;
  uint64 fiat_conversion_observation_max_past_seconds = 57;
  uint64 fiat_conversion_observation_max_future_seconds = 58;
  uint32 fiat_conversion_max_observations = 59;
}

// TokenSpec captures token metadata for swaps.
message TokenSpec {
  string symbol = 1;
  string denom = 2;
  uint32 decimals = 3;
  string chain_id = 4;
}

// FiatPayoutPreference configures provider fiat conversion preferences.
message FiatPayoutPreference {
  string provider = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bool enabled = 2;
  string fiat_currency = 3;
  string payment_method = 4;
  string destination_ref = 5;
  string destination_hash = 6;
  string destination_region = 7;
  string preferred_dex = 8;
  string preferred_off_ramp = 9;
  double slippage_tolerance = 10;
  TokenSpec crypto_token = 11 [(gogoproto.nullable) = false];
  TokenSpec stable_token = 12 [(gogoproto.nullable) = false];
  int64 created_at = 13;
  int64 updated_at = 14;
  // slippage_tolerance_exact is the canonical decimal used for decisions.
  // The legacy double at field 10 remains read-only compatibility data.
  string slippage_tolerance_exact = 15;
}

// FiatConversionAuditEntry is an audit log entry for conversions.
message FiatConversionAuditEntry {
  string action = 1;
  string actor = 2;
  string reason = 3;
  int64 timestamp = 4;
  map<string, string> metadata = 5;
}

// FiatConversionStateTransition records a durable payout state transition.
message FiatConversionStateTransition {
  string from = 1;
  string to = 2;
  string event = 3;
  string reason = 4;
  int64 timestamp = 5;
  map<string, string> metadata = 6;
}

// FiatConversionObservation is one authenticated, privacy-safe evidence node.
message FiatConversionObservation {
  uint64 sequence = 1;
  bytes idempotency_key = 2;
  FiatConversionObservationStage stage = 3;
  string status = 4;
  int64 observed_at = 5;
  int64 recorded_at = 6;
  int64 recorded_height = 7;
  bytes evidence_hash = 8;
  bytes observation_digest = 9;
  bytes lineage_digest = 10;
  string failure_code = 11;
}

// Generated events contain no PII or free-form external evidence.
message EventFiatConversionObservationRecorded {
  string conversion_id = 1;
  string provider = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 observation_sequence = 3;
  FiatConversionObservationStage stage = 4;
  string state = 5;
  bytes observation_digest = 6;
  int64 recorded_height = 7;
}
message EventFiatConversionTerminal {
  string conversion_id = 1;
  string payout_id = 2;
  FiatConversionObservationStage stage = 3;
  string terminal_policy = 4;
  bytes evidence_hash = 5;
}

// FiatConversionRecord stores conversion details.
message FiatConversionRecord {
  string conversion_id = 1;
  string invoice_id = 2;
  string settlement_id = 3;
  string payout_id = 4;
  string escrow_id = 5;
  string order_id = 6;
  string lease_id = 7;
  string provider = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string customer = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string requested_by = 10;
  int64 requested_at = 11;
  int64 updated_at = 12;
  string state = 13;
  TokenSpec crypto_token = 14 [(gogoproto.nullable) = false];
  TokenSpec stable_token = 15 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin crypto_amount = 16 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin stable_amount = 17 [(gogoproto.nullable) = false];
  string fiat_currency = 18;
  string fiat_amount = 19;
  string payment_method = 20;
  string destination_ref = 21;
  string destination_hash = 22;
  string destination_region = 23;
  double slippage_tolerance = 24;
  string dex_adapter = 25;
  string swap_quote_id = 26;
  string swap_tx_hash = 27;
  string swap_status = 28;
  string off_ramp_provider = 29;
  string off_ramp_quote_id = 30;
  string off_ramp_id = 31;
  string off_ramp_status = 32;
  string off_ramp_reference = 33;
  string compliance_status = 34;
  int32 compliance_risk_score = 35;
  int64 compliance_checked_at = 36;
  string failure_reason = 37;
  repeated FiatConversionAuditEntry audit_trail = 38 [(gogoproto.nullable) = false];
  string idempotency_key = 39;
  uint32 swap_attempts = 40;
  uint32 off_ramp_attempts = 41;
  uint32 payout_attempts = 42;
  int64 last_error_at = 43;
  string last_error = 44;
  repeated FiatConversionStateTransition transition_history = 45 [(gogoproto.nullable) = false];
  uint32 protocol_version = 46;
  uint64 observation_sequence = 47;
  bytes last_observation_digest = 48;
  repeated FiatConversionObservation observations = 49 [(gogoproto.nullable) = false];
  string dex_profile_id = 50;
  bytes dex_profile_digest = 51;
  string payout_profile_id = 52;
  bytes payout_profile_digest = 53;
  bytes quote_digest = 54;
  int64 quote_expiry = 55;
  cosmos.base.v1beta1.Coin minimum_stable_output = 56 [(gogoproto.nullable) = false];
  int64 swap_height = 57;
  bytes swap_block_hash = 58;
  uint32 swap_finality_confirmations = 59;
  bytes swap_finality_hash = 60;
  bytes payout_finality_hash = 61;
  bytes compliance_decision_hash = 62;
  bytes privacy_safe_reference_hash = 63;
  bytes evidence_hash = 64;
  bytes request_digest = 65;
  string daily_bucket = 66;
  bool legacy_quarantined = 67;
  string quarantine_reason = 68;
  string terminal_policy = 69;
  bool value_movement_applied = 70;
  // slippage_tolerance_exact is the canonical decimal used for decisions.
  // The legacy double at field 24 remains read-only compatibility data.
  string slippage_tolerance_exact = 71;
  // daily_quota_reserved is true exactly while this record contributes to the
  // provider/day reservation total.
  bool daily_quota_reserved = 72;
  cosmos.base.v1beta1.Coin custody_sink_amount = 73 [(gogoproto.nullable) = false];
  bytes custody_sink_effect_hash = 74;
}

