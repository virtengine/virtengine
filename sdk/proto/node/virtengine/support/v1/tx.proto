syntax = "proto3";
package virtengine.support.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "virtengine/support/v1/types.proto";

option go_package = "github.com/virtengine/virtengine/sdk/go/node/support/v1";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateSupportRequest(MsgCreateSupportRequest) returns (MsgCreateSupportRequestResponse);
  rpc UpdateSupportRequest(MsgUpdateSupportRequest) returns (MsgUpdateSupportRequestResponse);
  rpc AddSupportResponse(MsgAddSupportResponse) returns (MsgAddSupportResponseResponse);
  rpc ArchiveSupportRequest(MsgArchiveSupportRequest) returns (MsgArchiveSupportRequestResponse);
  rpc RegisterExternalTicket(MsgRegisterExternalTicket) returns (MsgRegisterExternalTicketResponse);
  rpc UpdateExternalTicket(MsgUpdateExternalTicket) returns (MsgUpdateExternalTicketResponse);
  rpc RemoveExternalTicket(MsgRemoveExternalTicket) returns (MsgRemoveExternalTicketResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgCreateSupportRequest {
  option (gogoproto.equal) = false;
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "support/MsgCreateSupportRequest";

  string sender = 1 [
    (gogoproto.jsontag) = "sender",
    (gogoproto.moretags) = "yaml:\"sender\""
  ];
  string category = 2 [
    (gogoproto.jsontag) = "category",
    (gogoproto.moretags) = "yaml:\"category\""
  ];
  string priority = 3 [
    (gogoproto.jsontag) = "priority",
    (gogoproto.moretags) = "yaml:\"priority\""
  ];
  EncryptedSupportPayload payload = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "payload",
    (gogoproto.moretags) = "yaml:\"payload\""
  ];
  RelatedEntity related_entity = 5 [
    (gogoproto.jsontag) = "related_entity,omitempty",
    (gogoproto.moretags) = "yaml:\"related_entity\""
  ];
  map<string, string> public_metadata = 6 [
    (gogoproto.jsontag) = "public_metadata,omitempty",
    (gogoproto.moretags) = "yaml:\"public_metadata\""
  ];
}

message MsgCreateSupportRequestResponse {
  string ticket_id = 1 [
    (gogoproto.jsontag) = "ticket_id",
    (gogoproto.moretags) = "yaml:\"ticket_id\""
  ];
  string ticket_number = 2 [
    (gogoproto.jsontag) = "ticket_number",
    (gogoproto.moretags) = "yaml:\"ticket_number\""
  ];
}

message MsgUpdateSupportRequest {
