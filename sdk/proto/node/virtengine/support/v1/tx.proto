    (gogoproto.jsontag) = "ticket_id",
    (gogoproto.moretags) = "yaml:\"ticket_id\""
  ];
  string category = 3 [
    (gogoproto.jsontag) = "category,omitempty",
    (gogoproto.moretags) = "yaml:\"category\""
  ];
  string priority = 4 [
    (gogoproto.jsontag) = "priority,omitempty",
    (gogoproto.moretags) = "yaml:\"priority\""
  ];
  string status = 5 [
    (gogoproto.jsontag) = "status,omitempty",
    (gogoproto.moretags) = "yaml:\"status\""
  ];
  string assigned_agent = 6 [
    (gogoproto.jsontag) = "assigned_agent,omitempty",
    (gogoproto.moretags) = "yaml:\"assigned_agent\""
  ];
  EncryptedSupportPayload payload = 7 [
    (gogoproto.jsontag) = "payload,omitempty",
    (gogoproto.moretags) = "yaml:\"payload\""
  ];
  map<string, string> public_metadata = 8 [
    (gogoproto.jsontag) = "public_metadata,omitempty",
    (gogoproto.moretags) = "yaml:\"public_metadata\""
  ];
}

message MsgUpdateSupportRequestResponse {}

