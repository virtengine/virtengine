    (gogoproto.moretags) = "yaml:\"allowed_external_domains\""
  ];
  repeated string support_recipient_key_ids = 3 [
    (gogoproto.jsontag) = "support_recipient_key_ids,omitempty",
    (gogoproto.moretags) = "yaml:\"support_recipient_key_ids\""
  ];
  bool require_support_recipients = 4 [
    (gogoproto.jsontag) = "require_support_recipients",
    (gogoproto.moretags) = "yaml:\"require_support_recipients\""
  ];
  uint32 max_responses_per_request = 5 [
    (gogoproto.jsontag) = "max_responses_per_request",
    (gogoproto.moretags) = "yaml:\"max_responses_per_request\""
  ];
  RetentionPolicy default_retention_policy = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "default_retention_policy",
    (gogoproto.moretags) = "yaml:\"default_retention_policy\""
  ];
}
