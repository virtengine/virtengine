message SupportResponse {
  string id = 1 [
    (gogoproto.jsontag) = "id",
    (gogoproto.moretags) = "yaml:\"id\""
  ];
  string request_id = 2 [
    (gogoproto.jsontag) = "request_id",
    (gogoproto.moretags) = "yaml:\"request_id\""
  ];
  string author_address = 3 [
    (gogoproto.jsontag) = "author_address",
    (gogoproto.moretags) = "yaml:\"author_address\""
  ];
  bool is_agent = 4 [
    (gogoproto.jsontag) = "is_agent",
    (gogoproto.moretags) = "yaml:\"is_agent\""
  ];
  EncryptedSupportPayload payload = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "payload",
    (gogoproto.moretags) = "yaml:\"payload\""
  ];
  google.protobuf.Timestamp created_at = 6 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "created_at",
    (gogoproto.moretags) = "yaml:\"created_at\""
