    (gogoproto.moretags) = "yaml:\"category\""
  ];
  string priority = 5 [
    (gogoproto.jsontag) = "priority",
    (gogoproto.moretags) = "yaml:\"priority\""
  ];
  string status = 6 [
    (gogoproto.jsontag) = "status",
    (gogoproto.moretags) = "yaml:\"status\""
  ];
  EncryptedSupportPayload payload = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "payload",
    (gogoproto.moretags) = "yaml:\"payload\""
  ];
  map<string, string> public_metadata = 8 [
    (gogoproto.jsontag) = "public_metadata,omitempty",
    (gogoproto.moretags) = "yaml:\"public_metadata\""
  ];
  RelatedEntity related_entity = 9 [
    (gogoproto.jsontag) = "related_entity,omitempty",
    (gogoproto.moretags) = "yaml:\"related_entity\""
  ];
  repeated string recipients = 10 [
    (gogoproto.jsontag) = "recipients,omitempty",
    (gogoproto.moretags) = "yaml:\"recipients\""
  ];
  string assigned_agent = 11 [
    (gogoproto.jsontag) = "assigned_agent,omitempty",
    (gogoproto.moretags) = "yaml:\"assigned_agent\""
  ];
  google.protobuf.Timestamp assigned_at = 12 [
    (gogoproto.stdtime) = true,
    (gogoproto.jsontag) = "assigned_at,omitempty",
    (gogoproto.moretags) = "yaml:\"assigned_at\""
  ];
  google.protobuf.Timestamp created_at = 13 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "created_at",
    (gogoproto.moretags) = "yaml:\"created_at\""
  ];
  google.protobuf.Timestamp updated_at = 14 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "updated_at",
    (gogoproto.moretags) = "yaml:\"updated_at\""
  ];
  google.protobuf.Timestamp last_response_at = 15 [
    (gogoproto.stdtime) = true,
    (gogoproto.jsontag) = "last_response_at,omitempty",
    (gogoproto.moretags) = "yaml:\"last_response_at\""
  ];
  google.protobuf.Timestamp resolved_at = 16 [
    (gogoproto.stdtime) = true,
    (gogoproto.jsontag) = "resolved_at,omitempty",
    (gogoproto.moretags) = "yaml:\"resolved_at\""
  ];
  google.protobuf.Timestamp closed_at = 17 [
    (gogoproto.stdtime) = true,
    (gogoproto.jsontag) = "closed_at,omitempty",
    (gogoproto.moretags) = "yaml:\"closed_at\""
  ];
  RetentionPolicy retention_policy = 18 [
    (gogoproto.jsontag) = "retention_policy,omitempty",
    (gogoproto.moretags) = "yaml:\"retention_policy\""
  ];
  bool archived = 19 [
    (gogoproto.jsontag) = "archived",
    (gogoproto.moretags) = "yaml:\"archived\""
  ];
  google.protobuf.Timestamp archived_at = 20 [
    (gogoproto.stdtime) = true,
    (gogoproto.jsontag) = "archived_at,omitempty",
    (gogoproto.moretags) = "yaml:\"archived_at\""
  ];
  string archive_reason = 21 [
    (gogoproto.jsontag) = "archive_reason,omitempty",
    (gogoproto.moretags) = "yaml:\"archive_reason\""
  ];
  bool purged = 22 [
    (gogoproto.jsontag) = "purged",
    (gogoproto.moretags) = "yaml:\"purged\""
  ];
  google.protobuf.Timestamp purged_at = 23 [
    (gogoproto.stdtime) = true,
    (gogoproto.jsontag) = "purged_at,omitempty",
    (gogoproto.moretags) = "yaml:\"purged_at\""
  ];
  string purge_reason = 24 [
    (gogoproto.jsontag) = "purge_reason,omitempty",
    (gogoproto.moretags) = "yaml:\"purge_reason\""
