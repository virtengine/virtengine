syntax = "proto3";
package virtengine.support.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "virtengine/encryption/v1/types.proto";

option go_package = "github.com/virtengine/virtengine/sdk/go/node/support/v1";

message EncryptedSupportPayload {
  virtengine.encryption.v1.EncryptedPayloadEnvelope envelope = 1 [
    (gogoproto.jsontag) = "envelope,omitempty",
    (gogoproto.moretags) = "yaml:\"envelope\""
  ];
  string envelope_ref = 2 [
    (gogoproto.jsontag) = "envelope_ref,omitempty",
    (gogoproto.moretags) = "yaml:\"envelope_ref\""
  ];
  bytes envelope_hash = 3 [
    (gogoproto.jsontag) = "envelope_hash,omitempty",
    (gogoproto.moretags) = "yaml:\"envelope_hash\""
  ];
  uint32 payload_size = 4 [
    (gogoproto.jsontag) = "payload_size,omitempty",
    (gogoproto.moretags) = "yaml:\"payload_size\""
  ];
}

message RelatedEntity {
  string type = 1 [
    (gogoproto.jsontag) = "type",
    (gogoproto.moretags) = "yaml:\"type\""
  ];
  string id = 2 [
    (gogoproto.jsontag) = "id",
    (gogoproto.moretags) = "yaml:\"id\""
  ];
}

message RetentionPolicy {
  uint32 version = 1 [
    (gogoproto.jsontag) = "version",
    (gogoproto.moretags) = "yaml:\"version\""
  ];
  int64 archive_after_seconds = 2 [
    (gogoproto.jsontag) = "archive_after_seconds,omitempty",
    (gogoproto.moretags) = "yaml:\"archive_after_seconds\""
  ];
  int64 purge_after_seconds = 3 [
    (gogoproto.jsontag) = "purge_after_seconds,omitempty",
    (gogoproto.moretags) = "yaml:\"purge_after_seconds\""
  ];
  google.protobuf.Timestamp created_at = 4 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "created_at",
    (gogoproto.moretags) = "yaml:\"created_at\""
  ];
  int64 created_at_block = 5 [
    (gogoproto.jsontag) = "created_at_block",
    (gogoproto.moretags) = "yaml:\"created_at_block\""
  ];
}

message ExternalTicketRef {
  string resource_id = 1 [
    (gogoproto.jsontag) = "resource_id",
    (gogoproto.moretags) = "yaml:\"resource_id\""
  ];
  string resource_type = 2 [
    (gogoproto.jsontag) = "resource_type",
    (gogoproto.moretags) = "yaml:\"resource_type\""
  ];
  string external_system = 3 [
    (gogoproto.jsontag) = "external_system",
    (gogoproto.moretags) = "yaml:\"external_system\""
  ];
  string external_ticket_id = 4 [
    (gogoproto.jsontag) = "external_ticket_id",
    (gogoproto.moretags) = "yaml:\"external_ticket_id\""
  ];
  string external_url = 5 [
    (gogoproto.jsontag) = "external_url,omitempty",
    (gogoproto.moretags) = "yaml:\"external_url\""
  ];
  google.protobuf.Timestamp created_at = 6 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "created_at",
    (gogoproto.moretags) = "yaml:\"created_at\""
  ];
  string created_by = 7 [
    (gogoproto.jsontag) = "created_by",
    (gogoproto.moretags) = "yaml:\"created_by\""
  ];
  google.protobuf.Timestamp updated_at = 8 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "updated_at",
    (gogoproto.moretags) = "yaml:\"updated_at\""
  ];
}

message SupportRequest {
  string id = 1 [
    (gogoproto.jsontag) = "id",
    (gogoproto.moretags) = "yaml:\"id\""
