[tool.poetry]
name = "virtengine"
version = "0.1.0"
description = "Python SDK for VirtEngine blockchain"
authors = ["VirtEngine <sdk@virtengine.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/virtengine/virtengine"
repository = "https://github.com/virtengine/virtengine/tree/main/sdk/python"
# https://docs.virtengine.com/sdk/python is a 404 (that path is not published on
# the live docs site); point at the in-repo docs, which do resolve.
documentation = "https://github.com/virtengine/virtengine/tree/main/sdk/python"
keywords = ["blockchain", "cosmos", "sdk", "identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
packages = [
    { include = "virtengine" },
    { include = "cosmos" },
    # cometbft is imported by the generated cosmos/* gencode
    # (cosmos/base/abci/v1beta1/abci_pb2.py:26 imports cometbft.abci.v2), so
    # the built wheel is unusable without it. It was present in the tree but
    # absent from this list, so `pip install ./sdk/python` produced a package
    # that raised ModuleNotFoundError: No module named 'cometbft' on import.
    { include = "cometbft" },
    { include = "cosmos_proto" },
    { include = "gogoproto" },
    { include = "amino" },
    { include = "k8s_io" },
]
include = ["virtengine/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
grpcio = "^1.60.0"
# The checked-in gencode is mixed-version: of the 194 tracked *_pb2.py
# files, 179 carry "# Protobuf Python Version: 6.33.5" and 15 carry
# 7.36.2 (see sdk/README.md). Every protobuf >=5 runtime validates gencode
# at import time and hard-fails on a version older than its own, so the
# runtime must be at or above the NEWEST gencode in the tree. 7.36.2 is the
# measured floor: with it, `pytest tests/ --collect-only` exits 0. Do not
# lower this pin without regenerating the whole tree from one protoc.
protobuf = ">=7.36.2,<8"
# Supplies google/api/* (annotations_pb2, http_pb2). That tree is NOT checked
# in any more: the deleted sdk/python/google/ package shadowed the protobuf
# runtime (see sdk/README.md), so `from google.api import annotations_pb2`
# must now resolve from this dependency. Without it collection fails 3/3.
googleapis-common-protos = "^1.75.0"
bip-utils = "^2.9.0"
cryptography = "^46.0.5"
bech32 = "^1.2.0"
websockets = "^12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
ruff = "^0.1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
