# VirtEngine DR Backup CronJobs
# These jobs consume the canonical deploy/kubernetes resources. They do not
# define application workloads or access the independent remote-signer custody
# boundary.
---
apiVersion: v1
kind: Namespace
metadata:
  name: dr-system
  labels:
    name: dr-system
    virtengine.com/managed-by: terraform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-backup-sa
  namespace: virtengine
  annotations:
    eks.amazonaws.com/role-arn: "${DR_BACKUP_IAM_ROLE_ARN}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dr-backup-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-backup-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dr-backup-role
subjects:
  - kind: ServiceAccount
    name: dr-backup-sa
    namespace: virtengine
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-backup-chain-state
  namespace: virtengine
  labels:
    app: dr-backup
    component: chain-state
spec:
  schedule: "0 */4 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: dr-backup
            component: chain-state
        spec:
          serviceAccountName: dr-backup-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/virtengine/dr-tools@sha256:85c0d1f6e31b4f77a9c2db9af5082e8c43c29f7a8be77a2a1e764ec67e05985c
              imagePullPolicy: IfNotPresent
              command: ["/scripts/dr/backup-chain-state.sh"]
              env:
                - name: DR_BUCKET
                  value: "s3://virtengine-dr-backups"
                - name: NODE_HOME
                  value: "/opt/virtengine"
                - name: SNAPSHOT_DIR
                  value: "/data/snapshots"
                - name: RETENTION_COUNT
                  value: "10"
                - name: CANONICAL_VALIDATOR_STATEFULSET
                  value: "virtengine-validator"
                - name: CANONICAL_VALIDATOR_PVC
                  value: "data-virtengine-validator-0"
                - name: AWS_REGION
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['eks.amazonaws.com/region']
              volumeMounts:
                - name: validator-data
                  mountPath: /opt/virtengine
                  readOnly: true
                - name: snapshots
                  mountPath: /data/snapshots
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  cpu: 2000m
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: validator-data
              persistentVolumeClaim:
                claimName: data-virtengine-validator-0
            - name: snapshots
              persistentVolumeClaim:
                claimName: snapshot-storage
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-backup-provider-state
  namespace: virtengine
  labels:
    app: dr-backup
    component: provider-state
spec:
  schedule: "30 */4 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: dr-backup
            component: provider-state
        spec:
          serviceAccountName: dr-backup-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/virtengine/dr-tools@sha256:85c0d1f6e31b4f77a9c2db9af5082e8c43c29f7a8be77a2a1e764ec67e05985c
              imagePullPolicy: IfNotPresent
              command: ["/scripts/dr/backup-provider-state.sh"]
              env:
                - name: DR_BUCKET
                  value: "s3://virtengine-dr-backups"
                - name: PROVIDER_HOME
                  value: "/var/lib/virtengine/provider"
                - name: PROVIDER_KEY_DIR
                  value: "/var/lib/virtengine/provider/keys"
                - name: PROVIDER_HA_STATE_DIR
                  value: "/var/lib/virtengine/provider-ha"
                - name: PROVIDER_SNAPSHOT_DIR
                  value: "/secure/backups"
                - name: SNAPSHOT_SIGNING_REQUIRED
                  value: "1"
                - name: SNAPSHOT_SIGNING_KEY
                  value: "/var/run/secrets/virtengine/dr/snapshot-signing-key"
                - name: CANONICAL_PROVIDER_STATEFULSET
                  value: "provider-daemon"
                - name: CANONICAL_PROVIDER_SHARED_PVC
                  value: "provider-ha-state"
                - name: AWS_REGION
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['eks.amazonaws.com/region']
              volumeMounts:
                - name: provider-ha-state
                  mountPath: /var/lib/virtengine/provider-ha
                  readOnly: true
                - name: provider-backups
                  mountPath: /var/lib/virtengine/provider-backups
                  readOnly: true
                - name: provider-identity
                  mountPath: /var/lib/virtengine/provider
                  readOnly: true
                - name: backup-storage
                  mountPath: /secure/backups
                - name: tmp
                  mountPath: /tmp
                - name: snapshot-signing-key
                  mountPath: /var/run/secrets/virtengine/dr
                  readOnly: true
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 1000m
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: provider-ha-state
              persistentVolumeClaim:
                claimName: provider-ha-state
            - name: provider-backups
              persistentVolumeClaim:
                claimName: provider-backups
            - name: provider-identity
              persistentVolumeClaim:
                claimName: provider-data
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-storage
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: snapshot-signing-key
              secret:
                secretName: dr-backup-signing-key
                defaultMode: 0400
                items:
                  - key: private-key.pem
                    path: snapshot-signing-key
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-tests
  namespace: virtengine
  labels:
    app: dr-test
    component: validation
spec:
  schedule: "0 6 * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app: dr-test
            component: validation
        spec:
          serviceAccountName: dr-backup-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: test
              image: ghcr.io/virtengine/dr-tools@sha256:85c0d1f6e31b4f77a9c2db9af5082e8c43c29f7a8be77a2a1e764ec67e05985c
              imagePullPolicy: IfNotPresent
              command: ["/scripts/dr/dr-test.sh", "--report", "--notify"]
              env:
                - name: DR_BUCKET
                  value: "s3://virtengine-dr-backups"
                - name: TEST_ENVIRONMENT
                  value: "production"
                - name: RESULTS_DIR
                  value: "/var/log/dr-tests"
                - name: SLACK_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: dr-secrets
                      key: slack-webhook
                      optional: true
                - name: AWS_REGION
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['eks.amazonaws.com/region']
              volumeMounts:
                - name: test-results
                  mountPath: /var/log/dr-tests
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: test-results
              emptyDir: {}
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snapshot-storage
  namespace: virtengine
  labels:
    app: dr-backup
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-encrypted
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage
  namespace: virtengine
  labels:
    app: dr-backup
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-encrypted
  resources:
    requests:
      storage: 100Gi
