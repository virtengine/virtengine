apiVersion: v1
kind: ConfigMap
metadata:
  name: slurm-config
data:
  slurm.conf: |
    NodeName=slurm-compute-[0-1] CPUs=4
    NodeName=slurm-gpu-0 CPUs=8
    NodeName=slurm-memory-[0-1] CPUs=4
    PartitionName=normal Nodes=slurm-compute-[0-1],slurm-gpu-0,slurm-memory-[0-1] MaxNodes=5
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slurm-compute
  labels:
    app.kubernetes.io/component: compute
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slurm-gpu
  labels:
    app.kubernetes.io/component: compute
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slurm-memory
  labels:
    app.kubernetes.io/component: compute
spec:
  replicas: 2