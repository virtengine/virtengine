---
version: "2"
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - errchkjson
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unparam
    - unused
  # Note: gofmt is a formatter, not a linter. Auto-formatting is handled by
  # pre-commit hook. golangci-lint only runs actual linters (not formatters).
  settings:
    goconst:
      # Table-driven tests legitimately repeat the same literal across cases
      # ("test", "true", a fixture account name); hoisting each into a named
      # constant makes the cases harder to read, not easier. goconst still
      # applies to non-test code.
      ignore-tests: true
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
        - G304
  exclusions:
    rules:
      - path: vendor/
        linters:
          - all
      - path: (.+)\.go$
        text: comment on exported (method|function|type|const|var)
      - path: _config\.go$
        text: G101
        linters:
          - gosec
      - path: (.+)/simulation/.+\.go$
        text: G101
        linters:
          - gosec
# Formatting handled by pre-commit hook (.git/hooks/pre-commit)
# golangci-lint only checks non-auto-fixable issues